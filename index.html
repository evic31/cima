<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Repositorio">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reposición BLOQUE QUIRÚRGICO · CIMA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <style>
        :root {
            --bg:          #f5ece0;
            --surface:     #ffffff;
            --surf2:       #eef4ff;
            --border:      #d5e3ff;
            --border2:     #b8cfff;
            --text:        #2d3142;
            --text-muted:  #6b7899;
            --accent:      #58A6FF;
            --accent-dark: #3a90f0;
            --header-bg:   #58A6FF;
            --tab-bg:      rgba(255,255,255,0.18);
            --tab-active:  #ffffff;
            --tab-text:    rgba(255,255,255,0.75);
            --tab-text-a:  #58A6FF;
            --izq:         #059669;
            --der:         #2563eb;
            --pharma:      #dc2626;
            --unk:         #475569;
            --danger:      #ef4444;
            --success:     #10b981;
            --warning:     #f59e0b;
            --shadow-sm:   0 2px 12px rgba(88,166,255,.10);
            --radius:      10px;
            --radius-sm:   7px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        /* (19-nov) el iPhone agrandaba por su cuenta la letra de los bloques con más texto (Carro Enfermería más grande que Anestesia) */
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* ── TOP ── */
        .top-wrapper {
            position: sticky;
            top: 0;
            z-index: 200;
        }
        header {
            background: var(--header-bg);
            color: #ffffff;
            padding: 0.75rem 1rem;
            text-align: center;
            box-shadow: 0 2px 16px rgba(88,166,255,.30);
            position: relative;
        }
        .header-info-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 15px;
            line-height: 1;
        }
        header h1 {
            font-size: clamp(0.9rem, 3.8vw, 1.15rem);
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        header h1 span { color: #FFEDD5; }
        /* (19-nov) logo BQ Repo en caja blanca, como el resto de herramientas del BQ */
        header { padding: 0.5rem 3rem; }
        .hdr-marca { display: block; margin: 0 auto; height: 58px; width: auto; background: #fff; border-radius: 12px; padding: 3px 10px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
        /* pestañas de localización = etiquetas del Mapa Personal (REA, UCSI, 1–8, HDM) */
        .tabs { align-items: center; }
        .tab.tab-ico { padding: 3px; background: #fff; border: 2.5px solid #fff; border-radius: 12px; line-height: 0; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
        .tab.tab-ico img { width: 38px; height: 38px; display: block; pointer-events: none; }
        .tab.tab-ico:hover { background: #fff; }
        .tab.tab-ico.active { border-color: #1d4f9c; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
        /* (19-nov) la cabecera toma el color del quirófano abierto (colores de UCSI): así no se mezclan quirófanos */
        body[data-q="1"] { --header-bg: #dd3030; }
        body[data-q="2"] { --header-bg: #d8db2d; }
        body[data-q="3"] { --header-bg: #179e08; }
        body[data-q="4"] { --header-bg: #963499; }
        body[data-q="5"] { --header-bg: #ffffff; }
        body[data-q="6"] { --header-bg: #3190e4; }
        body[data-q="7"] { --header-bg: #e57207; }
        /* Q8 y Hemo: franjas HORIZONTALES sobre toda la cabecera (logo + pestañas); arriba un solo color → la barra del iPhone lo coge */
        body[data-q="8"], body[data-q="hemo"] { --header-bg: transparent; }
        /* (19-nov) franjas con colores LISOS, no degradado: el iPhone no lee el color de un degradado para la barra de la hora.
           Arriba = fondo de .top-wrapper; medio y abajo = ::before / ::after detrás de la cabecera y las pestañas */
        body[data-q="8"] .top-wrapper, body[data-q="hemo"] .top-wrapper { --f2: #c5a2e5; --f3: #f1e690; }
        body[data-q="hemo"] .top-wrapper { --f2: #e87878; }
        body[data-q="8"] .top-wrapper::before, body[data-q="hemo"] .top-wrapper::before,
        body[data-q="8"] .top-wrapper::after, body[data-q="hemo"] .top-wrapper::after { content: ''; position: absolute; left: 0; right: 0; z-index: 0; }
        body[data-q="8"] .top-wrapper::before, body[data-q="hemo"] .top-wrapper::before { top: 33.3%; height: 33.4%; background-color: var(--f2); }
        body[data-q="8"] .top-wrapper::after, body[data-q="hemo"] .top-wrapper::after { top: 66.6%; bottom: 0; background-color: var(--f3); }
        .top-wrapper > header, .top-wrapper > .tabs-container { position: relative; z-index: 1; }
        /* colores claros: letra oscura en RESUMEN/Editor/Orden y en ℹ */
        body[data-q="2"], body[data-q="5"], body[data-q="8"], body[data-q="hemo"] { --tab-text: #1e293b; --tab-bg: rgba(255,255,255,0.6); }
        body[data-q="2"] .header-info-btn, body[data-q="5"] .header-info-btn, body[data-q="8"] .header-info-btn, body[data-q="hemo"] .header-info-btn { color: #1e293b; border-color: rgba(0,0,0,.35); background: rgba(255,255,255,.6); }
        body[data-q="5"] .tabs-container { border-bottom: 2px solid #000; }
        body[data-q] header { box-shadow: none; }
        /* color liso de la barra fija de arriba (lo que lee el iPhone para la barra de la hora): el del quirófano;
           en Q8/Hemo la franja de arriba (con franjas verticales no podía elegir y se quedaba con el color anterior) */
        .top-wrapper { background-color: var(--barra, #58A6FF); }
        body[data-q="1"] { --barra: #dd3030; } body[data-q="2"] { --barra: #d8db2d; } body[data-q="3"] { --barra: #179e08; }
        body[data-q="4"] { --barra: #963499; } body[data-q="5"] { --barra: #ffffff; } body[data-q="6"] { --barra: #3190e4; }
        body[data-q="7"] { --barra: #e57207; } body[data-q="8"] { --barra: #87c6f4; } body[data-q="hemo"] { --barra: #8bc9a2; }
        /* (19-nov) RESUMEN arriba a la derecha (sin scroll) e ℹ a la izquierda */
        header .header-info-btn { right: auto; left: 12px; }
        header .tab.hdr-resumen { position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: #fff; color: #1d4f9c; border: 2.5px solid #fff; font-weight: 700; font-size: 0.8rem;
            padding: 0.32rem 0.75rem; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
        header .tab.hdr-resumen.active { border-color: #1d4f9c; color: #1d4f9c; background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.25); }

        /* ── TABS ── */
        .tabs-container {
            background: var(--header-bg);
            overflow-x: auto;
            padding: 0.5rem 0.8rem 0.6rem;
            scrollbar-width: none;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tabs { display: flex; gap: 5px; width: max-content; }
        .tab {
            padding: 0.38rem 0.95rem;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--tab-bg);
            color: var(--tab-text);
            font-weight: 600;
            font-size: 0.8rem;
            font-family: 'IBM Plex Sans', sans-serif;
            border-radius: 999px;
            transition: all 0.18s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tab:hover { background: rgba(255,255,255,0.13); color: #e2e8f0; }
        .tab.active {
            background: var(--tab-active);
            color: var(--tab-text-a);
            border-color: var(--tab-active);
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
            font-weight: 700;
        }
        .tab.tab-editor {
            border-color: rgba(245,158,11,0.4);
            color: #f59e0b;
        }
        .tab.tab-editor.active {
            background: var(--warning);
            border-color: var(--warning);
            box-shadow: 0 0 14px rgba(245,158,11,0.4);
        }

        /* ── CONTENT ── */
        main { padding: 1rem 0.85rem 6rem; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeUp 0.2s ease; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(5px); }
            to   { opacity: 1; transform: none; }
        }

        /* ── LOCATION GROUP ── */
        .location-group {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 0.85rem;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        .sub-header {
            padding: 0.6rem 1rem;
            font-weight: 700;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #fff;
            background: var(--unk);
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }
        .sub-header::before {
            content: '';
            width: 5px; height: 5px;
            border-radius: 50%;
            background: rgba(255,255,255,0.55);
            flex-shrink: 0;
        }
        .sub-header.almacen-izq { background: var(--izq); }
        .sub-header.almacen-der { background: var(--der); }
        .sub-header.farmacia    { background: var(--pharma); }
        .sub-header.desconocido { background: var(--unk); }

        /* ── ITEMS ── */
        .item-list { padding: 0.15rem 0; }
        .item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
            padding: 0.7rem 0.95rem;
            border-bottom: 1px solid var(--border);
        }
        .item:last-child { border-bottom: none; }
        .item.item-fila { flex-direction: row; align-items: center; gap: 0.75rem; }
        .item.item-fila .item-name { flex: 1; width: auto; min-width: 0; }
        .item.item-fila .item-controls { width: auto; flex-shrink: 0; justify-content: flex-end; }
        /* nombres de opción largos: el nombre y las casillas comparten la primera línea; el resto, a la derecha y a su medida */
        .item.item-abajo { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 0.4rem; }
        .item.item-abajo .item-name { width: auto; margin-right: auto; padding-right: 0.35rem; }
        .item.item-abajo .item-controls { display: contents; }
        .item-controls.rejilla { display: grid; grid-auto-flow: column; grid-template-rows: repeat(var(--filas), auto); direction: rtl; gap: 0.35rem 0.4rem; }
        .item-controls.rejilla .checkbox-group { direction: ltr; display: flex; }
        .item-controls.rejilla .checkbox-group label { flex: 1; }
        .item.g-1, .item.g-3, .item.g-5 { background: #ffffff; }
        .item.g-2, .item.g-4            { background: #ffffff; }
        /* Carro Enfermeria — verde menta en impares */
        .loc-0 .item.g-1,
        .loc-0 .item.g-3 { background: #ecfdf5; }
        /* Carro Anestesia — amarillo cálido en impares */
        .loc-1 .item.g-1,
        .loc-1 .item.g-3,
        .loc-1 .item.g-5 { background: #fef9c3; }
        /* Otros — lavanda en impares */
        .loc-2 .item.g-1,
        .loc-2 .item.g-3 { background: #ede9fe; }
        .item-name {
            /* (19-nov, a prueba) nombres en MAYÚSCULAS, un poco más pequeños para que no agobie; los nombres no cambian */
            text-transform: uppercase;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text);
            line-height: 1.3;
            width: 100%;
        }
        .item-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            width: 100%;
        }

        /* ── CHECKBOXES ── */
        .checkbox-group label {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            font-size: 0.83rem;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--surf2);
            border: 1.5px solid var(--border);
            border-radius: 100px;
            padding: 0.3rem 0.7rem;
            transition: all 0.14s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .checkbox-group label:has(input:checked) {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        input[type="checkbox"] {
            width: 1.1em; height: 1.1em;
            accent-color: var(--accent);
            flex-shrink: 0;
        }

        /* ── SELECTS ── */
        .number-group select {
            padding: 0.42rem 0.6rem;
            border-radius: 7px;
            border: 1.5px solid var(--border);
            font-size: 0.88rem;
            font-weight: 500;
            font-family: 'IBM Plex Sans', sans-serif;
            font-variant-numeric: tabular-nums;
            background: var(--surf2);
            color: var(--text);
            cursor: pointer;
            transition: border-color 0.14s;
            -webkit-tap-highlight-color: transparent;
        }
        .number-group select:focus { border-color: var(--accent); outline: none; }

        /* ── EMPTY ── */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        /* ── SUMMARY ── */
        .summary-actions {
            padding: 0.8rem 0 1.1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
        }
        .summary-actions button {
            padding: 0.62rem 1.3rem;
            font-size: 0.88rem;
            font-weight: 600;
            font-family: 'IBM Plex Sans', sans-serif;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            background: var(--danger);
            color: #fff;
            box-shadow: var(--shadow-sm);
            transition: opacity 0.2s, transform 0.1s;
        }
        .summary-actions button:hover { opacity: 0.85; transform: scale(1.02); }
        .summary-section {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 0.9rem;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        #summary-content ul { list-style: none; padding: 0.15rem 0; }
        #summary-content li {
            padding: 0.62rem 0.95rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.88rem;
        }
        #summary-content li:last-child { border-bottom: none; }
        #content-RESUMEN .total-item label,
        #content-RESUMEN .area-item label {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            cursor: pointer;
        }
        #content-RESUMEN .total-item { justify-content: flex-start; }
        #content-RESUMEN .total-item .quantity { min-width: 2.4rem; text-align: center; }
        #content-RESUMEN .total-item.done .quantity { opacity: 0.45; }
        /* (19-nov) puntitos con el color de cada quirófano que necesita ese producto (colores de UCSI) */
        .qdots { display: inline-flex; gap: 2px; margin-left: 5px; vertical-align: middle; position: relative; top: -1px; }
        .qdot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 0.5px rgba(0,0,0,.25); }
        .qd-1 { background: #dd3030; } .qd-2 { background: #d8db2d; } .qd-3 { background: #179e08; } .qd-4 { background: #963499; }
        .qd-5 { background: #fff; box-shadow: 0 0 0 0.75px #000; } .qd-6 { background: #3190e4; } .qd-7 { background: #e57207; }
        /* Q8 y Hemo comparten el amarillo: puntito bicolor sin él (Q8 azul/lila, Hemo verde/rojo) */
        .qd-8 { background: linear-gradient(to bottom, #87c6f4 50%, #c5a2e5 50%); }
        .qd-hemo { background: linear-gradient(to bottom, #8bc9a2 50%, #e87878 50%); }
        #content-RESUMEN .total-item.done .qdots { opacity: 0.45; }
        #content-RESUMEN .sum-check,
        #content-RESUMEN .sum-area-check {
            width: 1.05em; height: 1.05em;
            accent-color: var(--accent);
            flex-shrink: 0;
        }
        #content-RESUMEN .total-item.done span,
        #content-RESUMEN .area-item.done span {
            text-decoration: line-through;
            color: #aaa;
        }
        .quantity {
            background: var(--accent);
            color: #fff;
            padding: 1px 8px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-family: 'IBM Plex Sans', sans-serif; font-variant-numeric: tabular-nums;
            font-weight: 500;
            flex-shrink: 0;
        }

        /* ── EDITOR TAB ── */
        .editor-wrap {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .editor-search-box {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            box-shadow: var(--shadow-sm);
        }
        .editor-search-box h2 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text);
        }
        .search-input-wrap {
            position: relative;
        }
        .search-input-wrap input {
            width: 100%;
            padding: 0.6rem 0.9rem 0.6rem 2.4rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.92rem;
            font-family: 'IBM Plex Sans', sans-serif;
            background: #f8fafc;
            color: var(--text);
            transition: border-color 0.15s;
        }
        .search-input-wrap input:focus { border-color: var(--warning); outline: none; }
        .search-input-wrap .search-icon {
            position: absolute;
            left: 0.7rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            pointer-events: none;
        }
        #editor-results {
            margin-top: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .editor-result-item {
            background: #f8fafc;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.75rem 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            transition: border-color 0.15s;
        }
        .editor-result-item:focus-within {
            border-color: var(--warning);
            background: #fffbeb;
        }
        .editor-result-meta {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .editor-result-meta span {
            display: inline-block;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1px 6px;
            margin-right: 4px;
        }
        .editor-fields {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            align-items: flex-end;
        }
        .editor-field {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            flex: 1;
            min-width: 120px;
        }
        .editor-field label {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .editor-field input {
            padding: 0.45rem 0.65rem;
            border: 1.5px solid var(--border);
            border-radius: 7px;
            font-size: 0.88rem;
            font-family: 'IBM Plex Sans', sans-serif;
            background: #fff;
            color: var(--text);
            width: 100%;
        }
        .ef-name { text-transform: uppercase; }
        .editor-field input[type="number"] {
            font-family: 'IBM Plex Sans', sans-serif; font-variant-numeric: tabular-nums;
            max-width: 110px;
        }
        .editor-field input:focus { border-color: var(--warning); outline: none; }
        .editor-save-btn {
            padding: 0.48rem 1.1rem;
            background: var(--warning);
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: 0.86rem;
            font-family: 'IBM Plex Sans', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            align-self: flex-end;
            white-space: nowrap;
        }
        .editor-save-btn:hover { background: #d97706; transform: scale(1.02); }
        .editor-save-btn.saved {
            background: var(--success);
        }
        .ed-grupo { margin-top: 1rem; }
        .ed-grupo h3 { font-size: 1rem; font-weight: 600; text-align: center; color: var(--text); padding: 0.4rem; background: var(--bg); border-radius: 8px; }
        .ed-loc { font-size: 0.9rem; font-weight: 600; color: var(--text-muted); text-align: center; margin: 0.7rem 0 0.2rem; }
        .ed-row { display: flex; gap: 0.5rem; align-items: center; padding: 0.3rem 0; border-bottom: 1px solid var(--border); }
        .ed-row input { border: 1.5px solid var(--border); border-radius: 7px; padding: 0.4rem 0.55rem; font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; background: #fff; color: var(--text); transition: border-color 0.2s, background 0.2s; }
        .ed-row input:focus { border-color: var(--warning); outline: none; }
        .ed-name { flex: 1; min-width: 0; }
        .ed-stock { width: 64px; flex-shrink: 0; text-align: center; font-variant-numeric: tabular-nums; }
        .ed-row.ok input { border-color: var(--success); background: #f0fdf4; }
        .ed-off { flex-shrink: 0; width: 40px; height: 38px; border: 1.5px solid var(--border); border-radius: 7px; background: #fff; font-size: 18px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .ed-row.off input { background: #f1f5f9; color: #94a3b8; text-decoration: line-through; }
        .ed-row.off .ed-off { background: #fee2e2; border-color: #fca5a5; }
        .editor-no-results {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.88rem;
            padding: 1.2rem 0;
        }
        .editor-hint {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.84rem;
            padding: 1rem 0;
        }
        .editor-type-badge {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 1px 7px;
            border-radius: 4px;
            margin-left: 6px;
        }
        .badge-number { background: #dbeafe; color: #1d4ed8; }
        .badge-check  { background: #dcfce7; color: #166534; }

        /* ── FLOATING BUTTONS ── */
        #btnSubir, #btnGuardar {
            position: fixed;
            z-index: 9999;
            border: none;
            cursor: pointer;
            font-family: 'IBM Plex Sans', sans-serif;
            font-weight: 600;
            transition: transform 0.18s, box-shadow 0.18s;
        }
        #btnSubir {
            bottom: 1.1rem; right: 1.1rem;
            font-size: 1.1rem;
            background: var(--accent);
            color: #fff;
            width: 46px; height: 46px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(14,165,233,0.45);
        }
        #btnSubir:hover { transform: scale(1.1); }
        #btnGuardar {
            bottom: 1.1rem; left: 1.1rem;
            font-size: 0.86rem;
            background: var(--accent);
            color: #fff;
            padding: 0.62rem 1.1rem;
            border-radius: 999px;
            box-shadow: 0 4px 16px rgba(88,166,255,0.4);
            border: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        #btnGuardar:hover { transform: scale(1.03); }
        #btnGuardar::before { content: '💾'; font-size: 0.95rem; }

        /* ── MODO VOZ ── */
        #btnVoz {
            position: fixed; z-index: 9999;
            bottom: 1.1rem; left: 50%; transform: translateX(-50%);
            width: 54px; height: 54px; border-radius: 50%;
            border: none; cursor: pointer; font-size: 1.45rem;
            background: #fff; box-shadow: 0 4px 16px rgba(88,166,255,0.45);
            display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        #btnVoz.on { background: var(--danger); box-shadow: 0 0 0 6px rgba(239,68,68,0.25); animation: vozPulse 1.4s infinite; }
        @keyframes vozPulse { 50% { box-shadow: 0 0 0 12px rgba(239,68,68,0.12); } }
        #vozBar {
            position: fixed; z-index: 9998; left: 0.6rem; right: 0.6rem; bottom: 5rem;
            background: #fff; border: 1.5px solid var(--border2); border-radius: var(--radius);
            box-shadow: 0 6px 24px rgba(45,49,66,0.18);
            padding: 0.55rem 0.75rem; display: none; font-size: 0.85rem;
        }
        #vozBar.on { display: block; }
        #vozBar .vz-ctx { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
        #vozBar .vz-heard { color: var(--text-muted); font-style: italic; margin-top: 0.15rem; min-height: 1.2em; }
        #vozBar .vz-last { font-weight: 600; margin-top: 0.1rem; min-height: 1.3em; }
        #vozBar .vz-last.err { color: var(--danger); }
        #vozBar .vz-row { display: flex; gap: 0.5rem; justify-content: space-between; align-items: center; }
        #vozBar .vz-btns { display: flex; gap: 0.35rem; flex-shrink: 0; }
        .item, .location-group { scroll-margin-top: 115px; }
        #vozBar button {
            border: 1.5px solid var(--border2); background: var(--surf2); color: var(--text);
            border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.78rem; font-weight: 600;
            font-family: 'IBM Plex Sans', sans-serif; cursor: pointer;
        }
        .item.voz-flash { animation: vozFlash 1.6s ease; }
        @keyframes vozFlash { 0%, 40% { box-shadow: inset 0 0 0 2px var(--accent); background: #dbeafe; } }
        /* ── ⚙️ ORDEN ── */
        .order-hint { font-size: 0.84rem; color: var(--text-muted); line-height: 1.45; }
        .order-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 0.8rem; }
        .order-actions button {
            padding: 0.45rem 0.95rem; border-radius: 999px; border: 1.5px solid var(--border2);
            background: var(--surf2); color: var(--text); font-weight: 600; font-size: 0.82rem;
            font-family: 'IBM Plex Sans', sans-serif; cursor: pointer;
        }
        .order-group { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); margin-top: 0.85rem; overflow: hidden; box-shadow: var(--shadow-sm); }
        .order-group > summary { list-style: none; cursor: pointer; justify-content: space-between; }
        .order-group > summary::-webkit-details-marker { display: none; }
        .order-group > summary .og-title { flex: 1; }
        .order-group > summary .og-title::after { content: ' ▸'; opacity: 0.8; }
        .order-group[open] > summary .og-title::after { content: ' ▾'; }
        .og-btns { display: flex; gap: 0.3rem; }
        .order-list { list-style: none; padding: 0; margin: 0; counter-reset: ord; }
        .order-list li {
            display: flex; align-items: center; gap: 0.25rem; padding: 0.3rem 0.5rem 0.3rem 0.35rem;
            border-bottom: 1px solid var(--border); background: #fff; counter-increment: ord;
        }
        .order-list li:last-child { border-bottom: none; }
        .order-list li::before { content: counter(ord); font-family: 'IBM Plex Sans', sans-serif; font-variant-numeric: tabular-nums; font-size: 0.68rem; color: var(--text-muted); min-width: 1.6rem; text-align: right; }
        .order-list .oh { cursor: grab; color: var(--text-muted); font-size: 1.05rem; padding: 0.2rem 0.3rem; touch-action: none; user-select: none; }
        .order-list .on { flex: 1; font-size: 0.86rem; line-height: 1.25; }
        .order-list .on small { display: block; color: var(--text-muted); font-size: 0.72rem; }
        .ord-btn {
            width: 30px; height: 30px; border-radius: 7px; border: 1.5px solid var(--border2); padding: 0;
            background: var(--surf2); color: var(--text); font-size: 0.8rem; cursor: pointer; flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .ord-btn.ord-far { font-size: 1.15rem; font-weight: 700; line-height: 1; background: #dbeafe; }
        .sub-header .ord-btn { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.5); color: #fff; height: 26px; width: 30px; }
        .order-list li.moved { animation: vozFlash 1.2s ease; }
        .order-list li.sortable-ghost { opacity: 0.4; background: #dbeafe; }
    </style>
</head>

// auto-actualización: el iPhone guarda la página en caché; si en el servidor hay otra versión, recarga
function checkUpdate() {
    fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' })
        .then(r => r.text())
        .then(t => {
            const m = t.match(/const APP_BUILD = '(\d[^']*)'/); // empieza por dígito: no encuentra esta misma línea
            if (m && m[1] !== APP_BUILD) { saveChecklistState(); location.replace(location.pathname + '?v=' + encodeURIComponent(m[1])); }
        }).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !voz?.on) checkUpdate(); });
// al salir de la app con un nombre o stock a medio escribir en el Editor: guardarlo (el blur dispara el change)
const guardaEditorAbierto = () => { const a = document.activeElement; if (a && a.closest && a.closest('.ed-row')) a.blur(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) guardaEditorAbierto(); });
window.addEventListener('pagehide', guardaEditorAbierto);

document.addEventListener('DOMContentLoaded', () => {
    checkUpdate();
    loadAll();

    buildInventory();
    renderTabs();
    renderAllTabContents();
    switchTab(tabOrder[0]);
    bindFloatingBtns();

});

const RENOMBRADOS_V2 = {"Guedel #5 11mm (celeste/ naranja)": "Guedel #5 11mm (Celeste/ Naranja)", "Receptal aspiración PETIT": "Receptal Aspiración PETIT", "Guedel #3 90mm (amarillo)": "Guedel #3 90mm (Amarillo)", "Set aspiración anestesia": "Set Aspiración Anestesia", "Guedel #2 80mm (verde)": "Guedel #2 80mm (Verde)", "Cal sodada G.Electric": "Cal Sodada G.Electric", "Guedel #4 10mm (rojo)": "Guedel #4 10mm (Rojo)", "Receptales aspiración": "Receptales Aspiración", "Salbutamol inhalado": "Salbutamol Inhalado", "SF 100ml irrigación": "SF 100ml Irrigación", "SF 500ml irrigación": "SF 500ml Irrigación", "Receptal aspiración": "Receptal Aspiración", "Aposito via (UCSI)": "Apósito Vía (UCSI)", "Jeringa cono ancho": "Jeringa Cono Ancho", "Gasas pequeñas s/c": "Gasas Pequeñas s/c", "Bolsa instrumental": "Bolsa Instrumental", "Aguja carga (UCSI)": "Aguja Carga (UCSI)", "SF lavados 3L (R)": "SF Lavados 3L (R)", "Bisturi eléctrico": "Bisturí Eléctrico", "Gasas grandes s/c": "Gasas Grandes s/c", "Apósito vía (REA)": "Apósito Vía (REA)", "Aguja carga (REA)": "Aguja Carga (REA)", "Contenedor agujas": "Contenedor Agujas", "Cal sodada DRAGER": "Cal Sodada DRAGER", "Sistema estandar": "Sistema Estándar", "Sistema jeringa": "Sistema Jeringa", "Goma aspiración": "Goma Aspiración", "Paño utilidades": "Paño Utilidades", "Tapón via (REA)": "Tapón Vía (REA)", "Botes anatomia": "Botes Anatomía", "Bomba infusión": "Bomba Infusión", "Jeringas bomba": "Jeringas Bomba", "Otros liquidos": "Otros Líquidos", "Alargo bisturí": "Alargo Bisturí", "Paño adhesivo": "Paño Adhesivo", "Mefix pequeño": "Mefix Pequeño", "Pomada ocular": "Pomada Ocular", "Set anestesia": "Set Anestesia", "Placa bisturi": "Placa Bisturí", "Bata esteril": "Bata Estéril", "Kit sondaje": "Kit Sondaje", "Aposito via": "Apósito Vía", "Venda gasa": "Venda Gasa", "Tapon via": "Tapón Vía"};
// una sola vez: marcas, stocks, nombres ya corregidos (mismas letras salvo mayúsculas) y orden pasan al nombre nuevo
function migraNombresV2() {
    try { if (localStorage.getItem('nombres_v2')) return; } catch (e) { return; }
    const lc = t => String(t).toLocaleLowerCase('es');
    const mapa = {};
    for (const [v, n] of Object.entries(RENOMBRADOS_V2)) { mapa[lc(v)] = n; mapa[lc(n)] = n; }
    const nuevo = t => mapa[lc(t)];
    const reClave = k => { const p = k.split(ID_SEP); let c = false; for (let i = 1; i < p.length; i++) { const n = nuevo(p[i]); if (n && n !== p[i]) { p[i] = n; c = true; } } return c ? p.join(ID_SEP) : k; };
    const reObj = o => { for (const k of Object.keys(o)) { const k2 = reClave(k); if (k2 !== k) { if (!(k2 in o)) o[k2] = o[k]; delete o[k]; } } };
    for (const k of Object.keys(inventoryEdits)) {
        const p = k.split(ID_SEP), v = RENOMBRADOS_V2[p[2]], ed = inventoryEdits[k];
        if (ed.name && nuevo(ed.name) === (v || p[2])) delete ed.name;
        if (v) { p[2] = v; delete inventoryEdits[k]; inventoryEdits[p.join(ID_SEP)] = { ...(inventoryEdits[p.join(ID_SEP)] || {}), ...ed }; }
    }
    for (const k of Object.keys(inventoryEdits)) if (!Object.keys(inventoryEdits[k]).length) delete inventoryEdits[k];
    reObj(checklistState); reObj(summaryTicks); reObj(summaryAreaTicks);
    let orden = null;
    try { orden = JSON.parse(localStorage.getItem('reposicionOrden_v1')); } catch (e) {}
    const reArbol = x => Array.isArray(x) ? x.map(reArbol) : (x && typeof x === 'object') ? Object.fromEntries(Object.entries(x).map(([k, v]) => [nuevo(k) || k, reArbol(v)])) : (typeof x === 'string' && nuevo(x)) ? nuevo(x) : x;
    try {
        if (orden) localStorage.setItem('reposicionOrden_v1', JSON.stringify(reArbol(orden)));
        localStorage.setItem(INVENTORY_EDIT_KEY, JSON.stringify(inventoryEdits));
        localStorage.setItem(CHECKLIST_KEY, JSON.stringify(checklistState));
        localStorage.setItem(SUMMARY_TICKS_KEY, JSON.stringify(summaryTicks));
        localStorage.setItem(AREA_TICKS_KEY, JSON.stringify(summaryAreaTicks));
        localStorage.setItem('nombres_v2', '1');
    } catch (e) {}
}

function loadAll() {
    const loadJSON = (key, def) => { try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; } };
    checklistState   = loadJSON(CHECKLIST_KEY, {});
    summaryTicks     = loadJSON(SUMMARY_TICKS_KEY, {});
    summaryAreaTicks = loadJSON(AREA_TICKS_KEY, {});
    inventoryEdits   = loadJSON(INVENTORY_EDIT_KEY, {});
    // limpieza preventiva RESUMEN
    for (const k of Object.keys(checklistState)) {
        if (k.startsWith('RESUMEN') || k.startsWith('Area')) delete checklistState[k];
    }
}

// Construye inventoryData = DEFAULT + quirófanos + edits aplicados
function buildInventory() {
    // deep clone default
    inventoryData = JSON.parse(JSON.stringify(DEFAULT_INVENTORY));
    // expandir quirófanos
    ["1","2","3","4","5","6","7","8","Hemodinamia"].forEach(n => {
        const key = n === "Hemodinamia" ? "Hemodinamia" : `Quirófano ${n}`;
        if (!inventoryData[key]) inventoryData[key] = JSON.parse(JSON.stringify(inventoryData.template_quirofano));
    });
    delete inventoryData.template_quirofano;
    // aplicar edits guardados
    let arreglados = false;
    let mayusHecho = false;
    try { mayusHecho = !!localStorage.getItem('mayusArreglo_v1'); } catch (e) {}
    for (const editKey in inventoryEdits) {
        const [area, location, origName] = editKey.split(ID_SEP);
        if (!inventoryData[area]?.[location]) continue;
        const item = inventoryData[area][location].find(i => i.name === origName);
        if (!item) continue;
        const edit = inventoryEdits[editKey];
        // el editor antiguo ponía el nombre en MAYÚSCULAS al guardar solo el stock («Pegatina» → «PEGATINA»): se deshace
        // solo nombres ENTEROS en mayúsculas y una única vez: las correcciones tuyas (p. ej. «Mefix Pequeño») se respetan
        if (!mayusHecho && edit.name && edit.name !== origName && edit.name === edit.name.toLocaleUpperCase('es') && origName !== origName.toLocaleUpperCase('es') && edit.name.toLocaleUpperCase('es') === origName.toLocaleUpperCase('es')) {
            const mal = [area, location, edit.name].join(ID_SEP), bien = [area, location, origName].join(ID_SEP);
            for (const k of Object.keys(checklistState)) if (k === mal || k.startsWith(mal + ID_SEP)) { checklistState[bien + k.slice(mal.length)] = checklistState[k]; delete checklistState[k]; }
            delete edit.name;
            if (!Object.keys(edit).length) delete inventoryEdits[editKey];
            arreglados = true;
            continue;
        }
        if (edit.name !== undefined) item.name = edit.name;
        if (edit.stock !== undefined && item.type === 'number') item.stock = edit.stock;
        if (edit.off) item.off = true;
    }
    if (!mayusHecho) try { localStorage.setItem('mayusArreglo_v1', '1'); } catch (e) {}
    if (arreglados) {
        localStorage.setItem(INVENTORY_EDIT_KEY, JSON.stringify(inventoryEdits));
        localStorage.setItem(CHECKLIST_KEY, JSON.stringify(checklistState));
        return buildInventory(); // vuelve a aplicar los stocks de lo arreglado
    }
    // productos desactivados en el Editor: fuera de las pestañas, la voz, el resumen, el orden y las hojas
    inventoryFull = inventoryData;
    inventoryData = {};
    for (const area in inventoryFull) {
        inventoryData[area] = {};
        for (const loc in inventoryFull[area]) inventoryData[area][loc] = inventoryFull[area][loc].filter(i => !i.off);
    }
}

function renderTabs() {
    const container = document.getElementById('tabs');
    container.innerHTML = tabOrder.filter(t => t !== 'RESUMEN').map(t => {   // RESUMEN va en la cabecera
        if (TAB_ICO[t]) return `<button class="tab tab-ico" data-tab="${t}" title="${t}" aria-label="${t}"><img src="${TAB_ICO[t]}" alt=""></button>`;
        const isEditor = t === '✏️ Editor' || t === '⚙️ Orden';
        return `<button class="tab${isEditor ? ' tab-editor' : ''}" data-tab="${t}">${t}</button>`;
    }).join('');
    container.addEventListener('click', e => {
        const b = e.target.closest('.tab');
        if (b) switchTab(b.dataset.tab);
    });
}

function switchTab(tabName) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    const btn = document.querySelector(`.tab[data-tab="${tabName}"]`);
    const content = document.getElementById(`content-${tabName.replace(/[\s✏️]+/g, '-')}`);
    const qm = tabName.match(/^Quirófano (\d)$/);
    if (qm || tabName === 'Hemodinamia') document.body.dataset.q = qm ? qm[1] : 'hemo';
    else delete document.body.dataset.q;
    // (19-nov) SIN meta theme-color: el iPhone lo leía solo al abrir (azul) y dejaba de seguir la cabecera.
    // La barra de la hora la saca el iPhone del color de arriba de la cabecera (en Q8/Hemo, la franja de arriba).
    if (btn) { btn.classList.add('active'); btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); }
    if (content) content.classList.add('active');
    if (tabName === 'RESUMEN') renderSummary();
    if (tabName === '⚙️ Orden') renderOrder();
}

// RENDER ALL CONTENTS
// ─────────────────────────────────────────────
function renderAllTabContents() {
    const main = document.getElementById('tab-contents');
    main.innerHTML = tabOrder.map(tabName => {
        const id = `content-${tabName.replace(/[\s✏️]+/g, '-')}`;
        if (tabName === 'RESUMEN') return `<div class="tab-content" id="${id}"></div>`;
        if (tabName === '✏️ Editor') return `<div class="tab-content" id="${id}">${renderEditorHTML()}</div>`;
        if (tabName === '⚙️ Orden') return `<div class="tab-content" id="${id}"></div>`;
        const areaData = inventoryData[tabName];
        return `<div class="tab-content" id="${id}">${
            areaData
                ? Object.entries(areaData).map(([loc, items], idx) => renderLocationGroup(tabName, loc, items, idx)).join('')
                : '<p class="empty-state">Sin datos.</p>'
        }</div>`;
    }).join('');
    // bind editor after inject
    bindEditor();
}

// ─────────────────────────────────────────────
// CHECKLIST RENDER
// ─────────────────────────────────────────────
// ubicación de una opción concreta (p. ej. Betadine va al pasillo izquierdo aunque el resto de antisépticos sea Farmacia)
const storageOf = (item, opt) => (opt && item.optStorage?.[opt]) || item.storage;

function getLocationClass(s) {
    const l = s.toLowerCase();
    if (l.includes('farmacia')) return 'farmacia';
    if (l.includes('izquierdo')) return 'almacen-izq';
    if (l.includes('derecho')) return 'almacen-der';
    return 'desconocido';
}

function renderLocationGroup(tabName, locationName, items, locIdx = 0) {
    return `<div class="location-group loc-${locIdx}">
        <div class="sub-header">${locationName}</div>
        <div class="item-list">${items.map(item => renderItem(tabName, locationName, item)).join('')}</div>
    </div>`;
}

function renderItem(tabName, locationName, item) {
    const baseId = [tabName, locationName, item.name].join(ID_SEP);
    let html = '';
    if (item.type === 'checkbox' || item.stock === 1) { // stock 1: casilla «Falta» en vez de un desplegable de una sola opción
        const opts = item.options?.length ? item.options : [''];
        html = opts.map(opt => {
            const oid = opt ? [baseId, opt].join(ID_SEP) : baseId;
            return `<div class="checkbox-group"><label for="${oid}"><input type="checkbox" id="${oid}" ${checklistState[oid] ? 'checked' : ''}>${opt || 'Falta'}</label></div>`;
        }).join('');
    } else {
        const val = checklistState[baseId] || '0';
        let opts = `<option value="0">OK (${item.stock})</option>`;
        for (let i = 1; i <= item.stock; i++) opts += `<option value="${i}" ${val == i ? 'selected' : ''}>Faltan ${i}</option>`;
        html = `<div class="number-group"><select id="${baseId}">${opts}</select></div>`;
    }
    const gClass = item.g ? `g-${item.g}` : '';
    const filas = item.type === 'checkbox' && item.options?.length > 1 ? filasOpciones(item.options) : 1;
    const enFila = filas > 0; // a la derecha del nombre; 0 = no cabe, va debajo
    const rejilla = filas > 1 ? ` rejilla" style="--filas:${filas}` : '';
    return `<div class="item ${gClass}${enFila ? ' item-fila' : ' item-abajo'}"><span class="item-name">${item.name}</span><div class="item-controls${rejilla}">${html}</div></div>`;
}

// Casillas de varias opciones al lado del nombre: en columnas de arriba abajo y de derecha a izquierda
// (las primeras, las que más se reponen, quedan pegadas al borde derecho). Medido para un iPhone de 375 px.
function filasOpciones(opts) {
    const MAX = 210, ancho = o => 46 + o.length * 7.5;
    const total = f => { let w = -8; for (let i = 0; i < opts.length; i += f) w += 8 + Math.max(...opts.slice(i, i + f).map(ancho)); return w; };
    if (opts.every(o => o.length <= 2) && opts.reduce((w, o) => w + ancho(o) + 8, -8) <= MAX) return 1; // S M L en una línea
    if (total(2) <= MAX) return 2;
    if (total(3) <= MAX) return 3;
    return 0; // nombres largos (Antisépticos, Kit sondaje): debajo del nombre, cada casilla a su medida, a la derecha
}

// ─────────────────────────────────────────────
// CHECKLIST LOGIC
// ─────────────────────────────────────────────
function bindChecklistChanges() {
    document.getElementById('tab-contents').addEventListener('change', e => {
        if (!e.target.matches('input[type="checkbox"], select')) return;
        if (e.target.closest('#content--️-Editor')) return; // ignorar editor
        saveChecklistState();
        if (document.querySelector('.tab.active')?.dataset.tab === 'RESUMEN') renderSummary();
    });
}

function saveChecklistState() {
    const state = {};
    document.querySelectorAll('#tab-contents input[type="checkbox"], #tab-contents select').forEach(input => {
        if (input.closest('#content--️-Editor')) return;
        if (input.type === 'checkbox' && input.checked) {
            if (['sum-check','sum-area-check'].some(c => input.classList.contains(c))) return;
            if (input.id.startsWith('RESUMEN') || input.id.startsWith('Area')) return;
            state[input.id] = true;
        } else if (input.tagName === 'SELECT' && input.value && parseInt(input.value) > 0) {
            state[input.id] = input.value;
        }
    });
    localStorage.setItem(CHECKLIST_KEY, JSON.stringify(state));
    checklistState = state;
}

// ─────────────────────────────────────────────
// SUMMARY
// ─────────────────────────────────────────────
function renderSummary() {
    const el = document.getElementById('content-RESUMEN');
    if (!el) return;

    // build location map (+ posición de cada casilla en su pestaña, para listar por área en ese orden)
    // optUnit: en la lista total, esa opción suma con otro producto (Antisépticos·Alcohol = Alcohol del carro de anestesia)
    const locMap = {}, tabPos = {}, unitMap = {};
    for (const area in inventoryData) {
        let n = 0;
        for (const location in inventoryData[area]) {
            for (const item of inventoryData[area][location]) {
                const base = [area, location, item.name].join(ID_SEP);
                if (item.options?.length) item.options.forEach(o => { const id = [base, o].join(ID_SEP); locMap[id] = storageOf(item, o); tabPos[id] = n++; if (item.optUnit?.[o]) unitMap[id] = item.optUnit[o]; });
                else { locMap[base] = item.storage; tabPos[base] = n++; if (item.unidad) unitMap[base] = item.unidad; } // unidad: suma con otro producto
            }
        }
    }

    let byArea = {}, byStorage = {}, byMeta = {}, byQ = {};   // byQ: quirófanos que piden cada producto (puntitos)
    for (const inputId in checklistState) {
        if (inputId.startsWith('RESUMEN') || inputId.startsWith('Area')) continue;
        const value = checklistState[inputId];
        const [area, , itemName, option] = inputId.split(ID_SEP);
        if (!byArea[area]) byArea[area] = [];
        let display = itemName + (option ? ` (${option})` : '');
        const isNum = !isNaN(parseInt(value));
        if (isNum) display += ` - Faltan: ${value}`;
        byArea[area].push({ d: display, r: tabPos[inputId] ?? 1e6, n: itemName + (option ? ` (${option})` : ''), q: isNum ? parseInt(value) : null });
        const store = locMap[inputId] || 'Desconocido';
        const uName = unitMap[inputId] || itemName, uOpt = unitMap[inputId] ? null : option;
        const fullName = uOpt ? `${uName} (${uOpt})` : uName;
        if (!byStorage[store]) { byStorage[store] = {}; byMeta[store] = {}; byQ[store] = {}; }
        byMeta[store][isNum ? uName : fullName] = { unit: uName, opt: isNum ? null : uOpt };
        const qk = (byQ[store][isNum ? uName : fullName] ||= new Set());
        const qm = area.match(/^Quirófano (\d)$/); if (qm) qk.add(qm[1]); else if (area === 'Hemodinamia') qk.add('hemo');
        if (isNum) { byStorage[store][uName] = (byStorage[store][uName] || 0) + parseInt(value); }
        else       { byStorage[store][fullName] = (byStorage[store][fullName] || 0) + 1; }
    }

    // por área: áreas en el orden de las pestañas y material en el orden de cada pestaña
    const areaNames = [...tabOrder.filter(t => byArea[t]), ...Object.keys(byArea).filter(t => !tabOrder.includes(t))];
    areaNames.forEach(a => byArea[a].sort((x, y) => x.r - y.r));
    const areaRows = areaNames.map(a => [a, byArea[a].map(x => ({ name: x.n, qty: x.q }))]); // para el PDF
    byArea = Object.fromEntries(areaNames.map(a => [a, byArea[a].map(x => x.d)]));
    const hasItems = Object.keys(checklistState).length > 0;
    // lista total en el orden de ⚙️ Orden (ubicaciones y materiales); lo no ordenado, alfabético al final
    const { cat, opts } = orderCatalog();
    const storeNames = [...orderedStorages(cat).filter(st => byStorage[st]), ...Object.keys(byStorage).filter(st => !cat[st]).sort()];
    const storeList = storeNames.map(st => {
        const pos = new Map(orderedUnits(st, cat).map((u, i) => [u, i]));
        // Farmacia: lo de REA «(R)» y UCSI «(U)» va al final, en bloque (primero R, luego U), manteniendo su orden
        const block = u => st !== 'FARMACIA' ? 0 : /\(R\)\s*$/.test(u) ? 1 : /\(U\)\s*$/.test(u) ? 2 : 0;
        const entries = Object.entries(byStorage[st]).sort((a, b) => {
            const ma = byMeta[st][a[0]], mb = byMeta[st][b[0]];
            const ba = block(ma.unit), bb = block(mb.unit);
            if (ba !== bb) return ba - bb;
            const pa = pos.get(ma.unit) ?? 1e6, pb = pos.get(mb.unit) ?? 1e6;
            if (pa !== pb) return pa - pb;
            if (ma.unit !== mb.unit) return ma.unit.localeCompare(mb.unit, 'es');
            return (opts[ma.unit] || []).indexOf(ma.opt) - (opts[mb.unit] || []).indexOf(mb.opt);
        });
        return [st, entries];
    });

    el.innerHTML = `
        <div class="summary-actions">
            <button id="clear-all-data">Limpiar Todo el Checklist</button>
            <button id="btn-pdf" style="background:#0ea5e9">🖨️ Exportar PDF</button>
            <button id="btn-hoja" style="background:#475569" title="Hoja en blanco para rellenar a mano">📋 Hoja manual PDF</button>
        </div>
        <div class="summary-section">
            <div class="sub-header desconocido">RESUMEN por Área</div>
            ${!hasItems ? '<p class="empty-state">No hay nada que reponer.</p>' : ''}
            ${Object.entries(byArea).map(([area, items]) => !items.length ? '' : `
                <div class="location-group" style="margin:.45rem;border-radius:8px">
                    <h3 class="sub-header desconocido">${area}</h3>
                    <ul>${items.map(item => {
                        const aid = ['Area', area, item].join(ID_SEP);
                        const chk = !!summaryAreaTicks[aid];
                        return `<li class="area-item ${chk?'done':''}"><label for="${aid}"><input type="checkbox" class="sum-area-check" id="${aid}" ${chk?'checked':''}><span>${item}</span></label></li>`;
                    }).join('')}</ul>
                </div>`).join('')}
        </div>
        <div class="summary-section">
            <div class="sub-header desconocido">Lista de Reposición Total</div>
            ${!hasItems ? '<p class="empty-state">No hay nada que reponer.</p>' : ''}
            ${storeList.map(([loc, entries]) => `
                <div class="location-group" style="margin:.45rem;border-radius:8px">
                    <h3 class="sub-header ${getLocationClass(loc)}">${loc}</h3>
                    <ul>${entries.map(([name, qty]) => {
                        const sid = ['RESUMEN', loc, name].join(ID_SEP);
                        const chk = !!summaryTicks[sid];
                        const qs = [...'12345678', 'hemo'].filter(q => byQ[loc]?.[name]?.has(q));
                        const dots = qs.length ? `<b class="qdots" title="${qs.map(q => q === 'hemo' ? 'Hemodinamia' : 'Q' + q).join(' · ')}">${qs.map(q => `<i class="qdot qd-${q}"></i>`).join('')}</b>` : '';
                        return `<li class="total-item ${chk?'done':''}"><label for="${sid}"><input type="checkbox" class="sum-check" id="${sid}" ${chk?'checked':''}><span class="quantity">×${qty}</span><span>${name}${dots}</span></label></li>`;
                    }).join('')}</ul>
                </div>`).join('')}
        </div>`;

    const clearBtn = document.getElementById('clear-all-data');
    clearBtn.addEventListener('click', () => {
        if (clearBtn.dataset.confirm === '1') {
            [CHECKLIST_KEY, SUMMARY_TICKS_KEY, AREA_TICKS_KEY].forEach(k => localStorage.removeItem(k));
            checklistState = {}; summaryTicks = {}; summaryAreaTicks = {};
            document.querySelectorAll('#tab-contents input[type="checkbox"]').forEach(cb => cb.checked = false);
            document.querySelectorAll('#tab-contents select').forEach(s => s.value = '0');
            renderSummary();
        } else {
            clearBtn.dataset.confirm = '1';
            clearBtn.textContent = '⚠️ Pulsa de nuevo para confirmar';
            clearBtn.style.background = '#b91c1c';
            setTimeout(() => {
                if (clearBtn && clearBtn.isConnected) {
                    clearBtn.dataset.confirm = '0';
                    clearBtn.textContent = 'Limpiar Todo el Checklist';
                    clearBtn.style.background = '';
                }
            }, 3000);
        }
    });
    // PDF de lo que falta: tabla compacta a 2 columnas, casilla + cantidad pegada al material
    document.getElementById('btn-pdf').addEventListener('click', () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const M = 12, W = 210 - 2 * M, GAP = 6, COLW = (W - GAP) / 2, RH = 6, BOTTOM = 285, TOP = 14;
        const QTY_W = 10;
        let y = TOP;
        const fit = (txt, maxW, size) => {
            let sz = size; doc.setFontSize(sz);
            while (doc.getTextWidth(txt) > maxW && sz > 7) { sz -= 0.25; doc.setFontSize(sz); }
            while (doc.getTextWidth(txt) > maxW && txt.length > 3) txt = txt.slice(0, -2) + '…';
            return txt;
        };
        const newPage = () => { doc.addPage(); y = TOP; };

        doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(45, 49, 66);
        doc.text('LISTA DE REPOSICIÓN · BLOQUE QUIRÚRGICO CIMA', M, y + 3);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(107, 120, 153);
        doc.text(new Date().toLocaleDateString('es-ES'), 210 - M, y + 3, { align: 'right' });
        y += 10;

        const heading = t => {
            if (y + 20 > BOTTOM) newPage();
            doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(45, 49, 66);
            doc.text(t, M, y + 3); y += 6;
        };
        // un grupo (ubicación o área): banda + filas en 2 columnas, de arriba abajo y luego a la derecha
        const group = (label, tint, rows) => {
            let i = 0, cont = false;
            while (i < rows.length) {
                if (y + 7.5 + RH * 2 > BOTTOM) newPage();
                doc.setFillColor(...tint); doc.rect(M, y, W, 6.5, 'F');
                doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(45, 49, 66);
                doc.text(label + (cont ? '  (cont.)' : ''), M + 2, y + 4.6);
                y += 7.5;
                const cap = Math.max(1, Math.floor((BOTTOM - y) / RH));
                const chunk = rows.slice(i, i + cap * 2);
                const nRows = Math.ceil(chunk.length / 2);
                chunk.forEach((r, k) => {
                    const col = Math.floor(k / nRows), row = k - col * nRows;
                    const x = M + col * (COLW + GAP), yy = y + row * RH;
                    if (row % 2) { doc.setFillColor(238, 242, 248); doc.rect(x, yy, COLW, RH, 'F'); }
                    // línea separadora bien visible impresa (el sombreado solo no se ve)
                    if (row === 0) { doc.setDrawColor(90, 104, 128); doc.setLineWidth(0.35); doc.line(x, yy, x + COLW, yy); }
                    doc.setDrawColor(110, 122, 145); doc.setLineWidth(0.28); doc.line(x, yy + RH, x + COLW, yy + RH);
                    doc.setDrawColor(100, 116, 139); doc.setLineWidth(0.3); doc.rect(x + 1.3, yy + 1.3, 3.4, 3.4);
                    const ty = yy + RH - 1.7;
                    if (r.qty != null) {
                        doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(29, 78, 216);
                        doc.text('×' + r.qty, x + 6.5, ty);
                    }
                    doc.setFont('helvetica', 'normal'); doc.setTextColor(45, 49, 66);
                    doc.text(fit(r.name, COLW - 6.5 - QTY_W - 1, 9.5), x + 6.5 + QTY_W, ty);
                });
                y += nRows * RH + 3.5;
                i += chunk.length;
                if (i < rows.length) { newPage(); cont = true; }
            }
        };

        // 1) por ubicación, en el orden de ⚙️ Orden
        const PDF_TINT = { farmacia: [254, 226, 226], 'almacen-der': [219, 234, 254], 'almacen-izq': [209, 250, 229], desconocido: [226, 232, 240] };
        if (storeList.length) heading('POR UBICACIÓN');
        storeList.forEach(([loc, entries]) => group(loc, PDF_TINT[getLocationClass(loc)] || PDF_TINT.desconocido, entries.map(([name, qty]) => ({ name, qty }))));

        // 2) por área, en el orden de cada pestaña
        const withRows = areaRows.filter(([, rows]) => rows.length);
        if (withRows.length) { y += 2; heading('POR ÁREA'); }
        withRows.forEach(([area, rows]) => group(area.toUpperCase(), [226, 232, 240], rows));

        doc.save('reposicion-cima.pdf');
    });
    document.getElementById('btn-hoja').addEventListener('click', () => {
        buildManualSheetPDF().save('hoja-revision-quirofanos.pdf');
    });
    el.addEventListener('change', e => {
        const cb = e.target.closest('.sum-check');
        if (cb) {
            cb.checked ? summaryTicks[cb.id] = true : delete summaryTicks[cb.id];
            localStorage.setItem(SUMMARY_TICKS_KEY, JSON.stringify(summaryTicks));
            cb.closest('.total-item')?.classList.toggle('done', cb.checked);
        }
        const acb = e.target.closest('.sum-area-check');
        if (acb) {
            acb.checked ? summaryAreaTicks[acb.id] = true : delete summaryAreaTicks[acb.id];
            localStorage.setItem(AREA_TICKS_KEY, JSON.stringify(summaryAreaTicks));
            acb.closest('.area-item')?.classList.toggle('done', acb.checked);
        }
    });
}

// ─────────────────────────────────────────────
// HOJA MANUAL (PDF en blanco para rellenar a mano)
// Filas = material de quirófano en el orden de la app; columnas = quirófanos (orden de pestañas)
// ─────────────────────────────────────────────
const STORAGE_ABBR = {
    'FARMACIA':                  ['F',   [220, 38, 38]],
    'ALMACÉN PASILLO DERECHO':   ['AD',  [37, 99, 235]],
    'ALMACÉN PASILLO IZQUIERDO': ['AI',  [5, 150, 105]],
    'ALMACÉN LIMPIEZA':          ['LIM', [71, 85, 105]],
    'BLOQUE QUIRÚRGICO':         ['BQ',  [71, 85, 105]],
    'ARMARIO LENCERIA':          ['LEN', [71, 85, 105]]
};
// mismos tonos que las filas impares de cada carro en la app
const SECTION_TINT = [
    { band: [167, 243, 208], row: [236, 253, 245] }, // Carro Enfermeria
    { band: [253, 230, 138], row: [254, 249, 195] }, // Carro Anestesia
    { band: [221, 214, 254], row: [237, 233, 254] }, // Otros
    { band: [254, 202, 202], row: [254, 242, 242] }, // REA/UCSI · Farmacia
    { band: [191, 219, 254], row: [239, 246, 255] }  // REA/UCSI · Almacén
];

// Prueba alturas de fila de mayor a menor y se queda con la más grande que cabe en 2 páginas
function buildManualSheetPDF() {
    let doc;
    for (let rh = 4.2; rh >= 3.3; rh = +(rh - 0.05).toFixed(2)) {
        doc = renderManualSheet(rh);
        if (doc.getNumberOfPages() <= 2) return doc;
    }
    return doc;
}

function renderManualSheet(RH) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const PW = 297, PH = 210, M = 7, GAP = 4;
    const UB_W = 5, STK_W = 5, TOT_W = 7, LIST_MIN = 46;
    const SH = 4.2, HEAD_H = 5, TOP = M + 12, BOTTOM = PH - M - 2;
    const NAME_PT = 6.4, OPT_PT = 5.8;
    const title = 'HOJA DE REVISIÓN · QUIRÓFANOS · REA · UCSI';

    // quirófanos = áreas con la plantilla de quirófano, en el orden de las pestañas
    const quis = tabOrder.filter(t => inventoryData[t]?.['Carro Enfermeria']);
    const qLabel = t => t.startsWith('Quirófano') ? 'Q' + t.split(' ')[1] : t === 'Hemodinamia' ? 'HEM' : t.slice(0, 4).toUpperCase();
    const lists = ['Reanimación', 'UCSI'].filter(a => inventoryData[a]);

    // filas de quirófano: una por artículo, o una por opción (Bisturi → nº10, nº11…)
    const rows = [];
    Object.keys(inventoryData[quis[0]]).forEach((loc, si) => {
        rows.push({ kind: 'sec', label: loc, si });
        inventoryData[quis[0]][loc].forEach((item, ii) => {
            const stocks = quis.map(q => inventoryData[q][loc]?.[ii]?.stock);
            const base = {
                kind: 'item', si, label: loc, g: item.g || 0, name: item.name, storage: item.storage,
                isNum: item.type === 'number' && stocks.some(s => s > 1), stocks, uniform: stocks.every(s => s === stocks[0])
            };
            const opts = item.options?.length ? item.options : [null];
            opts.forEach((opt, oi) => rows.push({ ...base, storage: storageOf(item, opt), stChange: oi === 0 || storageOf(item, opt) !== storageOf(item, opts[oi - 1]), opt, first: oi === 0, last: oi === opts.length - 1, n: opts.length }));
        });
    });

    const textW = (t, pt, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(pt); return doc.getTextWidth(t); };
    const fit = (txt, maxW, size, min = 4.5) => {
        let s = size;
        doc.setFontSize(s);
        while (doc.getTextWidth(txt) > maxW && s > min) { s -= 0.25; doc.setFontSize(s); }
        while (doc.getTextWidth(txt) > maxW && txt.length > 3) txt = txt.slice(0, -2) + '…';
        return txt;
    };

    // ── anchos: MATERIAL justo para el nombre más largo; lo que sobra, a la lista REA/UCSI de la derecha ──
    const optsW = {};
    rows.forEach(r => { if (r.kind === 'item' && r.opt) optsW[r.name] = Math.max(optsW[r.name] || 0, textW(r.opt, OPT_PT, true)); });
    const NAME_W = Math.min(56, Math.max(30, 2.6 + Math.max(...rows.filter(r => r.kind === 'item' && r.first)
        .map(r => textW(r.name, NAME_PT) + (optsW[r.name] ? optsW[r.name] + 1.5 : 0)))));
    const FIXED_W = NAME_W + UB_W + STK_W + TOT_W;
    const Q_W = Math.max(5.8, Math.min(8, (PW - 2 * M - 2 * GAP - (lists.length ? LIST_MIN : 0) - 2 * FIXED_W) / (2 * quis.length)));
    const COL_W = FIXED_W + quis.length * Q_W;
    const LIST_X = M + 2 * (COL_W + GAP), LIST_W = PW - M - LIST_X;
    const qx = (x0, i) => x0 + NAME_W + UB_W + STK_W + i * Q_W;
    const shadeQ = i => i % 2 === 1;

    function drawPageHeader() {
        doc.setTextColor(45, 49, 66);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
        doc.text(title, M, M + 4);
        const tw = doc.getTextWidth(title);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(107, 120, 153);
        doc.text('Reposición Bloque Quirúrgico CIMA · versión manual', M + tw + 3, M + 4);
        doc.setFontSize(8); doc.setTextColor(45, 49, 66);
        doc.text('Fecha: ____________    Turno: ________    Revisa: ______________________', PW - M, M + 4, { align: 'right' });
        // leyenda
        doc.setFontSize(6.3); doc.setTextColor(71, 85, 105);
        let lx = M; const ly = M + 9;
        const put = (t, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.text(t, lx, ly); lx += doc.getTextWidth(t); };
        put('Casilla vacía: ', true); put('anotar cuántas FALTAN  ·  ');
        doc.setDrawColor(100, 116, 139); doc.setLineWidth(0.2); doc.rect(lx, ly - 1.9, 1.9, 1.9); lx += 2.6;
        put(' marcar si falta  ·  '); put('Opciones REA/UCSI: ', true); put('rodear la que falta  ·  ');
        put('STK', true); put(' stock máx.  ·  '); put('TOTAL', true); put(' suma a reponer  ·  '); put('UB: ', true);
        const UB_TXT = { F: 'farmacia', AD: 'pasillo dcho', AI: 'pasillo izq', LIM: 'limpieza', BQ: 'bloque', LEN: 'lencería' };
        Object.values(STORAGE_ABBR).forEach(([ab, c], i, arr) => {
            doc.setTextColor(...c); put(ab, true); doc.setTextColor(71, 85, 105);
            put(' ' + (UB_TXT[ab] || '') + (i < arr.length - 1 ? ' · ' : ''));
        });
    }

    function drawColHeader(x0, y0) {
        doc.setFillColor(226, 232, 240); doc.rect(x0, y0, COL_W, HEAD_H, 'F');
        quis.forEach((q, i) => { if (shadeQ(i)) { doc.setFillColor(203, 213, 225); doc.rect(qx(x0, i), y0, Q_W, HEAD_H, 'F'); } });
        doc.setFillColor(254, 215, 170); doc.rect(x0 + COL_W - TOT_W, y0, TOT_W, HEAD_H, 'F');
        doc.setFont('helvetica', 'bold'); doc.setTextColor(45, 49, 66); doc.setFontSize(6.5);
        const ty = y0 + 3.4;
        doc.text('MATERIAL', x0 + 1.2, ty);
        doc.setFontSize(5.3);
        doc.text('UB', x0 + NAME_W + UB_W / 2, ty, { align: 'center' });
        doc.text('STK', x0 + NAME_W + UB_W + STK_W / 2, ty, { align: 'center' });
        quis.forEach((q, i) => doc.text(fit(qLabel(q), Q_W - 0.5, 6.3), qx(x0, i) + Q_W / 2, ty, { align: 'center' }));
        doc.text(fit('TOTAL', TOT_W - 0.4, 5.3), x0 + COL_W - TOT_W / 2, ty, { align: 'center' });
    }

    function drawSection(x0, y0, w, label, si, cont) {
        doc.setFillColor(...SECTION_TINT[si % SECTION_TINT.length].band); doc.rect(x0, y0, w, SH, 'F');
        doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.setTextColor(45, 49, 66);
        doc.text(fit(label.toUpperCase() + (cont ? '  (cont.)' : ''), w - 2, 7), x0 + 1.2, y0 + 3.05);
    }

    // línea superior de una fila (se pinta tras los fondos para que no la tapen)
    function topLine(x0, y0, w, prev, g, fromX) {
        if (prev?.kind === 'item') {
            if (prev.g !== g) { doc.setDrawColor(51, 65, 85); doc.setLineWidth(0.5); }
            else              { doc.setDrawColor(120, 132, 152); doc.setLineWidth(0.25); }
            doc.line(fromX, y0, x0 + w, y0);
        } else { // justo bajo una banda de sección
            doc.setDrawColor(100, 116, 139); doc.setLineWidth(0.3); doc.line(x0, y0, x0 + w, y0);
        }
    }

    function drawUB(storage, cx, ty) {
        const [ab, c] = STORAGE_ABBR[storage] || [String(storage || '?').slice(0, 3), [71, 85, 105]];
        doc.setFont('helvetica', 'bold'); doc.setTextColor(...c);
        doc.text(fit(ab, UB_W - 0.5, 5.2), cx, ty, { align: 'center' });
        doc.setTextColor(45, 49, 66);
    }
    const box = (cx, y0) => { doc.setDrawColor(148, 163, 184); doc.setLineWidth(0.2); doc.rect(cx - 0.95, y0 + RH / 2 - 0.95, 1.9, 1.9); };

    function drawItem(x0, y0, r, prev) {
        const t = SECTION_TINT[r.si % SECTION_TINT.length];
        if (r.g % 2 === 1) { doc.setFillColor(...t.row); doc.rect(x0, y0, NAME_W + UB_W + STK_W, RH, 'F'); }
        quis.forEach((q, i) => { if (shadeQ(i)) { doc.setFillColor(238, 242, 247); doc.rect(qx(x0, i), y0, Q_W, RH, 'F'); } });
        doc.setFillColor(255, 247, 237); doc.rect(x0 + COL_W - TOT_W, y0, TOT_W, RH, 'F');
        const ty = y0 + RH - 1.05;
        doc.setTextColor(45, 49, 66);
        let optW = 0;
        if (r.opt) {
            doc.setFont('helvetica', 'bold');
            const o = fit(r.opt, 22, OPT_PT);
            optW = doc.getTextWidth(o) + 1.5;
            doc.text(o, x0 + NAME_W - 1, ty, { align: 'right' });
        }
        doc.setFont('helvetica', 'normal');
        if (r.first) {
            doc.text(fit(r.name, NAME_W - 2 - optW, NAME_PT), x0 + 1.2, ty);
            if (r.isNum) { doc.setFontSize(5.8); doc.text(r.uniform ? String(r.stocks[0]) : 'var', x0 + NAME_W + UB_W + STK_W / 2, ty, { align: 'center' }); }
        }
        if (r.stChange) drawUB(r.storage, x0 + NAME_W + UB_W / 2, ty); // también cuando cambia entre opciones (antisépticos)
        quis.forEach((q, i) => {
            const cx = qx(x0, i);
            if (!r.isNum) box(cx + Q_W / 2, y0);
            else if (!r.uniform && r.stocks[i] != null) {
                doc.setFont('helvetica', 'normal'); doc.setFontSize(3.8); doc.setTextColor(148, 163, 184);
                doc.text(String(r.stocks[i]), cx + Q_W - 0.4, y0 + 1.5, { align: 'right' });
            }
        });
        doc.setDrawColor(203, 213, 225); doc.setLineWidth(0.1);
        [NAME_W, NAME_W + UB_W, NAME_W + UB_W + STK_W].forEach(d => doc.line(x0 + d, y0, x0 + d, y0 + RH));
        quis.forEach((q, i) => doc.line(qx(x0, i) + Q_W, y0, qx(x0, i) + Q_W, y0 + RH));
        // sin cortar el nombre dentro de un artículo con opciones
        topLine(x0, y0, COL_W, prev, r.g, prev?.last ? x0 : x0 + NAME_W);
    }

    const ensurePage = p => { while (doc.getNumberOfPages() < p) { doc.addPage(); drawPageHeader(); } doc.setPage(p); };
    const frame = (x0, top, w, bottom) => { if (bottom > top) { doc.setDrawColor(71, 85, 105); doc.setLineWidth(0.4); doc.rect(x0, top, w, bottom - top); } };

    // ── tablas de quirófano: 2 columnas por página ──
    drawPageHeader();
    let colIdx = -1, x = 0, y = 0, colTop = 0;
    const startCol = () => {
        if (colIdx >= 0) frame(x, colTop, COL_W, y);
        colIdx++;
        ensurePage(Math.floor(colIdx / 2) + 1);
        x = M + (colIdx % 2) * (COL_W + GAP); y = TOP; colTop = y;
        drawColHeader(x, y); y += HEAD_H;
    };
    startCol();
    rows.forEach((r, i) => {
        if (r.kind === 'sec') {
            if (y + SH + RH * 3 > BOTTOM) startCol();
            drawSection(x, y, COL_W, r.label, r.si, false); y += SH;
            return;
        }
        // un artículo con opciones no se parte entre columnas
        let prev = rows[i - 1];
        if (y + (r.first ? RH * r.n : RH) > BOTTOM) { startCol(); drawSection(x, y, COL_W, r.label, r.si, true); y += SH; prev = null; }
        drawItem(x, y, r, prev); y += RH;
    });
    frame(x, colTop, COL_W, y);

    // ── lista REA / UCSI a la derecha (una por página): un material por fila;
    //    casilla = marcar/anotar, opciones en línea = rodear la que falta ──
    const MARK_W = 7.5, LNAME_W = LIST_W - UB_W - MARK_W;
    const cleanName = n => n.replace(/\s*\((R|U|REA|UCSI)\)\s*/gi, ' ').trim();
    let page = 0, ly = 0, lTop = 0;
    const startList = (area, cont) => {
        if (page) frame(LIST_X, lTop, LIST_W, ly);
        page++;
        ensurePage(page);
        ly = TOP; lTop = ly;
        doc.setFillColor(226, 232, 240); doc.rect(LIST_X, ly, LIST_W, HEAD_H, 'F');
        doc.setFont('helvetica', 'bold'); doc.setTextColor(45, 49, 66);
        doc.text(fit(area.toUpperCase() + (cont ? ' (cont.)' : ''), LNAME_W - 2, 6.5), LIST_X + 1.2, ly + 3.4);
        doc.setFontSize(5.3);
        doc.text('UB', LIST_X + LNAME_W + UB_W / 2, ly + 3.4, { align: 'center' });
        doc.text(fit('FALTA', MARK_W - 0.4, 5.3), LIST_X + LNAME_W + UB_W + MARK_W / 2, ly + 3.4, { align: 'center' });
        ly += HEAD_H;
    };
    lists.forEach(area => {
        startList(area, false);
        Object.entries(inventoryData[area]).forEach(([loc, items]) => {
            const si = loc === 'FARMACIA' ? 3 : 4;
            if (ly + SH + RH * 2 > BOTTOM) startList(area, true);
            drawSection(LIST_X, ly, LIST_W, loc, si, false); ly += SH;
            let prev = null;
            items.forEach(item => {
                if (ly + RH > BOTTOM) { startList(area, true); drawSection(LIST_X, ly, LIST_W, loc, si, true); ly += SH; prev = null; }
                const ty = ly + RH - 1.05;
                doc.setFillColor(238, 242, 247); doc.rect(LIST_X + LNAME_W + UB_W, ly, MARK_W, RH, 'F');
                // opciones a la derecha del nombre, para rodear
                let optsW = 0;
                if (item.options?.length) {
                    const o = item.options.join('  ');
                    const ow = Math.min(textW(o, OPT_PT, true), LNAME_W * 0.6);
                    doc.setTextColor(45, 49, 66);
                    doc.text(fit(o, ow, OPT_PT), LIST_X + LNAME_W - 1, ty, { align: 'right' });
                    optsW = ow + 1.5;
                }
                doc.setFont('helvetica', 'normal'); doc.setTextColor(45, 49, 66);
                doc.text(fit(cleanName(item.name), LNAME_W - 2 - optsW, NAME_PT), LIST_X + 1.2, ty);
                drawUB(item.storage, LIST_X + LNAME_W + UB_W / 2, ty);
                const mx = LIST_X + LNAME_W + UB_W;
                if (item.options?.length) { /* se rodea la opción */ }
                else if (item.type === 'number' && item.stock > 1) {
                    doc.setFont('helvetica', 'normal'); doc.setFontSize(4.6); doc.setTextColor(120, 132, 152);
                    doc.text('/' + item.stock, mx + MARK_W - 0.4, ly + 1.8, { align: 'right' });
                } else box(mx + MARK_W / 2, ly);
                doc.setDrawColor(203, 213, 225); doc.setLineWidth(0.1);
                [LNAME_W, LNAME_W + UB_W].forEach(d => doc.line(LIST_X + d, ly, LIST_X + d, ly + RH));
                topLine(LIST_X, ly, LIST_W, prev, 0, LIST_X);
                prev = { kind: 'item', g: 0 };
                ly += RH;
            });
        });
    });
    if (page) frame(LIST_X, lTop, LIST_W, ly);

    const pages = doc.getNumberOfPages();
    for (let p = 1; p <= pages; p++) {
        doc.setPage(p);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(6); doc.setTextColor(148, 163, 184);
        doc.text(`${p}/${pages}`, PW - M, PH - 3, { align: 'right' });
        doc.text('Reposición BQ · CIMA', M, PH - 3);
    }
    return doc;
}
