// Prueba alturas de fila de mayor a menor y se queda con la más grande que cabe en 2 páginas
function buildManualSheetPDF() {
    let doc;
    for (let rh = 4.2; rh >= 3.3; rh = +(rh - 0.05).toFixed(2)) {
        doc = renderManualSheet(rh);
        if (doc.getNumberOfPages() <= 2) return doc;
    }
    return doc;
}

function renderManualSheet(RH) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const PW = 297, PH = 210, M = 7, GAP = 4;
    const UB_W = 5, STK_W = 5, TOT_W = 7, LIST_MIN = 46;
    const SH = 4.2, HEAD_H = 5, TOP = M + 12, BOTTOM = PH - M - 2;
    const NAME_PT = 6.4, OPT_PT = 5.8;
    const title = 'HOJA DE REVISIÓN · QUIRÓFANOS · REA · UCSI';

    // quirófanos = áreas con la plantilla de quirófano, en el orden de las pestañas
    const quis = tabOrder.filter(t => inventoryData[t]?.['Carro Enfermeria']);
    const qLabel = t => t.startsWith('Quirófano') ? 'Q' + t.split(' ')[1] : t === 'Hemodinamia' ? 'HEM' : t.slice(0, 4).toUpperCase();
    const lists = ['Reanimación', 'UCSI'].filter(a => inventoryData[a]);

    // filas de quirófano: una por artículo, o una por opción (Bisturi → nº10, nº11…)
    const rows = [];
    Object.keys(inventoryData[quis[0]]).forEach((loc, si) => {
        rows.push({ kind: 'sec', label: loc, si });
        inventoryData[quis[0]][loc].forEach((item, ii) => {
            const stocks = quis.map(q => inventoryData[q][loc]?.[ii]?.stock);
            const base = {
                kind: 'item', si, label: loc, g: item.g || 0, name: item.name, storage: item.storage,
                isNum: item.type === 'number' && stocks.some(s => s > 1), stocks, uniform: stocks.every(s => s === stocks[0])
            };
            const opts = item.options?.length ? item.options : [null];
            opts.forEach((opt, oi) => rows.push({ ...base, storage: storageOf(item, opt), stChange: oi === 0 || storageOf(item, opt) !== storageOf(item, opts[oi - 1]), opt, first: oi === 0, last: oi === opts.length - 1, n: opts.length }));
        });
    });

    const textW = (t, pt, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(pt); return doc.getTextWidth(t); };
    const fit = (txt, maxW, size, min = 4.5) => {
        let s = size;
        doc.setFontSize(s);
        while (doc.getTextWidth(txt) > maxW && s > min) { s -= 0.25; doc.setFontSize(s); }
        while (doc.getTextWidth(txt) > maxW && txt.length > 3) txt = txt.slice(0, -2) + '…';
        return txt;
    };

    // ── anchos: MATERIAL justo para el nombre más largo; lo que sobra, a la lista REA/UCSI de la derecha ──
    const optsW = {};
    rows.forEach(r => { if (r.kind === 'item' && r.opt) optsW[r.name] = Math.max(optsW[r.name] || 0, textW(r.opt, OPT_PT, true)); });
    const NAME_W = Math.min(56, Math.max(30, 2.6 + Math.max(...rows.filter(r => r.kind === 'item' && r.first)
        .map(r => textW(r.name, NAME_PT) + (optsW[r.name] ? optsW[r.name] + 1.5 : 0)))));
    const FIXED_W = NAME_W + UB_W + STK_W + TOT_W;
    const Q_W = Math.max(5.8, Math.min(8, (PW - 2 * M - 2 * GAP - (lists.length ? LIST_MIN : 0) - 2 * FIXED_W) / (2 * quis.length)));
    const COL_W = FIXED_W + quis.length * Q_W;
    const LIST_X = M + 2 * (COL_W + GAP), LIST_W = PW - M - LIST_X;
    const qx = (x0, i) => x0 + NAME_W + UB_W + STK_W + i * Q_W;
    const shadeQ = i => i % 2 === 1;

    function drawPageHeader() {
        doc.setTextColor(45, 49, 66);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
        doc.text(title, M, M + 4);
        const tw = doc.getTextWidth(title);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(107, 120, 153);
        doc.text('Reposición Bloque Quirúrgico CIMA · versión manual', M + tw + 3, M + 4);
        doc.setFontSize(8); doc.setTextColor(45, 49, 66);
        doc.text('Fecha: ____________    Turno: ________    Revisa: ______________________', PW - M, M + 4, { align: 'right' });
        // leyenda
        doc.setFontSize(6.3); doc.setTextColor(71, 85, 105);
        let lx = M; const ly = M + 9;
        const put = (t, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.text(t, lx, ly); lx += doc.getTextWidth(t); };
        put('Casilla vacía: ', true); put('anotar cuántas FALTAN  ·  ');
        doc.setDrawColor(100, 116, 139); doc.setLineWidth(0.2); doc.rect(lx, ly - 1.9, 1.9, 1.9); lx += 2.6;
        put(' marcar si falta  ·  '); put('Opciones REA/UCSI: ', true); put('rodear la que falta  ·  ');
        put('STK', true); put(' stock máx.  ·  '); put('TOTAL', true); put(' suma a reponer  ·  '); put('UB: ', true);
        const UB_TXT = { F: 'farmacia', AD: 'pasillo dcho', AI: 'pasillo izq', LIM: 'limpieza', BQ: 'bloque', LEN: 'lencería' };
        Object.values(STORAGE_ABBR).forEach(([ab, c], i, arr) => {
            doc.setTextColor(...c); put(ab, true); doc.setTextColor(71, 85, 105);
            put(' ' + (UB_TXT[ab] || '') + (i < arr.length - 1 ? ' · ' : ''));
        });
    }

    function drawColHeader(x0, y0) {
        doc.setFillColor(226, 232, 240); doc.rect(x0, y0, COL_W, HEAD_H, 'F');
        quis.forEach((q, i) => { if (shadeQ(i)) { doc.setFillColor(203, 213, 225); doc.rect(qx(x0, i), y0, Q_W, HEAD_H, 'F'); } });
        doc.setFillColor(254, 215, 170); doc.rect(x0 + COL_W - TOT_W, y0, TOT_W, HEAD_H, 'F');
        doc.setFont('helvetica', 'bold'); doc.setTextColor(45, 49, 66); doc.setFontSize(6.5);
        const ty = y0 + 3.4;
        doc.text('MATERIAL', x0 + 1.2, ty);
        doc.setFontSize(5.3);
        doc.text('UB', x0 + NAME_W + UB_W / 2, ty, { align: 'center' });
        doc.text('STK', x0 + NAME_W + UB_W + STK_W / 2, ty, { align: 'center' });
        quis.forEach((q, i) => doc.text(fit(qLabel(q), Q_W - 0.5, 6.3), qx(x0, i) + Q_W / 2, ty, { align: 'center' }));
        doc.text(fit('TOTAL', TOT_W - 0.4, 5.3), x0 + COL_W - TOT_W / 2, ty, { align: 'center' });
    }

    function drawSection(x0, y0, w, label, si, cont) {
        doc.setFillColor(...SECTION_TINT[si % SECTION_TINT.length].band); doc.rect(x0, y0, w, SH, 'F');
        doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.setTextColor(45, 49, 66);
        doc.text(fit(label.toUpperCase() + (cont ? '  (cont.)' : ''), w - 2, 7), x0 + 1.2, y0 + 3.05);
    }

    // línea superior de una fila (se pinta tras los fondos para que no la tapen)
    function topLine(x0, y0, w, prev, g, fromX) {
        if (prev?.kind === 'item') {
            if (prev.g !== g) { doc.setDrawColor(51, 65, 85); doc.setLineWidth(0.5); }
            else              { doc.setDrawColor(120, 132, 152); doc.setLineWidth(0.25); }
            doc.line(fromX, y0, x0 + w, y0);
        } else { // justo bajo una banda de sección
            doc.setDrawColor(100, 116, 139); doc.setLineWidth(0.3); doc.line(x0, y0, x0 + w, y0);
        }
    }

    function drawUB(storage, cx, ty) {
        const [ab, c] = STORAGE_ABBR[storage] || [String(storage || '?').slice(0, 3), [71, 85, 105]];
        doc.setFont('helvetica', 'bold'); doc.setTextColor(...c);
        doc.text(fit(ab, UB_W - 0.5, 5.2), cx, ty, { align: 'center' });
        doc.setTextColor(45, 49, 66);
    }
    const box = (cx, y0) => { doc.setDrawColor(148, 163, 184); doc.setLineWidth(0.2); doc.rect(cx - 0.95, y0 + RH / 2 - 0.95, 1.9, 1.9); };

    function drawItem(x0, y0, r, prev) {
        const t = SECTION_TINT[r.si % SECTION_TINT.length];
        if (r.g % 2 === 1) { doc.setFillColor(...t.row); doc.rect(x0, y0, NAME_W + UB_W + STK_W, RH, 'F'); }
        quis.forEach((q, i) => { if (shadeQ(i)) { doc.setFillColor(238, 242, 247); doc.rect(qx(x0, i), y0, Q_W, RH, 'F'); } });
        doc.setFillColor(255, 247, 237); doc.rect(x0 + COL_W - TOT_W, y0, TOT_W, RH, 'F');
        const ty = y0 + RH - 1.05;
        doc.setTextColor(45, 49, 66);
        let optW = 0;
        if (r.opt) {
            doc.setFont('helvetica', 'bold');
            const o = fit(r.opt, 22, OPT_PT);
            optW = doc.getTextWidth(o) + 1.5;
            doc.text(o, x0 + NAME_W - 1, ty, { align: 'right' });
        }
        doc.setFont('helvetica', 'normal');
        if (r.first) {
            doc.text(fit(r.name, NAME_W - 2 - optW, NAME_PT), x0 + 1.2, ty);
            if (r.isNum) { doc.setFontSize(5.8); doc.text(r.uniform ? String(r.stocks[0]) : 'var', x0 + NAME_W + UB_W + STK_W / 2, ty, { align: 'center' }); }
        }
        if (r.stChange) drawUB(r.storage, x0 + NAME_W + UB_W / 2, ty); // también cuando cambia entre opciones (antisépticos)
        quis.forEach((q, i) => {
            const cx = qx(x0, i);
            if (!r.isNum) box(cx + Q_W / 2, y0);
            else if (!r.uniform && r.stocks[i] != null) {
                doc.setFont('helvetica', 'normal'); doc.setFontSize(3.8); doc.setTextColor(148, 163, 184);
                doc.text(String(r.stocks[i]), cx + Q_W - 0.4, y0 + 1.5, { align: 'right' });
            }
        });
        doc.setDrawColor(203, 213, 225); doc.setLineWidth(0.1);
        [NAME_W, NAME_W + UB_W, NAME_W + UB_W + STK_W].forEach(d => doc.line(x0 + d, y0, x0 + d, y0 + RH));
        quis.forEach((q, i) => doc.line(qx(x0, i) + Q_W, y0, qx(x0, i) + Q_W, y0 + RH));
        // sin cortar el nombre dentro de un artículo con opciones
        topLine(x0, y0, COL_W, prev, r.g, prev?.last ? x0 : x0 + NAME_W);
    }

    const ensurePage = p => { while (doc.getNumberOfPages() < p) { doc.addPage(); drawPageHeader(); } doc.setPage(p); };
    const frame = (x0, top, w, bottom) => { if (bottom > top) { doc.setDrawColor(71, 85, 105); doc.setLineWidth(0.4); doc.rect(x0, top, w, bottom - top); } };

    // ── tablas de quirófano: 2 columnas por página ──
    drawPageHeader();
    let colIdx = -1, x = 0, y = 0, colTop = 0;
    const startCol = () => {
        if (colIdx >= 0) frame(x, colTop, COL_W, y);
        colIdx++;
        ensurePage(Math.floor(colIdx / 2) + 1);
        x = M + (colIdx % 2) * (COL_W + GAP); y = TOP; colTop = y;
        drawColHeader(x, y); y += HEAD_H;
    };
    startCol();
    rows.forEach((r, i) => {
        if (r.kind === 'sec') {
            if (y + SH + RH * 3 > BOTTOM) startCol();
            drawSection(x, y, COL_W, r.label, r.si, false); y += SH;
            return;
        }
        // un artículo con opciones no se parte entre columnas
        let prev = rows[i - 1];
        if (y + (r.first ? RH * r.n : RH) > BOTTOM) { startCol(); drawSection(x, y, COL_W, r.label, r.si, true); y += SH; prev = null; }
        drawItem(x, y, r, prev); y += RH;
    });
    frame(x, colTop, COL_W, y);

    // ── lista REA / UCSI a la derecha (una por página): un material por fila;
    //    casilla = marcar/anotar, opciones en línea = rodear la que falta ──
    const MARK_W = 7.5, LNAME_W = LIST_W - UB_W - MARK_W;
    const cleanName = n => n.replace(/\s*\((R|U|REA|UCSI)\)\s*/gi, ' ').trim();
    let page = 0, ly = 0, lTop = 0;
    const startList = (area, cont) => {
        if (page) frame(LIST_X, lTop, LIST_W, ly);
        page++;
        ensurePage(page);
        ly = TOP; lTop = ly;
        doc.setFillColor(226, 232, 240); doc.rect(LIST_X, ly, LIST_W, HEAD_H, 'F');
        doc.setFont('helvetica', 'bold'); doc.setTextColor(45, 49, 66);
        doc.text(fit(area.toUpperCase() + (cont ? ' (cont.)' : ''), LNAME_W - 2, 6.5), LIST_X + 1.2, ly + 3.4);
        doc.setFontSize(5.3);
        doc.text('UB', LIST_X + LNAME_W + UB_W / 2, ly + 3.4, { align: 'center' });
        doc.text(fit('FALTA', MARK_W - 0.4, 5.3), LIST_X + LNAME_W + UB_W + MARK_W / 2, ly + 3.4, { align: 'center' });
        ly += HEAD_H;
    };
    lists.forEach(area => {
        startList(area, false);
        Object.entries(inventoryData[area]).forEach(([loc, items]) => {
            const si = loc === 'FARMACIA' ? 3 : 4;
            if (ly + SH + RH * 2 > BOTTOM) startList(area, true);
            drawSection(LIST_X, ly, LIST_W, loc, si, false); ly += SH;
            let prev = null;
            items.forEach(item => {
                if (ly + RH > BOTTOM) { startList(area, true); drawSection(LIST_X, ly, LIST_W, loc, si, true); ly += SH; prev = null; }
                const ty = ly + RH - 1.05;
                doc.setFillColor(238, 242, 247); doc.rect(LIST_X + LNAME_W + UB_W, ly, MARK_W, RH, 'F');
                // opciones a la derecha del nombre, para rodear
                let optsW = 0;
                if (item.options?.length) {
                    const o = item.options.join('  ');
                    const ow = Math.min(textW(o, OPT_PT, true), LNAME_W * 0.6);
                    doc.setTextColor(45, 49, 66);
                    doc.text(fit(o, ow, OPT_PT), LIST_X + LNAME_W - 1, ty, { align: 'right' });
                    optsW = ow + 1.5;
                }
                doc.setFont('helvetica', 'normal'); doc.setTextColor(45, 49, 66);
                doc.text(fit(cleanName(item.name), LNAME_W - 2 - optsW, NAME_PT), LIST_X + 1.2, ty);
                drawUB(item.storage, LIST_X + LNAME_W + UB_W / 2, ty);
                const mx = LIST_X + LNAME_W + UB_W;
                if (item.options?.length) { /* se rodea la opción */ }
                else if (item.type === 'number' && item.stock > 1) {
                    doc.setFont('helvetica', 'normal'); doc.setFontSize(4.6); doc.setTextColor(120, 132, 152);
                    doc.text('/' + item.stock, mx + MARK_W - 0.4, ly + 1.8, { align: 'right' });
                } else box(mx + MARK_W / 2, ly);
                doc.setDrawColor(203, 213, 225); doc.setLineWidth(0.1);
                [LNAME_W, LNAME_W + UB_W].forEach(d => doc.line(LIST_X + d, ly, LIST_X + d, ly + RH));
                topLine(LIST_X, ly, LIST_W, prev, 0, LIST_X);
                prev = { kind: 'item', g: 0 };
                ly += RH;
            });
        });
    });
    if (page) frame(LIST_X, lTop, LIST_W, ly);

    const pages = doc.getNumberOfPages();
    for (let p = 1; p <= pages; p++) {
        doc.setPage(p);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(6); doc.setTextColor(148, 163, 184);
        doc.text(`${p}/${pages}`, PW - M, PH - 3, { align: 'right' });
        doc.text('Reposición BQ · CIMA', M, PH - 3);
    }
    return doc;
}

// Listado completo editable: Reanimación, UCSI y Quirófanos (Q1–Q8 + Hemodinamia comparten material:
// una sola fila cambia todos a la vez). Se guarda solo al cambiar un campo.
function renderEditorList(q = '') {
    const resultsEl = document.getElementById('editor-results');
    if (!resultsEl) return;
    q = q.trim().toLowerCase();
    const grupos = {}, porClave = {};
    for (const area in inventoryFull) {
        const esQ = area.startsWith('Quirófano') || area === 'Hemodinamia';
        const g = esQ ? 'Quirófanos' : area;
        for (const location in inventoryFull[area]) {
            for (const item of inventoryFull[area][location]) {
                if (q && !item.name.toLowerCase().includes(q)) continue;
                const k = g + ID_SEP + location + ID_SEP + item.name;
                if (porClave[k]) { porClave[k].areas.push(area); porClave[k].stocks.push(item.stock); continue; }
                porClave[k] = { areas: [area], location, item, stocks: [item.stock] };
                ((grupos[g] ||= {})[location] ||= []).push(porClave[k]);
            }
        }
    }
    const orden = ['Reanimación', 'UCSI', 'Quirófanos'].filter(g => grupos[g]).concat(Object.keys(grupos).filter(g => !['Reanimación', 'UCSI', 'Quirófanos'].includes(g)));
    if (!orden.length) { resultsEl.innerHTML = '<p class="editor-no-results">Sin resultados.</p>'; return; }
    const esc = t => String(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    resultsEl.innerHTML = orden.map(g => `
        <section class="ed-grupo">
            <h3>${g === 'Quirófanos' ? 'Quirófanos · Q1–Q8 y HEM' : g}</h3>
            ${Object.entries(grupos[g]).map(([loc, filas]) => `
                <div class="ed-loc">${loc}</div>
                ${filas.map(({ areas, location, item, stocks }) => {
                    const sMin = Math.min(...stocks), sMax = Math.max(...stocks);
                    const stock = item.type !== 'number' ? ''
                        : `<input class="ed-stock" type="number" inputmode="numeric" min="1" max="999" value="${sMin === sMax ? sMin : ''}" placeholder="${sMin}–${sMax}">`;
                    return `<div class="ed-row${item.off ? ' off' : ''}" data-areas="${esc(areas.join(ID_SEP))}" data-location="${esc(location)}" data-name="${esc(item.name)}" data-type="${item.type}">
                        <input class="ed-name" type="text" value="${esc(item.name)}" autocomplete="off" autocorrect="off" spellcheck="false">${stock}<button class="ed-off" type="button">${item.off ? '🚫' : '👁'}</button>
                    </div>`;
                }).join('')}`).join('')}
        </section>`).join('');
}

function bindEditor() {
    const input = document.getElementById('editorSearch');
    if (!input) return;
    renderEditorList();
    input.addEventListener('input', () => renderEditorList(input.value));
    document.getElementById('editor-results').addEventListener('change', e => {
        const row = e.target.closest('.ed-row');
        if (row) saveEditorRow(row);
    });
    document.getElementById('editor-results').addEventListener('click', e => {
        const btn = e.target.closest('.ed-off');
        if (btn) toggleEditorRow(btn.closest('.ed-row'));
    });
}

// 👁 / 🚫 desactiva un producto (en Quirófanos, los 9 a la vez) sin borrarlo; se reactiva igual
function toggleEditorRow(row) {
    const areas = row.dataset.areas.split(ID_SEP), location = row.dataset.location, name = row.dataset.name;
    const apagar = !row.classList.contains('off');
    areas.forEach(area => {
        const editKey = findEditKey(area, location, name);
        const ed = inventoryEdits[editKey] ||= {};
        if (apagar) {
            ed.off = true;
            Object.keys(checklistState).forEach(k => {
                const parts = k.split(ID_SEP);
                if (parts[0] === area && parts[1] === location && parts[2] === name) delete checklistState[k];
            });
        } else delete ed.off;
        if (!Object.keys(ed).length) delete inventoryEdits[editKey];
    });
    localStorage.setItem(CHECKLIST_KEY, JSON.stringify(checklistState));
    localStorage.setItem(INVENTORY_EDIT_KEY, JSON.stringify(inventoryEdits));
    buildInventory();
    reRenderChecklistTabs();
    row.classList.toggle('off', apagar);
    row.querySelector('.ed-off').textContent = apagar ? '🚫' : '👁';
}

// Encuentra el editKey correcto buscando en DEFAULT_INVENTORY el item con nombre actual
function findEditKey(area, location, currentName) {
    // primero busca en edits guardados si ya está mapeado
    for (const k in inventoryEdits) {
        const [a, l] = k.split(ID_SEP);
        if (a === area && l === location && inventoryEdits[k].name === currentName) return k;
    }
    // si no, busca en DEFAULT por nombre original
    const defArea = area === 'Hemodinamia' ? 'template_quirofano'
        : area.startsWith('Quirófano') ? 'template_quirofano'
        : area;
    const defItems = DEFAULT_INVENTORY[defArea]?.[location] || DEFAULT_INVENTORY[area]?.[location];
    if (defItems) {
        const found = defItems.find(i => i.name === currentName);
        if (found) return [area, location, found.name].join(ID_SEP);
    }
    return [area, location, currentName].join(ID_SEP);
}

function saveEditorRow(row) {
    const areas    = row.dataset.areas.split(ID_SEP);
    const location = row.dataset.location;
    const origName = row.dataset.name;
    const type     = row.dataset.type;
    const newName  = row.querySelector('.ed-name').value.trim() || origName;
    const stockEl  = row.querySelector('.ed-stock');
    const newStock = stockEl && stockEl.value !== '' ? parseInt(stockEl.value) : null;
    const cambiaStock = type === 'number' && newStock > 0;
    if (newName === origName && !cambiaStock) { row.querySelector('.ed-name').value = origName; return; }

    areas.forEach(area => {
        const editKey = findEditKey(area, location, origName);
        const ed = inventoryEdits[editKey] ||= {};
        if (newName !== origName) ed.name = newName;
        if (cambiaStock) {
            ed.stock = newStock;
            // resetear lo marcado de este producto en esa área (el máximo ha cambiado)
            Object.keys(checklistState).forEach(k => {
                const parts = k.split(ID_SEP);
                if (parts[0] === area && parts[1] === location && parts[2] === origName) delete checklistState[k];
            });
        }
    });
    if (cambiaStock) localStorage.setItem(CHECKLIST_KEY, JSON.stringify(checklistState));
    localStorage.setItem(INVENTORY_EDIT_KEY, JSON.stringify(inventoryEdits));
    buildInventory();
    reRenderChecklistTabs();
    row.dataset.name = newName;
    if (stockEl && cambiaStock) { stockEl.placeholder = ''; }
    row.classList.add('ok');
    setTimeout(() => row.classList.remove('ok'), 1200);
}

// Rerenderiza solo las pestañas del checklist (no Editor ni RESUMEN)
function reRenderChecklistTabs() {
    const main = document.getElementById('tab-contents');
    tabOrder.forEach(tabName => {
        if (tabName === 'RESUMEN' || tabName === '✏️ Editor' || tabName === '⚙️ Orden') return;
        const id = `content-${tabName.replace(/[\s✏️]+/g, '-')}`;
        const el = document.getElementById(id);
        if (!el) return;
        const wasActive = el.classList.contains('active');
        const areaData = inventoryData[tabName];
        el.innerHTML = areaData
            ? Object.entries(areaData).map(([loc, items], idx) => renderLocationGroup(tabName, loc, items, idx)).join('')
            : '<p class="empty-state">Sin datos.</p>';
    });
}

// MODO VOZ (manos libres): se dicen los materiales de la pestaña abierta tal como están escritos
//   «paracetamol 3» → Faltan 3 · «jeringas 10 y 5» → marca 10cc y 5cc · «midazolam» → marca
//   «anestesia» / «enfermería» / «otros» / «farmacia» / «almacén» → carro preferente
//   «quirófano 3», «hemodinamia», «reanimación», «UCSI» → cambia de pestaña
//   «quita X» → desmarca · «deshacer» · «para» → apaga
// ─────────────────────────────────────────────
const VOZ_NUM = {
    cero: 0, un: 1, uno: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10,
    once: 11, doce: 12, trece: 13, catorce: 14, quince: 15, dieciseis: 16, diecisiete: 17, dieciocho: 18,
    diecinueve: 19, veinte: 20, veinticinco: 25, treinta: 30, cuarenta: 40, cincuenta: 50, cien: 100, quinientos: 500
};
// sinónimos hablados → como está escrito en la app

const vozNorm = t => String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/(\d),+(\d)/g, '$1.$2').replace(/nº|#/g, ' ')
    .replace(/(\d)([a-z])/g, '$1 $2').replace(/([a-z])(\d)/g, '$1 $2')
    .replace(/[^a-z0-9.\s]/g, ' ').replace(/\.(?!\d)|(^|[^\d])\./g, '$1 ').replace(/\s+/g, ' ').trim();

function vozLev(a, b) {
    if (Math.abs(a.length - b.length) > 2) return 9;
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
}

    if (u === n) return true;

    const a = vozStem(u).replace(/v/g, 'b'), b = vozStem(n).replace(/v/g, 'b');
    if (a === b) return true;
    if (b.length >= 4 && a.length >= 4 && (a.startsWith(b) || b.startsWith(a))) return true;
    if (b.length === 3 && a.length > 3 && a.startsWith(b)) return true;
    return b.length >= 5 && vozLev(a, b) <= (b.length >= 8 ? 2 : 1);

function vozTokens(t) {
    let n = vozNorm(t);
    VOZ_SYN.forEach(([re, rep]) => { n = n.replace(re, rep); });
    const words = [], nums = [];
    let trasFalta = false, falta = null;
    n.split(' ').forEach(w => {
        if (!w) return;
        if (w === 'falta' || w === 'faltan') { trasFalta = true; return; }
        if (trasFalta) { const v = /^\d+$/.test(w) ? parseFloat(w) : VOZ_NUM[w]; if (v !== undefined) falta = v; trasFalta = false; }
        if (/^0\d+$/.test(w)) nums.push(parseFloat('0.' + w.slice(1)));
        else if (/^\d+(\.\d+)?$/.test(w)) nums.push(parseFloat(w));
        else if (/^\.5$/.test(w) && nums.length) nums[nums.length - 1] += 0.5;
        else if (VOZ_NUM[w] !== undefined) nums.push(VOZ_NUM[w]);
        else if (w === 'coma' || w === 'punto') nums.push('.');
        else if (!VOZ_STOP.has(w)) words.push(w);
    });
    // «cero cinco» / «0 25» → 0,5 / 0,25 · «siete coma cinco» → 7,5
    const out = [];
    for (let i = 0; i < nums.length; i++) {
        const v = nums[i];
        if (v === '.') { if (out.length && typeof nums[i + 1] === 'number') { out[out.length - 1] = parseFloat(out[out.length - 1] + '.' + String(nums[i + 1])); i++; } continue; }
        if (v === 0 && typeof nums[i + 1] === 'number' && nums[i + 1] > 0) { out.push(parseFloat('0.' + String(nums[i + 1]))); i++; continue; }
        out.push(v);
    }
    return { words, nums: out, falta };
}

    [/\bSF lavados\b/gi, 'suero de lavados'], [/\bMefix G\b/g, 'Mefix grande'], [/\bMefix P\b/g, 'Mefix Pequeño'], [/\bSF\b/g, 'fisiológico'], [/\bRL\b/g, 'Ringer lactato'], [/\bSGS\b/g, 'glucosalino'], [/\bTET\b/g, 'tubo'], [/\bBIC\b/g, 'bomba de analgesia'],
    [/nº|#/g, 'número '], [/(\d),(\d)/g, '$1 coma $2'], [/(\d)\s?m[lL]\b/g, '$1 mililitros'], [/(\d)\s?mg\b/g, '$1 miligramos'],
    [/(\d)[gG]\b/g, '$1 G'], [/(\d)\s?L\b/g, '$1 litros'], [/[()]/g, ' '], [/\//g, ' '], [/Carro /g, '']
];
const vozSpeak = t => VOZ_SPEAK.reduce((a, [re, r]) => a.replace(re, r), String(t)).replace(/\s+/g, ' ').trim();
const vozLabel = t => String(t).replace(/\s*\((R|U|REA|UCSI)\)/gi, '');
const VOZ_LOG_KEY = 'vozLog_v1';

const APP_BUILD = '26-nov 16:59'; // SUBIR EN CADA CAMBIO: la app se recarga sola si hay versión nueva (se ve en la barra de voz)

function initVoz() {

// iPhone/iPad (solo para el registro): la confirmación sigue siendo por voz, como siempre
const VOZ_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// registro de lo que hace el micro (sale con 📋 junto a las frases) para saber por qué se corta
function vozEv(t) {
    try {
        const linea = `${new Date().toLocaleTimeString('es-ES')} · ${t}`;
        const log = JSON.parse(localStorage.getItem(VOZ_LOG_KEY) || '[]');
        log.push(linea);
        localStorage.setItem(VOZ_LOG_KEY, JSON.stringify(log.slice(-80)));
    } catch {}
}

/* ── Motor de voz (14-nov, iOS 27) ──
   El iPhone no deja sonar la voz mientras el micro escucha. Por turnos, como en septiembre pero bien:
   apaga el micro → ESPERA a que esté apagado del todo → habla → vuelve a encender el micro.
   (En septiembre hablaba nada más apagar; con iOS 27 la voz salía muda, no avisaba del final y el micro
   no volvía: «coge un producto y se para».) Todo queda en el registro 📋. */
function vozNuevoRec(SR) {
    const rec = new SR();
    // (14-nov) iOS 27 ya no hace lo que hacía el dictado de Siri (texto en vivo, tintín, cerrar la frase al callarte):
    // lo hace la app. interimResults = ver lo que dices mientras lo dices.
    rec.lang = 'es-ES'; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 3;
    rec.onstart = () => {
        if (voz.rec !== rec) return;
        voz.vivo = true; voz.cerrado = false; voz.reintento = false; voz.reNA = false; clearTimeout(voz.vigia);
        // (20-nov) «tarda en activarme el micro: solo oye los miligramos»: un toc suave = YA escucho, habla ahora
        // (solo tras hablar la app o al tocar 🎤, no en los reenganches silenciosos) + cuánto tardó, al registro
        // (20-nov noche) el toc fuera: «suenas continuamente como pitidos». Solo queda el tintín de «apuntado»
        if (voz.tFin) { vozEv('micro listo ' + ((Date.now() - voz.tFin) / 1000).toFixed(1) + ' s tras la voz'); voz.tFin = 0; }
        vozVigilaSordo(rec);
    };
    // (21-nov, Chrome en Mac) «ha dejado de escucharme»: el micro decía estar abierto pero no llegaba sonido
    // y no cerraba nunca (sin no-speech). Se vigila: si no llega audio, se cambia el micro por uno nuevo sin decir nada.
    rec.onaudiostart = () => { if (voz.rec !== rec) return; voz.audio = true; voz.audioEv = true; };
    rec.onresult = e => {
        voz.oido = true; voz.ultRes = Date.now();
        if (voz.cerrado || voz.rec !== rec) return;            // esa frase ya se dio por terminada
        clearTimeout(voz.cierreT);
        let parcial = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
            const r = e.results[i];
            if (voz.speaking || Date.now() < voz.mudoHasta) { if (r.isFinal) vozEv('ignorado (la app hablaba): «' + r[0].transcript + '»'); continue; }
            if (r.isFinal) { vozCierra(Array.from(r).map(a => a.transcript), 'frase'); return; }
            parcial += r[0].transcript;
        }
        if (!parcial.trim()) return;
        document.getElementById('vozHeard').textContent = '«' + parcial.trim() + '…»';   // en vivo, tal como lo dices
        // (19-nov) si el iPhone deja la frase en coma («Set aspiración anestesia,») es que vas a seguir: se espera más
        const coma = /,\s*$/.test(parcial);
        voz.cierreT = setTimeout(() => vozCierra([parcial], coma ? 'silencio 1,8 s (coma)' : 'silencio 1 s'), coma ? 1800 : 1000);
    };
    rec.onerror = e => {
        if (voz.rec !== rec) return;                                // un micro viejo que ya se cambió
        if (e.error === 'aborted' && voz.trasFin) return;          // lo hemos apagado nosotros para hablar
        vozEv('error ' + e.error);
        // (20-nov) audio-capture = otra cosa se quedó el micro (pantalla bloqueada, llamada…): pedir un toque en vez de reengancharse en vacío
        if (e.error === 'audio-capture') return vozPausa();
        if (e.error !== 'not-allowed' && e.error !== 'service-not-allowed') return;
        // (20-nov) ya funcionaba y de repente «not-allowed» (la voz no avisó del final): un reintento antes de pedir un toque
        if (voz.oido && !voz.reNA) { voz.reNA = true; voz.reintentoNA = true; try { speechSynthesis.cancel(); } catch {} return; }
        // (19-nov) el micro arranca tras el saludo, fuera del toque: si el iPhone lo niega, primero se pide un toque
        if (!voz.oido && voz.toque) { vozShow('', 'Sin permiso para el micrófono', true); return vozStop(); }
        vozPausa();
    };
    rec.onend = () => {
        if (voz.rec !== rec) return;                                // un micro viejo que ya se cambió
        voz.vivo = false; clearTimeout(voz.sordoT); clearInterval(voz.mudoI);
        if (voz.trasFin) { const f = voz.trasFin; voz.trasFin = null; clearTimeout(voz.esperaT); return f(); }   // ya apagado: ahora sí, hablar
        vozEv('fin del micro');
        if (voz.reintentoNA) { voz.reintentoNA = false; voz.tFin = Date.now(); return setTimeout(() => vozArranca(true), 400); }
        // el reconocimiento se corta tras silencios: se reengancha solo mientras el modo esté activo
        if (voz?.on && !voz.paused && !voz.speaking && voz.rec === rec) vozArranca(true);
    };
    return rec;
}
// arranca el micro; si en 2 s no ha arrancado, pide un toque (por voz) en vez de quedarse muerto
// da la frase por terminada (la cierra el iPhone o 1 s de silencio) y la procesa una sola vez
function vozCierra(alts, como) {
    if (!voz?.on || voz.cerrado) return;
    clearTimeout(voz.cierreT);
    if (!alts.some(a => a && a.trim())) return;
    voz.cerrado = true;
    if (como !== 'frase') vozEv('frase cerrada por ' + como);
    vozHandle(alts);
    // si la respuesta no ha apagado el micro para hablar, se reinicia para empezar limpio la siguiente frase
    if (!voz.speaking && voz.on) { try { voz.rec.abort(); } catch {} }
}
function vozVigilaSordo(rec) {
    voz.audio = false; voz.ultRes = Date.now();
    clearTimeout(voz.sordoT); clearInterval(voz.mudoI);
    const cambia = motivo => {
        if (!voz?.on || voz.rec !== rec || !voz.vivo || voz.speaking || voz.paused) return;
        clearTimeout(voz.sordoT); clearInterval(voz.mudoI);
        vozEv(motivo + ': cambio el micro');
        voz.vivo = false;
        try { rec.abort(); } catch {}
        voz.rec = vozNuevoRec(voz.SR);
        vozArranca(true);
    };
    // el navegador avisa de que llega sonido (Chrome sí): si a los 4 s no ha llegado, micro nuevo
    voz.sordoT = setTimeout(() => { if (voz?.audioEv && !voz.audio) cambia('micro abierto sin sonido'); }, 4000);
    // fuera del iPhone, si en 25 s ni frase ni aviso de silencio, el micro está colgado
    if (!VOZ_IOS) voz.mudoI = setInterval(() => { if (Date.now() - (voz?.ultRes || 0) > 25000) cambia('25 s sin oír nada'); }, 5000);
}
function vozArranca(auto) {
    if (!voz?.on || voz.paused) return;
    try { voz.rec.start(); }
    catch (e) {
        vozEv('no arranca (' + (e.name || e) + '), pruebo otro');
        try { try { voz.rec.abort(); } catch {} voz.rec = vozNuevoRec(voz.SR); voz.rec.start(); } catch (e2) { vozEv('tampoco (' + (e2.name || e2) + ')'); return vozPausa(); }
    }
    if (auto) vozEv('rearranco solo');
    clearTimeout(voz.vigia);
    // el 1er arranque puede estar esperando a que aceptes el aviso de permiso del micro: ahí se espera mucho más
    const espera = voz.oido || auto ? 2000 : voz.micOk ? 5000 : 15000;   // (20-nov) con permiso ya dado, 5 s
    voz.vigia = setTimeout(() => {
        if (!voz?.on || voz.vivo || voz.paused || voz.speaking) return;
        // (19-nov) antes de pedir un toque, un 2.º intento con un micro nuevo: a veces el primero no arrancaba
        if (!voz.reintento) {
            voz.reintento = true; vozEv('no arrancó en ' + espera / 1000 + ' s, pruebo otro');
            try { voz.rec.abort(); } catch {}
            voz.rec = vozNuevoRec(voz.SR);
            return vozArranca(true);
        }
        vozEv('no arrancó en ' + espera / 1000 + ' s'); vozPausa();
    }, espera);
}

function vozStart(SR) {
    voz = { on: true, SR, rec: null, carro: null, undo: [], pending: null, speaking: false, mudoHasta: 0, oido: false, paused: false, vivo: false, vigia: 0, trasFin: null, reintento: false };
    try { vozAC = vozAC || new (window.AudioContext || window.webkitAudioContext)(); vozAC.resume(); } catch {}
    voz.rec = vozNuevoRec(SR);
    try { navigator.permissions?.query({ name: 'microphone' }).then(s => { if (voz) voz.micOk = s.state === 'granted'; }).catch(() => {}); } catch {}
    const v = vozVozES();
    vozEv('— modo voz v' + APP_BUILD + (VOZ_IOS ? ' (iPhone)' : '') + ' · voz ' + (v ? v.name : 'por defecto'));
    document.getElementById('btnVoz').classList.add('on');
    document.getElementById('vozBar').classList.add('on');
    vozShow('', 'Escuchando…');
    // (19-nov) el saludo se dice DENTRO del toque (así el iPhone deja hablar a la app) y el micro se enciende
    // cuando ella termina. Antes voz muda + micro a la vez en el mismo toque: a veces el micro no arrancaba.
    vozSay('Escuchando ' + vozTabName());
}

function vozPausa() {
    if (!voz?.on || voz.paused) return;
    voz.paused = true;
    vozEv('pausa: toca 🎤');
    document.getElementById('btnVoz').classList.remove('on');
    vozShow('', 'Toca 🎤 para seguir', true);
    vozSay('Toca el micro para seguir');   // por voz: no hace falta mirar la pantalla
}
function vozResume() {
    if (!voz?.on) return;
    voz.paused = false; voz.toque = true;
    vozEv('toque: reanudo');
    voz.tFin = Date.now();
    vozArranca(false);
    document.getElementById('btnVoz').classList.add('on');
    vozShow('', 'Escuchando…');
}

function vozStop() {
    if (!voz) return;
    voz.on = false;
    clearTimeout(voz.vigia); clearTimeout(voz.ttsT); clearTimeout(voz.esperaT); clearTimeout(voz.cierreT); clearInterval(voz.mira); clearTimeout(voz.sordoT); clearInterval(voz.mudoI);
    voz.trasFin = null;
    vozEv('— apagado');
    try { voz.rec.abort(); } catch {}
    window.speechSynthesis?.cancel();
    saveChecklistState();
    document.getElementById('btnVoz').classList.remove('on');
    document.getElementById('vozBar').classList.remove('on');
}

let vozAC = null;
// (20-nov) toc corto y grave: el micro ya está escuchando
function vozTic() {
    try {
        const ac = vozAC; if (!ac) return;
        if (ac.state !== 'running') ac.resume();
        const t = ac.currentTime + 0.01, o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = 660;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.25, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
        o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.1);
    } catch {}
}
function vozDing() {
    try {
        const ac = vozAC; if (!ac) return 0;
        if (ac.state !== 'running') ac.resume();
        const t = ac.currentTime + 0.02;
        [[1046.5, 0], [1568, 0.11]].forEach(([f, d]) => {
            const o = ac.createOscillator(), g = ac.createGain();
            o.type = 'sine'; o.frequency.value = f;
            g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(0.35, t + d + 0.015); g.gain.exponentialRampToValueAtTime(0.001, t + d + 0.28);
            o.connect(g).connect(ac.destination); o.start(t + d); o.stop(t + d + 0.3);
        });
        return 380;
    } catch { return 0; }
}

// voz clara en español: la mejor de España que tenga el iPhone (mejorada/premium, Mónica…), nunca las de broma
const VOZ_RARAS = /eddy|flo\b|grandma|grandpa|abuel|reed|rocko|sandy|shelley|bells|bubbles|news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|bahh|boing|cellos|fred|junior|kathy|ralph/i;
function vozVozES() {
    try {
        const vs = speechSynthesis.getVoices().filter(v => /^es[-_]ES$/i.test(v.lang) && !VOZ_RARAS.test(v.name));
        const rango = v => { const s = v.name + ' ' + v.voiceURI; return /premium/i.test(s) ? 0 : /enhanced|mejorad/i.test(s) ? 1 : /m[oó]nica/i.test(s) ? 2 : /marisol/i.test(s) ? 3 : 4; };
        return vs.sort((a, b) => rango(a) - rango(b))[0] || null;
    } catch { return null; }
}

/* habla por turnos: micro apagado del todo → (tintín) → voz → micro otra vez.
   (19-nov) El micro NO se vuelve a abrir hasta que ella ha terminado de verdad. Antes se reabría a los ~2 s
   por tiempo («la voz sonó pero no avisó del final» en el registro): el iPhone, al abrir el micro, corta
   la voz y la pasa a modo llamada (bajita y rara) → «no se entiende» y «se calla al segundo». */
function vozSay(txt) {
    if (!window.speechSynthesis || !voz?.on) return;
    voz.speaking = true;
    clearTimeout(voz.ttsT); clearTimeout(voz.esperaT); clearInterval(voz.mira);
    const decir = pausa => {
        if (!voz?.on) return;
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = 'es-ES'; u.rate = 1;
        const vv = vozVozES(); if (vv) u.voice = vv;
        let hecho = false, sono = false, fin = false;
        const back = motivo => {
            if (hecho || !voz) return; hecho = true; clearInterval(voz.mira); clearTimeout(voz.ttsT);
            if (motivo) vozEv(motivo);
            voz.speaking = false; voz.mudoHasta = Date.now() + 150; voz.tFin = Date.now();
            vozArranca(false);                         // vuelve a escuchar (si no está en pausa)
        };
        u.onstart = () => { sono = true; };
        u.onend = () => { fin = true; };
        u.onerror = e => { if (!fin) vozEv('voz error ' + (e.error || '')); fin = true; };
        const hablar = () => {
            if (!voz?.on) return;
            if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
            speechSynthesis.speak(u);
            const t0 = Date.now(), tope = 1800 + txt.length * 100;   // tope generoso: solo si el iPhone no dice nada
            voz.mira = setInterval(() => {
                const t = Date.now() - t0, suena = speechSynthesis.speaking || speechSynthesis.pending;
                if (suena) sono = true;
                if (fin || (sono && !suena && t > 300)) return back();                     // ha terminado
                if (!sono && t > 2000) return back('la voz no sonó: «' + txt + '»');
                if (t > tope) return back('la voz no avisó del final (' + (t / 1000).toFixed(1) + ' s)');
            }, 100);
        };
        // tras apagar el micro, un respiro para que el iPhone vuelva al altavoz; luego tintín y voz
        // (sin respiro = dentro del toque: el iPhone solo deja hablar a la app si la 1.ª frase sale en el toque)
        const conTintin = () => {
            const ding = voz?.ding ? vozDing() : 0; if (voz) voz.ding = false;
            ding ? (voz.ttsT = setTimeout(hablar, ding)) : hablar();
        };
        pausa ? (voz.ttsT = setTimeout(conTintin, pausa)) : conTintin();
    };
    if (voz.vivo) {
        voz.trasFin = () => decir(250);                // se dice cuando el micro avise de que ya está apagado
        try { voz.rec.abort(); } catch {}
        voz.esperaT = setTimeout(() => { if (voz?.trasFin) { const f = voz.trasFin; voz.trasFin = null; vozEv('el micro no avisó de que se apagó; hablo igual'); f(); } }, 1000);
    } else {
        clearTimeout(voz.vigia);
        try { voz.rec.abort(); } catch {}
        decir(0);
    }
}

const vozTab = () => document.querySelector('.tab.active')?.dataset.tab;
const vozTabName = () => { const t = vozTab(); return !t || t === 'RESUMEN' || t.includes('Editor') ? '' : t; };

function vozShow(heard, msg, err) {
    if (heard) try {
        const log = JSON.parse(localStorage.getItem(VOZ_LOG_KEY) || '[]');
        const ln = `${new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' })} [${vozTabName()}] «${voz?.lastAlts || heard}» → ${msg || ''}`;
        log.push(ln);
        localStorage.setItem(VOZ_LOG_KEY, JSON.stringify(log.slice(-60)));
    } catch {}
    const locs = inventoryData[vozTab()] ? Object.keys(inventoryData[vozTab()]) : [];
    const pl = vozPrefLoc();
    document.getElementById('vozCtx').textContent = '🎤 ' + (vozTabName() || 'abre un quirófano') + (pl && locs.includes(pl) ? ' · ' + pl : '') + ' · v' + APP_BUILD;
    if (heard !== null) document.getElementById('vozHeard').textContent = heard ? '«' + heard + '»' : '';
    const last = document.getElementById('vozLast');
    last.textContent = msg || ''; last.classList.toggle('err', !!err);
}

function vozHandle(alts) {
    const heard = alts[0].trim();
    voz.lastAlts = alts.map(a => a.trim()).join(' | ');
    let n = vozNorm(heard);
    VOZ_SYN.forEach(([re, rep]) => { n = n.replace(re, rep); }); // «no ve cután» = Nobecutan, no la orden «no»
    // ── órdenes ──
    if (/^(para|parar|stop|fin|terminar|apagar)$/.test(n)) { vozSay('Apagado'); setTimeout(vozStop, 900); return vozShow(heard, 'Apagado'); }
    if (/^(deshacer|deshaz|atras|borra eso|anula)$/.test(n)) return vozUndo(heard);
    const tabHit = vozTabCommand(n);
    if (tabHit) {
        switchTab(tabHit); voz.carro = null; voz.pending = null; voz.ultimo = null;
        vozShow(heard, 'Pestaña ' + tabHit); return vozSay(vozSpeak(tabHit));
    }
    const area = vozTab();
    const locs = inventoryData[area] ? Object.keys(inventoryData[area]) : [];
    if (!locs.length) { vozShow(heard, 'Abre primero un quirófano, REA o UCSI', true); return vozSay('Abre primero un quirófano'); }
    const carroAns = vozCarroOf(n, locs);
    const remove = /^(quita|quitar|borra|borrar|desmarca|desmarcar|no)\b/.test(n);
    const strip = a => remove ? vozNorm(a).replace(/^(quita|quitar|borra|borrar|desmarca|desmarcar|no)\s*/, '') : a;

    // ── respuesta a la pregunta anterior: se junta con lo dicho antes («gasas grandes» + «con contraste») ──
    // (20-nov noche) si lo nuevo ya nombra otro material claro («agujas verde» tras «Guedel, ¿cuál?»), la pregunta se olvida
    if (voz.pending) {
        const own = vozMatch(area, strip(heard))[0];
        if (own && own.score >= 10 && !voz.pending.keys.has(own.loc + ID_SEP + own.item.name)) voz.pending = null;
    }
    if (voz.pending) {
        const p = voz.pending; voz.pending = null;
        if (carroAns) voz.carro = carroAns;
        const r = vozMatch(area, p.text + ' ' + heard).filter(c => p.keys.has(c.loc + ID_SEP + c.item.name));
        let pool = r.length ? r.filter(c => c.score === r[0].score) : [];
        if (carroAns) pool = pool.filter(c => c.loc === carroAns);
        if (p.needOpt) pool = pool.filter(c => c.opts.length);
        if (pool.length && pool.length < p.n) return vozResolve(pool, heard, p.text + ' ' + heard, p.remove || remove);   // «quita…» en la respuesta también quita
        // (20-nov) «Mililitros», «sí»: no dice cuál → se vuelve a preguntar (una vez) en vez de perder la pregunta
        if (p.needOpt && p.opts && !p.otra && !vozTokens(heard).nums.length && !vozMatch(area, heard).length) {
            voz.pending = { ...p, otra: true };
            vozShow(heard, '¿Cuál? ' + p.opts.join(' · '), true);
            return vozSay('¿Cuál? ' + p.opts.map(vozSpeak).join(', '));
        }
        // no aclara nada → se trata como frase nueva
    }
    if (carroAns) {
        // cambio de carro preferente: «anestesia», «de enfermería», «carro otros»
        voz.carro = carroAns; vozScrollToLoc(carroAns);
        vozShow(heard, '→ ' + carroAns); return vozSay(vozSpeak(carroAns));
    }
    // (20-nov) solo números («faltan nueve», «cinco cc», «10 ml», «de 10»): van al último material o a la medida
    const U0 = vozTokens(heard);
    if (!remove && U0.nums.length && !U0.words.filter(w => !VOZ_CARRO[w]).length) return vozSoloNum(area, U0, n, heard);
    // prueba las alternativas que da el reconocedor y se queda con la que mejor encaja
    let best = null, bestTxt = heard;
    alts.forEach((a, ai) => {
        const r = vozMatch(area, strip(a));
        if (r.length && (!best || r[0].score - ai * 2 > best[0].score)) { best = r; bestTxt = strip(a); }
    });
    if (!best) { vozShow(heard, 'No lo encuentro en ' + area, true); return vozSay('No lo encuentro'); }
    vozResolve(best, heard, bestTxt, remove);
}

// (20-nov) frase sin material, solo número/medida:
//   1) el último material dicho: «Jeringas 10cc» → «cinco» = 5cc · «SF 100ml» → «faltan nueve» = faltan 9
//   2) si no, por la medida: «cinco cc» = Jeringas 5cc · «10 ml» = Jeringas 10cc o SF 10ml (si hay dos, pregunta)
function vozSoloNum(area, U, n, heard) {
    const num = U.nums[0], cc = /\bcc\b/.test(n), ml = /\bml\b/.test(n), mg = /\bmg\b/.test(n), falta = /\bfaltan?\b/.test(n);
    const optNum = it => (it.options || []).find(o => vozTokens(o.replace(/\(.*?\)/g, '')).nums.includes(num));
    const u = voz.ultimo?.area === area ? voz.ultimo : null;
    if (u) {
        const o = !falta && optNum(u.item);
        if (o) return vozApply({ area, loc: u.loc, item: u.item, opts: [o], qty: null }, heard);
        if (!cc && !ml && !mg && u.item.type === 'number' && u.item.stock > 1) return vozApply({ area, loc: u.loc, item: u.item, opts: [], qty: Math.round(num) }, heard);
    }
    const cands = [];
    if (!falta) for (const loc in inventoryData[area]) inventoryData[area][loc].forEach(item => {
        const o = optNum(item);
        // (20-nov) «4 mg» (se perdió «Ondansetrón») = el que lleva 4mg en el nombre, no «faltan 4» del anterior
        if (mg) { if (/\d\s?mg\b/i.test(item.name) && vozTokens(item.name).nums.includes(num)) cands.push({ area, loc, item, opts: [], qty: null, score: 10 }); return; }
        if (o && (cc ? /cc/i.test(o) : /cc|ml/i.test(o))) return cands.push({ area, loc, item, opts: [o], qty: null, score: 10 });
        if (!cc && !item.options?.length && /\d\s?ml\b/i.test(item.name) && vozTokens(item.name).nums.includes(num))
            cands.push({ area, loc, item, opts: [], qty: null, score: 10 });
    });
    if (cands.length) return vozResolve(cands, heard, n, false);
    if (u) { vozShow(heard, vozLabel(u.item.name) + ': aquí no lleva cantidad', true); return vozSay(vozSpeak(u.item.name) + ', aquí no lleva cantidad'); }
    vozShow(heard, 'No lo encuentro en ' + area, true); return vozSay('No lo encuentro');
}

// frase que es SOLO un carro/zona (admite «de», «el», «la», «carro»)
function vozCarroOf(n, locs) {
    const w = n.split(' ').filter(x => x && !['carro', 'de', 'del', 'el', 'la', 'en', 'para', 'es'].includes(x));
    if (w.length !== 1) return null;
    return locs.find(l => vozTokens(l).words.filter(x => x !== 'carro').some(x => vozWordEq(w[0], x))) || null;
}

// Producto repetido en los dos carros (Empapador, Guantes S/M/L, Contenedor agujas, Mefix pequeño…):
// sin preguntar, la 1.ª vez va al carro de enfermería (se revisa primero) y, si ya está marcado ahí, al de anestesia.
const VOZ_GEMELOS = ['Carro Enfermeria', 'Carro Anestesia'];
const vozUnidadDe = (item, opt) => vozKey(opt ? (item.optUnit?.[opt] || item.name + ' ' + opt) : (item.unidad || item.name));
function vozMarcado(area, loc, item, opts) {
    const base = [area, loc, item.name].join(ID_SEP);
    if (opts.length) return opts.every(o => document.getElementById([base, o].join(ID_SEP))?.checked);
    const el = document.getElementById(base);
    return !!el && (el.type === 'checkbox' ? el.checked : parseInt(el.value) > 0);
}
function vozGemelo(top, heard, text, remove) {
    const c0 = top[0];
    if (!VOZ_GEMELOS.includes(c0.loc) || !inventoryData[c0.area]) return false;
    if (vozTokens(text).words.some(w => VOZ_CARRO[w])) return false;          // dijo el carro: se respeta
    // con varias opciones y sin decir cuál (Guantes): primero la talla («¿cuál?»), sin preguntar el carro; luego se reparte
    if (c0.item.options?.length && !c0.opts.length) {
        const ambos = top.filter(c => VOZ_GEMELOS.includes(c.loc) && vozKey(c.item.name) === vozKey(c0.item.name));
        if (new Set(ambos.map(c => c.loc)).size < 2) return false;
        voz.pending = { text, remove, keys: new Set(ambos.map(c => c.loc + ID_SEP + c.item.name)), n: ambos.length + 1, needOpt: true, opts: c0.item.options };
        voz.ultimo = { area: c0.area, loc: c0.loc, item: c0.item };
        vozShow(heard, `${vozLabel(c0.item.name)}: ¿cuál? ${c0.item.options.join(', ')}`, true);
        vozSay(`${vozSpeak(c0.item.name)}, ¿cuál?`);
        return true;
    }
    if (c0.opts.length > 1) return false;
    const id = vozUnidadDe(c0.item, c0.opts[0]);
    if (top.some(c => vozUnidadDe(c.item, c.opts[0]) !== id && c.item.name !== c0.item.name)) return false;
    const pares = VOZ_GEMELOS.map(loc => {
        for (const it of inventoryData[c0.area][loc] || []) {
            if (!it.options?.length && vozUnidadDe(it) === id) return { ...c0, loc, item: it, opts: [] };
            const o = (it.options || []).find(o => vozUnidadDe(it, o) === id);
            if (o) return { ...c0, loc, item: it, opts: [o] };
        }
        return null;
    });
    if (!pares[0] || !pares[1]) return false;
    const [enf, ane] = pares;
    const enfLleno = vozMarcado(c0.area, enf.loc, enf.item, enf.opts), aneLleno = vozMarcado(c0.area, ane.loc, ane.item, ane.opts);
    const elegido = remove ? (aneLleno ? ane : enf) : (enfLleno ? ane : enf);
    vozApply({ ...elegido, remove }, heard, text);
    return true;
}

// aplica si está claro; si no, pregunta (materiales distintos o mismo material en dos carros)
function vozResolve(best, heard, text, remove) {
    let top = best.filter(c => c.score === best[0].score);
    // (20-nov) «Receptales faltan cinco»: entre empates, el que admite esa cantidad (Receptales ×8, no Receptal ×2)
    const caben = top.filter(c => c.qty > 1 && c.item.type === 'number' && c.item.stock >= c.qty);
    if (caben.length && caben.length < top.length) top = caben;
    if (vozGemelo(top, heard, text, remove)) return;
    const pref = vozPrefLoc();
    const inCarro = top.filter(c => c.loc === pref);
    // (20-nov noche) «… verde» a secas empata Agujas Verde con Guedel verde: se pregunta, no se elige por el carro en pantalla
    const flojo = top.length > 1 && top[0].score <= 6 && new Set(top.map(c => vozKey(c.item.name))).size > 1;
    if (inCarro.length && !flojo) top = inCarro;
    const names = [...new Map(top.map(c => [vozKey(c.item.name), c.item.name])).values()];
    const locsT = [...new Set(top.map(c => c.loc))];
    if (names.length > 1 || locsT.length > 1) {
        voz.pending = { text, remove, keys: new Set(top.map(c => c.loc + ID_SEP + c.item.name)), n: top.length };
        if (names.length > 1) {
            const list = names.slice(0, 4);
            vozShow(heard, '¿Cuál? ' + list.map(vozLabel).join(' · '), true);
            return vozSay('¿Cuál? ' + list.map(vozSpeak).join(', '));
        }
        const q = locsT.map(l => l.replace('Carro ', '')).join(' o ');
        vozShow(heard, '¿' + q + '?', true);
        return vozSay(vozSpeak(q) + '?');
    }
    vozApply({ ...top[0], remove }, heard, text);
}

function vozTabCommand(n) {
    const w = n.split(' ');
    if (w.length > 3) return null;
    if (/^(quirofano|quirofanos|qx|q)\b/.test(n)) {
        const num = vozTokens(n).nums[0];
        const t = `Quirófano ${num}`;
        return tabOrder.includes(t) ? t : null;
    }
    if (/^hemo/.test(n)) return 'Hemodinamia';
    if (/^(rea|reanimacion|reanima)/.test(n)) return 'Reanimación';
    if (/^(ucsi|u c s i|uxi|ucs)$/.test(n)) return 'UCSI';
    if (/^resumen$/.test(n)) return 'RESUMEN';
    return null;
}

// candidatos de la pestaña, ordenados por puntuación.
// Cada material se prueba con su nombre y con sus alias de voz; se queda la mejor forma.
function vozMatch(area, text) {
    const U = vozTokens(text);
    // carro dicho dentro de la frase («guantes anestesia pequeño») → preferencia, no cuenta como palabra
    const carroWords = U.words.filter(w => VOZ_CARRO[w]);
    U.words = U.words.filter(w => !VOZ_CARRO[w]);
    if (!U.words.length) return [];
    // también parejas juntas: «steri strip» ≈ SteryStrip
    const UW = [...U.words, ...U.words.slice(1).map((w, i) => U.words[i] + w)];
    const wordsOf = t => vozTokens(t).words.filter(w => w.length > 1 && !['r', 'u', 'rea', 'ucsi'].includes(w) && !VOZ_CARRO[w]);
    const out = [];
    for (const loc in inventoryData[area]) {
        inventoryData[area][loc].forEach(item => {
            const key = vozKey(item.name);
            const N = vozTokens(item.name);
            const variants = [wordsOf(item.name), ...(VOZ_ALIAS_N[key] || []).map(wordsOf)];
            // opciones con sus alias
            const optVars = (item.options || []).map(o => {
                const base = vozTokens(o.replace(/\(.*?\)/g, ''));
                if (base.nums.length) base.words = base.words.filter(w => !['g', 'mg', 'cc', 'ml', 'gr'].includes(w)); // unidades: 1g, 20cc
                const al = (VOZ_OPT_ALIAS_N[key + ID_SEP + vozKey(o)] || []).map(t => ({ words: vozTokens(t).words, nums: [] }));
                return { o, forms: [base, ...al] };
            });
            let bestC = null;
            variants.forEach((nameWords, vi) => {
                let matched = 0, soloTalla = true;
                nameWords.forEach(nw => { if (UW.some(uw => vozWordEq(uw, nw))) { matched++; if (![...VOZ_PEQ, ...VOZ_GRA].includes(nw)) soloTalla = false; } });
                if (matched && soloTalla) matched = 0; // «pequeño» suelto no basta para elegir Gasas Pequeñas
                // (20-nov) solo el color («… amarillo») no basta para elegir Guedel #3 (Amarillo): empata con Agujas Amarilla → pregunta
                const soloColor = matched > 0 && nameWords.filter(nw => UW.some(uw => vozWordEq(uw, nw))).every(nw => VOZ_COLOR.includes(nw));
                let nums = U.nums.slice();
                const optHits = [];
                optVars.forEach(({ o, forms }) => {
                    let hit = null;
                    forms.forEach(O => {
                        const letter = O.words.length === 1 && !O.nums.length && VOZ_LETTER[O.words[0]];
                        const used = letter ? U.words.filter(uw => letter.includes(uw))
                            : O.words.length ? UW.filter(uw => O.words.some(ow => vozWordEq(uw, ow))) : [];
                        const wordHit = letter ? used.length > 0 : O.words.length > 0 && O.words.every(ow => UW.some(uw => vozWordEq(uw, ow)));
                        const numHit = O.nums.length > 0 && O.nums.every(on => nums.includes(on));
                        if ((O.nums.length ? numHit : wordHit) && (!hit || used.length > hit.used.length))
                            hit = { o, used, byWords: wordHit && !letter, nums: O.nums };
                    });
                    if (hit) optHits.push(hit);
                });
                // si dos opciones encajan con las mismas palabras, gana la más completa (Clorh. Alc. > Alcohol)
                const opts = optHits.filter(h => !optHits.some(k => k !== h && k.used.length > h.used.length && h.used.every(w => k.used.includes(w))));
                opts.forEach(h => h.nums.forEach(on => { const i = nums.indexOf(on); if (i >= 0) nums.splice(i, 1); }));
                const optWords = Math.max(0, ...opts.filter(h => h.byWords).map(h => h.used.length));
                if (!matched && !optWords) return;
                // las palabras de la opción no penalizan al nombre (Guantes sondaje = opción de Kit sondaje)
                // (20-nov) solo por la opción («Receptal» = opción del Set Aspiración) vale menos que el nombre a medias
                // («Receptal Aspiración»): «receptal» suelto va al que se cuenta, el Set solo si se dice «set aspiración… receptal»
                let score = matched && !soloColor ? matched * 10 - (nameWords.length - matched) * 3 : 2 + Math.max(optWords, soloColor ? matched : 0) * 4;
                // números del nombre (TET 7,5 · Abocath 18G · Guedel #3 90mm) no son cantidad; el primero dicho identifica
                // (21-nov) «Mepivacaína 2% faltan dos»: el número tras «faltan» es la cantidad aunque coincida con el del nombre
                const hitNums = N.nums.filter(nn => nums.includes(nn) && !(nn === U.falta && nums.filter(x => x === nn).length === 1));
                hitNums.forEach(nn => { score += 6 + (U.nums[0] === nn ? 2 : 0); nums.splice(nums.indexOf(nn), 1); });
                // (21-nov) el castigo por no decir el número del nombre solo si se dijo OTRO número (no la cantidad):
                // «mepivacaína faltan 3» iba a Ropivacaína porque Mepivacaína 2% salía castigada
                const otrosNums = U.nums.filter(x => x !== U.falta);
                if (N.nums.length && !hitNums.length && !soloColor && otrosNums.length) score -= 4;
                // palabra dicha tal cual (no parecida) desempata: «mepivacaina» = Mepivacaína, no Ropivacaína
                score += nameWords.filter(nw => U.words.includes(nw)).length;
                if (opts.length && matched) score += 3 + optWords * 2;
                if (carroWords.some(w => VOZ_CARRO[w] === loc)) score += 5;
                // (20-nov) «Receptales faltan cinco»: si se dice cantidad, gana el que se cuenta (no la opción del Set)
                if (nums.length && item.type === 'number' && item.stock > 1 && matched) score += 3;
                // la palabra de carro forma parte del nombre («Set aspiración anestesia»): cuenta como acierto del nombre
                score += N.words.filter(w => VOZ_CARRO[w] && carroWords.includes(w)).length * 10;
                const c = { area, loc, item, opts: opts.map(h => h.o), qty: U.falta != null && nums.includes(U.falta) ? Math.round(U.falta) : nums.length ? Math.round(nums[0]) : null, score };
                if (!bestC || c.score > bestC.score) bestC = c;
            });
            if (bestC) out.push(bestC);
        });
    }
    return out.sort((a, b) => b.score - a.score);
}

function vozApply(c, heard, text = heard) {
    const { area, loc, item, opts, qty, remove } = c;
    voz.ultimo = { area, loc, item };   // (20-nov) «faltan nueve» / «cinco» sueltos van a este
    const base = [area, loc, item.name].join(ID_SEP);
    const changes = [];
    let said, saidVoz;
    if (item.type === 'number' && item.stock > 1) {
        const sel = document.getElementById(base);
        if (!sel) return;
        const v = remove ? 0 : Math.min(qty ?? 1, item.stock);
        changes.push({ el: sel, prev: sel.value });
        sel.value = String(v);
        said = remove ? `${item.name}, stock completo` : `${item.name}, faltan ${v}` + (qty > item.stock ? `, máximo ${item.stock}` : '');
    } else if (item.options?.length) {
        if (!opts.length) {
            voz.pending = { text, remove, keys: new Set([loc + ID_SEP + item.name]), n: 2, needOpt: true, opts: item.options };
            vozShow(heard, `${vozLabel(item.name)}: ¿cuál? ${item.options.join(', ')}`, true);
            return vozSay(`${vozSpeak(item.name)}, ¿cuál?`);
        }
        opts.forEach(o => { const cb = document.getElementById([base, o].join(ID_SEP)); if (cb) { changes.push({ el: cb, prev: cb.checked }); cb.checked = !remove; } });
        said = `${item.name} ${opts.join(' y ')}` + (remove ? ', quitado' : '');
        // (20-nov) «Betadine» → dice «Betadine», sin la familia («Antisépticos»). La familia se dice solo si la opción sola
        // no se entiende (5cc, M, Verde…); de un Set se avisa («Receptal del set») para que se note que no es el suelto
        const solo = o => { const s = o.replace(/\(.*?\)/g, '').trim(); return /^[a-záéíóúñü.\s]{4,}$/i.test(s) && !VOZ_COLOR.includes(vozNorm(s)); };
        if (!remove && opts.every(solo)) saidVoz = opts.join(' y ') + (/^set\b/i.test(item.name) ? ' del set' : '');
    } else {
        const cb = document.getElementById(base);
        if (!cb) return;
        changes.push({ el: cb, prev: cb.checked });
        cb.checked = !remove;
        // (20-nov) «Paracetamol faltan tres» en REA: ahí es casilla, no número → se dice para que no pase desapercibido
        said = item.name + (remove ? ', quitado' : qty > 1 ? ', aquí no lleva cantidad' : '');
    }
    voz.undo.push(changes);
    voz.carro = loc;
    saveChecklistState();
    const row = changes[0]?.el.closest('.item');
    if (row) { row.scrollIntoView({ behavior: 'smooth', block: 'start' }); row.classList.remove('voz-flash'); void row.offsetWidth; row.classList.add('voz-flash'); }
    vozShow(heard, '✔ ' + vozLabel(said));
    voz.ding = true;            // tintín de confirmación antes de decir el producto
    vozSay(vozSpeak(saidVoz || said));
}

function vozUndo(heard) {
    const last = voz?.undo.pop();
    if (!last) { vozShow(typeof heard === 'string' ? heard : null, 'Nada que deshacer', true); return vozSay('Nada que deshacer'); }
    last.forEach(({ el, prev }) => { if (el.type === 'checkbox') el.checked = prev; else el.value = prev; });
    saveChecklistState();
    vozShow(typeof heard === 'string' ? heard : null, '↶ Deshecho');
    vozSay('Deshecho');
}

// ─────────────────────────────────────────────
// ⚙️ ORDEN de la lista de reposición (RESUMEN → Lista de Reposición Total y «Exportar PDF»)
// Se ordena por material (las opciones van juntas, en su orden: Jeringas 20cc, 10cc…).
// Se guarda en este móvil; «📋 Copiar orden» → pegarlo en DEFAULT_ORDER lo deja fijo para todos.
// ─────────────────────────────────────────────
const ORDER_KEY = 'reposicionOrden_v1';
const DEFAULT_ORDER = {   // orden fijado (25-sep): lo que se ordene en el móvil se suma por encima, grupo a grupo
    groups: [],

let repoOrder = null;
function loadOrder() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(ORDER_KEY)); } catch {}
    // fijo + lo del móvil: cada grupo ordenado en el móvil sustituye al fijo de ese grupo
    const def = DEFAULT_ORDER || { groups: [], items: {} };
    repoOrder = {
        groups: saved?.groups?.length ? saved.groups : [...(def.groups || [])],
        items: { ...JSON.parse(JSON.stringify(def.items || {})), ...(saved?.items || {}) }
    };
}
function saveOrder() { try { localStorage.setItem(ORDER_KEY, JSON.stringify(repoOrder)); } catch {} }

// materiales por ubicación sacados del inventario actual (con los nombres del Editor)
function orderCatalog() {
    const cat = {}, opts = {}, areas = {}, optsSt = {};
    for (const area in inventoryData) for (const loc in inventoryData[area]) for (const it of inventoryData[area][loc]) {
        const st = it.storage || 'Desconocido';
        (cat[st] ||= new Set()).add(it.unidad || it.name);
        Object.values(it.optStorage || {}).forEach(o => (cat[o] ||= new Set()).add(it.name));
        if (it.options?.length) it.options.forEach(o => { const s2 = storageOf(it, o); const l = ((optsSt[s2] ||= {})[it.name] ||= []); if (!l.includes(o)) l.push(o); });
        if (it.options?.length && !opts[it.name]) opts[it.name] = it.options;
        (areas[it.name] ||= new Set()).add(area.startsWith('Quirófano') || area === 'Hemodinamia' ? 'Quirófanos' : area);
    }
    return { cat, opts, areas, optsSt };
}
function orderedStorages(cat) {
    const saved = (repoOrder?.groups || []).filter(g => cat[g]);
    return [...saved, ...Object.keys(cat).filter(g => !saved.includes(g)).sort()];
}
function orderedUnits(st, cat) {
    const set = cat[st] || new Set();
    const saved = (repoOrder?.items?.[st] || []).filter(n => set.has(n));
    return [...saved, ...[...set].filter(n => !saved.includes(n)).sort((a, b) => a.localeCompare(b, 'es'))];
}

const escAttr = t => String(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const orderOpen = new Set();
function renderOrder() {
    const el = document.getElementById('content-⚙-Orden');
    if (!el) return;
    const { cat, areas, optsSt } = orderCatalog();
    el.innerHTML = `<div class="editor-wrap">
        <div class="editor-search-box">
            <h2>⚙️ Orden de la lista de reposición</h2>
            <p class="order-hint">Pon el material en el orden en que lo recoges. Se usa en <b>RESUMEN → Lista de Reposición Total</b> y en <b>🖨️ Exportar PDF</b>.
            Mueve con <b>▲ ▼</b> (uno a uno), <b>⇈ ⇊</b> (al principio / al final) o arrastrando desde <b>⋮⋮</b>. Los grupos también se ordenan con sus ▲ ▼.</p>
            <div class="order-actions">
                <button id="orderCopy">📋 Copiar orden</button>
                <button id="orderReset">↺ Volver al orden fijado</button>
            </div>
        </div>
        <div id="order-groups">${orderedStorages(cat).map(st => {
            const units = orderedUnits(st, cat), opts = optsSt[st] || {}; // solo las opciones que están en esta ubicación
            return `<details class="order-group" data-st="${escAttr(st)}" ${orderOpen.has(st) ? 'open' : ''}>
                <summary class="sub-header ${getLocationClass(st)}"><span class="og-title">${st} · ${units.length}</span>
                    <span class="og-btns"><button class="ord-btn" data-act="gup" title="Subir grupo">▲</button><button class="ord-btn" data-act="gdown" title="Bajar grupo">▼</button></span></summary>
                <ol class="order-list">${units.map(u => `<li data-name="${escAttr(u)}"><span class="oh">⋮⋮</span>
                    <span class="on">${u}${opts[u] || areas[u] ? `<small>${[opts[u]?.join(' · '), [...(areas[u] || [])].join(', ')].filter(Boolean).join(' — ')}</small>` : ''}</span>
                    <button class="ord-btn ord-far" data-act="top" title="Al principio">⇈</button><button class="ord-btn" data-act="up">▲</button><button class="ord-btn" data-act="down">▼</button><button class="ord-btn ord-far" data-act="bottom" title="Al final">⇊</button></li>`).join('')}</ol>
            </details>`;
        }).join('')}</div>
    </div>`;

    // guarda el orden completo de un grupo tal como está en pantalla
    const commitGroup = det => {
        repoOrder ||= { groups: [], items: {} };
        repoOrder.items[det.dataset.st] = [...det.querySelectorAll('.order-list li')].map(li => li.dataset.name);
        saveOrder();
    };
    const commitGroups = () => {
        repoOrder ||= { groups: [], items: {} };
        repoOrder.groups = [...el.querySelectorAll('.order-group')].map(d => d.dataset.st);
        saveOrder();
    };
    const flash = node => { node.classList.remove('moved'); void node.offsetWidth; node.classList.add('moved'); };

    el.querySelectorAll('.order-group').forEach(det => {
        det.addEventListener('toggle', () => det.open ? orderOpen.add(det.dataset.st) : orderOpen.delete(det.dataset.st));
        if (window.Sortable) Sortable.create(det.querySelector('.order-list'), { handle: '.oh', animation: 150, onEnd: () => commitGroup(det) });
    });
    el.querySelector('#order-groups').addEventListener('click', e => {
        const btn = e.target.closest('.ord-btn');
        if (!btn) return;
        e.preventDefault(); e.stopPropagation();   // que no abra/cierre el grupo
        const act = btn.dataset.act;
        if (act === 'top' || act === 'bottom') {
            const li = btn.closest('li'), ol = li.parentElement;
            act === 'top' ? ol.prepend(li) : ol.append(li);
            commitGroup(li.closest('.order-group'));
            flash(li);
            li.scrollIntoView({ block: 'center' });
        } else if (act === 'up' || act === 'down') {
            const li = btn.closest('li');
            const sib = act === 'up' ? li.previousElementSibling : li.nextElementSibling;
            if (!sib) return;
            act === 'up' ? sib.before(li) : sib.after(li);
            commitGroup(li.closest('.order-group'));
            flash(li);
            li.scrollIntoView({ block: 'nearest' });
        } else {
            const det = btn.closest('.order-group');
            const sib = act === 'gup' ? det.previousElementSibling : det.nextElementSibling;
            if (!sib) return;
            act === 'gup' ? sib.before(det) : sib.after(det);
            commitGroups();
            det.scrollIntoView({ block: 'nearest' });
        }
    });
    el.querySelector('#orderCopy').addEventListener('click', async () => {
        const txt = JSON.stringify(repoOrder);
        try { await navigator.clipboard.writeText(txt); alert('Orden copiado. Pégalo en el chat para dejarlo fijo en la app.'); }
        catch { prompt('Copia el orden:', txt); }
    });
    const reset = el.querySelector('#orderReset');
    reset.addEventListener('click', () => {
        if (reset.dataset.confirm !== '1') {
            reset.dataset.confirm = '1'; reset.textContent = '⚠️ Pulsa otra vez para confirmar';
            return setTimeout(() => { if (reset.isConnected) { reset.dataset.confirm = '0'; reset.textContent = '↺ Volver al orden fijado'; } }, 3000);
        }
        try { localStorage.removeItem(ORDER_KEY); } catch {}
        loadOrder();
        renderOrder();
    });
}

function openRef(key) {
    const d = REF_DATA[key]; if (!d) return;
    document.getElementById('ref-panel-title').textContent = d.title;
    document.getElementById('ref-panel-body').innerHTML = d.content;
    document.getElementById('ref-modal').classList.add('on');
}
function closeRef() {
    document.getElementById('ref-modal').classList.remove('on');
}
