const cvNum = n => n ? `<span class="cv-num">${n}</span>` : '';
const cvEtiq = (it, o) => CV_ETIQ[it.name]?.[o] || o;

// turno por la hora (Mañana 8–15, Tarde 15–22, Noche 22–8); la noche cuenta en el día en que empieza
function cvTurno(d = new Date()) {
    const h = d.getHours(), f = new Date(d);
    if (h < 8) f.setDate(f.getDate() - 1);
    const dia = `${f.getFullYear()}-${String(f.getMonth() + 1).padStart(2, '0')}-${String(f.getDate()).padStart(2, '0')}`;
    return { dia, turno: h >= 8 && h < 15 ? 'Mañana' : h >= 15 && h < 22 ? 'Tarde' : 'Noche' };
}
// última vez que se pulsó Revisado / Repuesto en un quirófano (cualquier turno)
function cvUltimo(q, tipo) {
    let u = null;
    try { for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i); if (!k?.startsWith(CV_REG + '|' + q + '|') || !k.endsWith('|' + tipo)) continue;
        const v = localStorage.getItem(k), [, , dia, turno] = k.split('|');
        if (!u || v > u.iso) u = { iso: v, dia, turno };
    } } catch {}
    return u;
}
// revisado y aún sin reponer (de este turno o de uno anterior): lo marcado se queda para el turno siguiente
function cvPendiente(q) { const r = cvUltimo(q, 'revisado'), p = cvUltimo(q, 'repuesto'); return r && (!p || r.iso > p.iso) ? r : null; }
// al cambiar de turno se limpia lo marcado en los quirófanos, SALVO los revisados sin reponer (el registro se queda siempre)
function cvRueda() {
    const t = cvTurno(), k = t.dia + '|' + t.turno, prev = cvLS.get('repo_turno');
    if (prev === k) return;
    cvLS.set('repo_turno', k);
    if (!prev) return;
    let cambia = false; const pend = Object.fromEntries(CV_QS.map(q => [q, !!cvPendiente(q)]));
    document.querySelectorAll('#tab-contents input[type="checkbox"], #tab-contents select').forEach(i => {
        const q = ['Reanimación', 'UCSI', ...CV_QS].find(q => i.id.startsWith(q + ID_SEP));   // (25-nov) REA y UCSI también se limpian
        if (!q || pend[q]) return;
        if (i.type === 'checkbox' ? i.checked : i.value !== '0') { cambia = true; if (i.type === 'checkbox') i.checked = false; else i.value = '0'; }
    });
    if (cambia) saveChecklistState();
    if (document.getElementById('cv').classList.contains('on')) { if (cv.vista !== 'pin' && cv.vista !== 'registro') cv.q = null, cv.vista = 'menu'; cvRender(); }
}
const cvRegKey = (tipo, q = cv.q, t = cvTurno()) => [CV_REG, q, t.dia, t.turno, tipo].join('|');
const cvHora = iso => new Date(iso).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

function cvAbrir(q) {
    cv.q = CV_QS.includes(q) ? q : null;   // (25-nov) al entrar no hay quirófano elegido: cada uno elige el suyo
    cvLS.del('cv_modo');
    if (typeof voz !== 'undefined' && voz?.on) try { vozStop(); } catch {}
    document.body.classList.add('cv-on');
    document.getElementById('cv').classList.add('on');
    cvIr('menu');
}
function cvCerrar() {   // «Bloque completo»: vista clásica, y se recuerda para la próxima vez
    cvLS.set('cv_modo', 'clasico');
    document.body.classList.remove('cv-on');
    document.getElementById('cv').classList.remove('on');
    switchTab(cv.q);
}
function cvIr(vista, z) {
    cv.vista = vista;
    if (z != null) { cv.z = z; const zz = CV_ZONAS[z]; const i = zz.spots.findIndex((s, k) => cvItems(zz, k).length); cv.s = i >= 0 ? i : 0; }
    cvRender();
    document.getElementById('cv').scrollTop = 0;
}
function cvTop() {
    const d = new Date(), { turno } = cvTurno(d);
    const fecha = d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const logo = document.querySelector('.hdr-marca')?.src || '';
    const volver = cv.vista === 'menu' ? '' : `<button class="cv-volver" onclick="cvIr('${cv.vista === 'pin' || cv.vista === 'registro' ? 'menu' : 'menu'}')" title="Volver" aria-label="Volver">${CV_VOLVER}</button>`;
    return `<div class="cv-top">${volver}
        <img class="cv-logo" src="${logo}" alt="Reposició BQ CIMA">
        <div class="cv-meta">
            ${cv.vista !== 'menu' && cv.q ? `<button class="cv-q ${cvClaseQ(cv.q)}" onclick="cvIr('menu')">${cv.q}</button>` : ''}
            <span class="cv-dato">${fecha}</span><span class="cv-dato">Turno de ${turno.toLowerCase()}</span>
        </div></div>`;
}
function cvPop(e) {
    e.stopPropagation();
    const top = document.querySelector('#cv .cv-top');
    const old = top.querySelector('.cv-pop'); if (old) { old.remove(); return; }
    top.insertAdjacentHTML('beforeend', `<div class="cv-pop">${CV_QS.map(q => `<button class="cv-q ${cvClaseQ(q)}" onclick="cvCambiaQ('${q}')">${cvCorto(q)}</button>`).join('')}</div>`);
}
function cvCambiaQ(q) { cv.q = q; cvRender(); }
function cvPideQ() { const f = document.querySelector('#cv .cv-mesas'); if (!f) return; f.classList.remove('pide'); void f.offsetWidth; f.classList.add('pide'); }

// fila de un producto: casillas en una fila, «Faltan 1 2 3» si hay poco stock, desplegable si hay mucho
function cvItemHTML(z, it) {
    const base = [cv.q, z.loc, it.name].join(ID_SEP);
    let ctl;
    if (cvCasillas(it)) {
        ctl = (it.options?.length ? it.options : ['']).map(o => {
            const id = o ? base + ID_SEP + o : base;
            return `<label class="cv-chk"><input type="checkbox" id="cv~${cvEsc(id)}" ${checklistState[id] ? 'checked' : ''}>${o ? cvEsc(cvEtiq(it, o)) : 'Falta'}</label>`;
        }).join('');
    } else if (it.stock <= CV_MAX_BOTONES) {
        const v = parseInt(checklistState[base]) || 0;
        ctl = `<span class="cv-faltan">Faltan</span>` + Array.from({ length: it.stock }, (_, i) =>
            `<button class="cv-n${v === i + 1 ? ' on' : ''}" data-id="${cvEsc(base)}" data-n="${i + 1}">${i + 1}</button>`).join('');
    } else {
        const v = checklistState[base] || '0';
        let o = `<option value="0">Faltan…</option>`;
        for (let i = 1; i <= it.stock; i++) o += `<option value="${i}" ${v == i ? 'selected' : ''}>Faltan ${i}</option>`;
        ctl = `<select id="cv~${cvEsc(base)}" class="cv-sel">${o}</select>`;
    }
    return `<div class="item cv-it g-${it.g || 0}${cvFalta(z, it) ? ' falta' : ''}"><span class="item-name">${cvEsc(it.name)}</span><div class="cv-ctl">${ctl}</div></div>`;
}

function cvRender() {
    const el = document.getElementById('cv');
    const lista0 = el.querySelector('.cv-panel .item-list'), sc = lista0 ? [cv.vista, cv.z, cv.s, lista0.scrollTop].join('|') : null;
    let html = cvTop();
    if (cv.vista === 'menu') {
        const total = CV_ZONAS.reduce((n, z) => n + cvCuenta(z), 0);
        const rev = cv.q && cvLS.get(cvRegKey('revisado')), rep = cv.q && cvLS.get(cvRegKey('repuesto')), no = cv.q ? '' : ' disabled';
        const X = n => (n / 24).toFixed(3) + '%';   // px del dibujo (2400 de ancho) → %
        html += `<div class="cv-port${cv.q ? '' : ' apagado'}">
            <img src="${CV_IMG.portada}" alt="">
            <div class="cv-mesas${cv.q ? ' hay' : ''}">${CV_QS.map((q, i) => `<button class="cv-mesa${q === cv.q ? ' sel' : ''}" style="left:${X(96 + 245.33 * i)}" onclick="cvCambiaQ('${q}')" title="${q}" aria-label="${q}">${q === cv.q ? `<b>${cvCorto(q)}</b>` : ''}</button>`).join('')}</div>
            ${[0, 1, 2].map(i => { const z = CV_ZONAS[i];
                return `<button class="cv-tarj" style="left:${X(17 + 808 * i)}" onclick="${cv.q ? `cvIr('zona', ${i})` : 'cvPideQ()'}" title="${z.nombre}" aria-label="${z.nombre}">${cv.q ? cvNum(cvCuenta(z)) : ''}</button>`; }).join('')}
        </div>
            ${(() => { const p = cv.q && cvPendiente(cv.q); const t = cvTurno();
                return p && !(p.dia === t.dia && p.turno === t.turno) ? `<div class="cv-aviso">Revisado en el turno de ${p.turno.toLowerCase()}${p.dia !== t.dia ? ' del ' + p.dia.split('-').reverse().slice(0, 2).join('/') : ''} (${cvHora(p.iso)}) · falta reponer</div>` : ''; })()}
            <div class="cv-acciones nuevo">
                <button class="cv-acc" onclick="${cv.q ? `cvIr('resumen')` : 'cvPideQ()'}">Resumen${total ? `<b>${total}</b>` : ''}</button>
                <button class="cv-acc${rev ? ' hecho' : ''}" onclick="${cv.q ? `cvMarca('revisado')` : 'cvPideQ()'}">${rev ? `✓ Revisado<small>${cvHora(rev)}</small>` : 'Revisado'}</button>
                <button class="cv-acc${rep ? ' hecho' : ''}" onclick="${cv.q ? `cvMarca('repuesto')` : 'cvPideQ()'}">${rep ? `✓ Repuesto<small>${cvHora(rep)}</small>` : 'Repuesto'}</button>
            </div>
            <div class="cv-pie"><button class="cv-bloque" onclick="cvCerrar()">Bloque completo</button></div>
            <button class="cv-admin" onclick="cvIr('pin')" title="Registro" aria-label="Registro">🔒</button>`;
    } else if (cv.vista === 'zona') {
        const z = CV_ZONAS[cv.z], sp = z.spots[cv.s], items = cvItems(z, cv.s);
        const li = Object.keys(inventoryData[cv.q] || {}).indexOf(z.loc);
        html += `<div class="cv-zona">
            <div class="cv-figbox"><div class="cv-fig"><img src="${CV_IMG[z.k]}" alt="${z.nombre}">
                ${z.spots.map((s, k) => `<button class="cv-hot${k === cv.s ? ' sel' : ''}${s.chico ? ' der' : ''}" style="left:${s.r[0]}%;top:${s.r[1]}%;width:${s.r[2]}%;height:${s.r[3]}%" onclick="cvSpot(${k})" title="${s.n}" aria-label="${s.n}">${cvNum(cvCuenta(z, k))}</button>`).join('')}
                ${z.flechas ? z.spots.map((s, k) => `<button class="cv-flecha" style="left:${s.a[0]}%;top:${s.a[1]}%" onclick="cvSpot(${k})" aria-label="${s.n}">${CV_FLECHA}</button>`).join('') : ''}
                <span class="cv-ring${sp.chico ? ' chico' : ''}" style="left:${sp.a[0]}%;top:${sp.a[1]}%"></span>
            </div></div>
            <div class="cv-panel loc-${li}">
                <div class="cv-ptit"><div>${sp.n}<small>${z.nombre}</small></div></div>
                ${items.length ? `<div class="item-list">${items.map(it => cvItemHTML(z, it)).join('')}</div>` : '<div class="cv-vacio">Sin material</div>'}
            </div></div>`;
    } else if (cv.vista === 'resumen') {
        html += cvResumenHTML();
    } else if (cv.vista === 'pin') {
        html += `<div class="cv-pinbox"><div class="cv-pintit">Clave</div>
            <div class="cv-dots">${[0, 1, 2, 3].map(i => `<span class="${i < cv.pin.length ? 'on' : ''}"></span>`).join('')}</div>
            <div class="cv-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? '<span></span>' : `<button onclick="cvTecla('${k}')">${k}</button>`).join('')}</div></div>`;
    } else if (cv.vista === 'registro') {
        html += cvRegistroHTML();
    }
    el.innerHTML = html;
    el.classList.toggle('fijo', cv.vista === 'zona');
    const lista1 = el.querySelector('.cv-panel .item-list');   // al marcar, la lista se queda donde estaba
    if (lista1 && sc && sc.startsWith([cv.vista, cv.z, cv.s].join('|') + '|')) lista1.scrollTop = +sc.split('|')[3];
}
function cvSpot(k) {
    cv.s = k; cvRender();
    if (innerWidth <= 760) { const p = document.querySelector('#cv .cv-panel'), f = document.querySelector('#cv .cv-figbox');
        const y = p.offsetTop - f.offsetHeight - 4; if (document.getElementById('cv').scrollTop > y) document.getElementById('cv').scrollTop = y; }
}
function cvMarca(tipo) {
    const k = cvRegKey(tipo), ya = cvLS.get(k);
    if (ya) { if (!confirm(`¿Quitar «${tipo === 'revisado' ? 'Revisado' : 'Repuesto'}» de ${cv.q}?`)) return; cvLS.del(k); }
    else cvLS.set(k, new Date().toISOString());
    cvRender();
}
function cvResumenHTML() {
    const porSitio = {};
    CV_ZONAS.forEach(z => (inventoryData[cv.q]?.[z.loc] || []).forEach(it => {
        const base = [cv.q, z.loc, it.name].join(ID_SEP);
        const add = (st, nombre, cant) => (porSitio[st] ||= []).push([nombre, cant]);
        if (cvCasillas(it)) (it.options?.length ? it.options : ['']).forEach(o => {
            if (checklistState[o ? base + ID_SEP + o : base]) add(storageOf(it, o), o ? `${it.name} · ${cvEtiq(it, o)}` : it.name, '✓');
        });
        else if (parseInt(checklistState[base]) > 0) add(it.storage, it.name, checklistState[base]);
    }));
    const { cat } = orderCatalog();
    const sitios = [...orderedStorages(cat).filter(s => porSitio[s]), ...Object.keys(porSitio).filter(s => !cat[s])];
    return `<div class="cv-res cv-res-ancho"><h2>Resumen</h2>
        ${sitios.length ? `<div class="cv-cols">${sitios.map(s => `<div class="cv-card"><div class="sub-header ${getLocationClass(s)}">${s}</div>
            ${porSitio[s].map(([n, c]) => `<div class="cv-fila"><span>${cvEsc(n)}</span><span>${c}</span></div>`).join('')}</div>`).join('')}</div>`
          : '<div class="cv-vacio">No falta nada</div>'}
        ${sitios.length ? `<button class="cv-limpiar" onclick="cvLimpiar()">Limpiar ${cv.q}</button>` : ''}</div>`;
}
function cvLimpiar() {
    if (!confirm(`¿Borrar todo lo marcado en ${cv.q}?`)) return;
    document.querySelectorAll('#tab-contents input[type="checkbox"], #tab-contents select').forEach(i => {
        if (!i.id.startsWith(cv.q + ID_SEP)) return;
        if (i.type === 'checkbox') i.checked = false; else i.value = '0';
    });
    saveChecklistState();
    cvRender();
}
// ── registro del supervisor ──
function cvTecla(k) {
    if (k === '⌫') cv.pin = cv.pin.slice(0, -1);
    else if (cv.pin.length < 4) cv.pin += k;
    if (cv.pin.length === 4) {
        const ok = cv.pin === (cvLS.get(CV_PIN) || '1234');
        cv.pin = '';
        if (ok) { cvIr('registro'); return; }
        cvRender(); const b = document.querySelector('#cv .cv-dots'); b?.classList.add('mal'); return;
    }
    cvRender();
}
function cvRegistroHTML() {
    const filas = {};
    try {
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i); if (!k?.startsWith(CV_REG + '|')) continue;
            const [, q, dia, turno, tipo] = k.split('|');
            (filas[[dia, turno, q].join('|')] ||= { q, dia, turno })[tipo] = localStorage.getItem(k);
        }
    } catch {}
    const tOrd = { 'Mañana': 0, 'Tarde': 1, 'Noche': 2 };
    const lista = Object.values(filas).sort((a, b) => b.dia.localeCompare(a.dia) || tOrd[b.turno] - tOrd[a.turno] || CV_QS.indexOf(a.q) - CV_QS.indexOf(b.q));
    const fDia = d => d.split('-').reverse().slice(0, 2).join('/');
    // (25-nov) enfermera de cada quirófano y turno, del Mapa de Personal del hub (clave compartida bq_personal_asig;
    // la noche pertenece al día en que empieza). Sin Mapa (p. ej. GitHub Pages) la casilla queda vacía.
    let asig = {};
    try { asig = JSON.parse(localStorage.getItem('bq_personal_asig') || '{}') || {}; } catch {}
    if (lista.some(f => !asig[f.dia])) cvAsigPide();
    const enf = f => { const n = asig[f.dia]?.[f.turno]?.[cvCorto(f.q)]; return n ? String(n).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]) : ''; };
    return `<div class="cv-res"><h2>Registro</h2>
        ${lista.length ? `<div class="cv-card"><div class="cv-reg cv-regcab"><span>Fecha</span><span>Turno</span><span>Quiró&shy;fano</span><span>Enfermera</span><span>Revi&shy;sado</span><span>Repues&shy;to</span></div>
            ${lista.map(f => `<div class="cv-reg"><span>${fDia(f.dia)}</span><span>${f.turno}</span><span>${cvCorto(f.q)}</span><span>${enf(f)}</span><span>${f.revisado ? cvHora(f.revisado) : '—'}</span><span>${f.repuesto ? cvHora(f.repuesto) : '—'}</span></div>`).join('')}</div>`
          : '<div class="cv-vacio">Sin registros</div>'}
        <button class="cv-bloque" onclick="cvCambiaPin()">🔑 Cambiar clave</button></div>`;
}
// (26-nov) Si al Registro le faltan días en bq_personal_asig (nadie ha abierto el Mapa de Personal hace poco),
// en el hub se abre el Mapa escondido un momento: al arrancar rehace la clave (y sync.js / la carpeta la reparten).
function cvAsigPide() {
    if (cvAsigPide.hecho || !/\/herramientas\/[^/]*$/.test(location.pathname)) return;
    cvAsigPide.hecho = true;
    const antes = localStorage.getItem('bq_personal_asig');
    const f = document.createElement('iframe');
    f.src = 'personal.html'; f.tabIndex = -1; f.setAttribute('aria-hidden', 'true');
    f.style.cssText = 'position:fixed;left:-20px;top:-20px;width:10px;height:10px;opacity:0;border:0;pointer-events:none';
    let n = 0;
    const mira = setInterval(() => {
        if (localStorage.getItem('bq_personal_asig') === antes && ++n < 60) return;
        clearInterval(mira); setTimeout(() => f.remove(), 3000);
        if (cv.vista === 'registro') cvRender();
    }, 250);
    document.body.appendChild(f);
}
function cvCambiaPin() {
    const p = prompt('Clave nueva (4 números)');
    if (p == null) return;
    if (!/^\d{4}$/.test(p)) { alert('Tienen que ser 4 números'); return; }
    cvLS.set(CV_PIN, p); alert('Clave cambiada');
}
document.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById('cv');
    const pasa = (id, fn) => { const o = document.getElementById(id); if (!o) return; fn(o); saveChecklistState(); };
    el.addEventListener('change', e => {
        const t = e.target; if (!t.id?.startsWith('cv~')) return;
        pasa(t.id.slice(3), o => { if (t.type === 'checkbox') o.checked = t.checked; else o.value = t.value; });
        cvRender();
    });
    el.addEventListener('click', e => {
        const b = e.target.closest('.cv-n');
        if (b) { pasa(b.dataset.id, o => { o.value = b.classList.contains('on') ? '0' : b.dataset.n; }); cvRender(); return; }
        if (!e.target.closest('.cv-pop, .cv-q')) el.querySelector('.cv-pop')?.remove();
    });
    cvRueda();
    setInterval(cvRueda, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) cvRueda(); });
    if (cvLS.get('cv_modo') !== 'clasico') cvAbrir();
});
</script>
</body>
</html>
