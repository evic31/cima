<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Repositorio">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reposición BLOQUE QUIRÚRGICO · CIMA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg:          #f5ece0;
            --surface:     #ffffff;
            --surf2:       #eef4ff;
            --border:      #d5e3ff;
            --border2:     #b8cfff;
            --text:        #2d3142;
            --text-muted:  #6b7899;
            --accent:      #58A6FF;
            --accent-dark: #3a90f0;
            --header-bg:   #58A6FF;
            --tab-bg:      rgba(255,255,255,0.18);
            --tab-active:  #ffffff;
            --tab-text:    rgba(255,255,255,0.75);
            --tab-text-a:  #58A6FF;
            --izq:         #059669;
            --der:         #2563eb;
            --pharma:      #dc2626;
            --unk:         #475569;
            --danger:      #ef4444;
            --success:     #10b981;
            --warning:     #f59e0b;
            --shadow-sm:   0 2px 12px rgba(88,166,255,.10);
            --radius:      10px;
            --radius-sm:   7px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* ── TOP ── */
        .top-wrapper {
            position: sticky;
            top: 0;
            z-index: 200;
        }
        header {
            background: var(--header-bg);
            color: #ffffff;
            padding: 0.75rem 1rem;
            text-align: center;
            box-shadow: 0 2px 16px rgba(88,166,255,.30);
            position: relative;
        }
        .header-info-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 15px;
            line-height: 1;
        }
        header h1 {
            font-size: clamp(0.9rem, 3.8vw, 1.15rem);
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        header h1 span { color: #FFEDD5; }

        /* ── TABS ── */
        .tabs-container {
            background: var(--header-bg);
            overflow-x: auto;
            padding: 0.5rem 0.8rem 0.6rem;
            scrollbar-width: none;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tabs { display: flex; gap: 5px; width: max-content; }
        .tab {
            padding: 0.38rem 0.95rem;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--tab-bg);
            color: var(--tab-text);
            font-weight: 600;
            font-size: 0.8rem;
            font-family: 'IBM Plex Sans', sans-serif;
            border-radius: 999px;
            transition: all 0.18s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tab:hover { background: rgba(255,255,255,0.13); color: #e2e8f0; }
        .tab.active {
            background: var(--tab-active);
            color: var(--tab-text-a);
            border-color: var(--tab-active);
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
            font-weight: 700;
        }
        .tab.tab-editor {
            border-color: rgba(245,158,11,0.4);
            color: #f59e0b;
        }
        .tab.tab-editor.active {
            background: var(--warning);
            border-color: var(--warning);
            box-shadow: 0 0 14px rgba(245,158,11,0.4);
        }

        /* ── CONTENT ── */
        main { padding: 1rem 0.85rem 6rem; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeUp 0.2s ease; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(5px); }
            to   { opacity: 1; transform: none; }
        }

        /* ── LOCATION GROUP ── */
        .location-group {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 0.85rem;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        .sub-header {
            padding: 0.6rem 1rem;
            font-weight: 700;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #fff;
            background: var(--unk);
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }
        .sub-header::before {
            content: '';
            width: 5px; height: 5px;
            border-radius: 50%;
            background: rgba(255,255,255,0.55);
            flex-shrink: 0;
        }
        .sub-header.almacen-izq { background: var(--izq); }
        .sub-header.almacen-der { background: var(--der); }
        .sub-header.farmacia    { background: var(--pharma); }
        .sub-header.desconocido { background: var(--unk); }

        /* ── ITEMS ── */
        .item-list { padding: 0.15rem 0; }
        .item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
            padding: 0.7rem 0.95rem;
            border-bottom: 1px solid var(--border);
        }
        .item:last-child { border-bottom: none; }
        .item.g-1, .item.g-3, .item.g-5 { background: #ffffff; }
        .item.g-2, .item.g-4            { background: #ffffff; }
        /* Carro Enfermeria — verde menta en impares */
        .loc-0 .item.g-1,
        .loc-0 .item.g-3 { background: #ecfdf5; }
        /* Carro Anestesia — amarillo cálido en impares */
        .loc-1 .item.g-1,
        .loc-1 .item.g-3,
        .loc-1 .item.g-5 { background: #fef9c3; }
        /* Otros — lavanda en impares */
        .loc-2 .item.g-1,
        .loc-2 .item.g-3 { background: #ede9fe; }
        .item-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
            line-height: 1.3;
            width: 100%;
        }
        .item-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            width: 100%;
        }

        /* ── CHECKBOXES ── */
        .checkbox-group label {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            font-size: 0.83rem;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--surf2);
            border: 1.5px solid var(--border);
            border-radius: 100px;
            padding: 0.3rem 0.7rem;
            transition: all 0.14s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .checkbox-group label:has(input:checked) {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        input[type="checkbox"] {
            width: 1.1em; height: 1.1em;
            accent-color: var(--accent);
            flex-shrink: 0;
        }

        /* ── SELECTS ── */
        .number-group select {
            padding: 0.42rem 0.6rem;
            border-radius: 7px;
            border: 1.5px solid var(--border);
            font-size: 0.83rem;
            font-family: 'Space Mono', monospace;
            min-width: 125px;
            background: var(--surf2);
            color: var(--text);
            cursor: pointer;
            transition: border-color 0.14s;
            -webkit-tap-highlight-color: transparent;
        }
        .number-group select:focus { border-color: var(--accent); outline: none; }

        /* ── EMPTY ── */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        /* ── SUMMARY ── */
        .summary-actions {
            padding: 0.8rem 0 1.1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
        }
        .summary-actions button {
            padding: 0.62rem 1.3rem;
            font-size: 0.88rem;
            font-weight: 600;
            font-family: 'IBM Plex Sans', sans-serif;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            background: var(--danger);
            color: #fff;
            box-shadow: var(--shadow-sm);
            transition: opacity 0.2s, transform 0.1s;
        }
        .summary-actions button:hover { opacity: 0.85; transform: scale(1.02); }
        .summary-section {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 0.9rem;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        #summary-content ul { list-style: none; padding: 0.15rem 0; }
        #summary-content li {
            padding: 0.62rem 0.95rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.88rem;
        }
        #summary-content li:last-child { border-bottom: none; }
        #content-RESUMEN .total-item label,
        #content-RESUMEN .area-item label {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            cursor: pointer;
        }
        #content-RESUMEN .sum-check,
        #content-RESUMEN .sum-area-check {
            width: 1.05em; height: 1.05em;
            accent-color: var(--accent);
            flex-shrink: 0;
        }
        #content-RESUMEN .total-item.done span,
        #content-RESUMEN .area-item.done span {
            text-decoration: line-through;
            color: #aaa;
        }
        .quantity {
            background: var(--accent);
            color: #fff;
            padding: 1px 8px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-family: 'Space Mono', monospace;
            font-weight: 500;
            flex-shrink: 0;
        }

        /* ── EDITOR TAB ── */
        .editor-wrap {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .editor-search-box {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            box-shadow: var(--shadow-sm);
        }
        .editor-search-box h2 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text);
        }
        .search-input-wrap {
            position: relative;
        }
        .search-input-wrap input {
            width: 100%;
            padding: 0.6rem 0.9rem 0.6rem 2.4rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.92rem;
            font-family: 'IBM Plex Sans', sans-serif;
            background: #f8fafc;
            color: var(--text);
            transition: border-color 0.15s;
        }
        .search-input-wrap input:focus { border-color: var(--warning); outline: none; }
        .search-input-wrap .search-icon {
            position: absolute;
            left: 0.7rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            pointer-events: none;
        }
        #editor-results {
            margin-top: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .editor-result-item {
            background: #f8fafc;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.75rem 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            transition: border-color 0.15s;
        }
        .editor-result-item:focus-within {
            border-color: var(--warning);
            background: #fffbeb;
        }
        .editor-result-meta {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .editor-result-meta span {
            display: inline-block;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1px 6px;
            margin-right: 4px;
        }
        .editor-fields {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            align-items: flex-end;
        }
        .editor-field {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            flex: 1;
            min-width: 120px;
        }
        .editor-field label {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .editor-field input {
            padding: 0.45rem 0.65rem;
            border: 1.5px solid var(--border);
            border-radius: 7px;
            font-size: 0.88rem;
            font-family: 'IBM Plex Sans', sans-serif;
            background: #fff;
            color: var(--text);
            width: 100%;
        }
        .ef-name { text-transform: uppercase; }
        .editor-field input[type="number"] {
            font-family: 'Space Mono', monospace;
            max-width: 110px;
        }
        .editor-field input:focus { border-color: var(--warning); outline: none; }
        .editor-save-btn {
            padding: 0.48rem 1.1rem;
            background: var(--warning);
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: 0.86rem;
            font-family: 'IBM Plex Sans', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            align-self: flex-end;
            white-space: nowrap;
        }
        .editor-save-btn:hover { background: #d97706; transform: scale(1.02); }
        .editor-save-btn.saved {
            background: var(--success);
        }
        .editor-no-results {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.88rem;
            padding: 1.2rem 0;
        }
        .editor-hint {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.84rem;
            padding: 1rem 0;
        }
        .editor-type-badge {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 1px 7px;
            border-radius: 4px;
            margin-left: 6px;
        }
        .badge-number { background: #dbeafe; color: #1d4ed8; }
        .badge-check  { background: #dcfce7; color: #166534; }

        /* ── FLOATING BUTTONS ── */
        #btnSubir, #btnGuardar {
            position: fixed;
            z-index: 9999;
            border: none;
            cursor: pointer;
            font-family: 'IBM Plex Sans', sans-serif;
            font-weight: 600;
            transition: transform 0.18s, box-shadow 0.18s;
        }
        #btnSubir {
            bottom: 1.1rem; right: 1.1rem;
            font-size: 1.1rem;
            background: var(--accent);
            color: #fff;
            width: 46px; height: 46px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(14,165,233,0.45);
        }
        #btnSubir:hover { transform: scale(1.1); }
        #btnGuardar {
            bottom: 1.1rem; left: 1.1rem;
            font-size: 0.86rem;
            background: var(--accent);
            color: #fff;
            padding: 0.62rem 1.1rem;
            border-radius: 999px;
            box-shadow: 0 4px 16px rgba(88,166,255,0.4);
            border: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        #btnGuardar:hover { transform: scale(1.03); }
        #btnGuardar::before { content: '💾'; font-size: 0.95rem; }

        /* ── MODO VOZ ── */
        #btnVoz {
            position: fixed; z-index: 9999;
            bottom: 1.1rem; left: 50%; transform: translateX(-50%);
            width: 54px; height: 54px; border-radius: 50%;
            border: none; cursor: pointer; font-size: 1.45rem;
            background: #fff; box-shadow: 0 4px 16px rgba(88,166,255,0.45);
            display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        #btnVoz.on { background: var(--danger); box-shadow: 0 0 0 6px rgba(239,68,68,0.25); animation: vozPulse 1.4s infinite; }
        @keyframes vozPulse { 50% { box-shadow: 0 0 0 12px rgba(239,68,68,0.12); } }
        #vozBar {
            position: fixed; z-index: 9998; left: 0.6rem; right: 0.6rem; bottom: 5rem;
            background: #fff; border: 1.5px solid var(--border2); border-radius: var(--radius);
            box-shadow: 0 6px 24px rgba(45,49,66,0.18);
            padding: 0.55rem 0.75rem; display: none; font-size: 0.85rem;
        }
        #vozBar.on { display: block; }
        #vozBar .vz-ctx { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
        #vozBar .vz-heard { color: var(--text-muted); font-style: italic; margin-top: 0.15rem; min-height: 1.2em; }
        #vozBar .vz-last { font-weight: 600; margin-top: 0.1rem; min-height: 1.3em; }
        #vozBar .vz-last.err { color: var(--danger); }
        #vozBar .vz-row { display: flex; gap: 0.5rem; justify-content: space-between; align-items: center; }
        #vozBar .vz-btns { display: flex; gap: 0.35rem; flex-shrink: 0; }
        .item { scroll-margin-top: 115px; }
        #vozBar button {
            border: 1.5px solid var(--border2); background: var(--surf2); color: var(--text);
            border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.78rem; font-weight: 600;
            font-family: 'IBM Plex Sans', sans-serif; cursor: pointer;
        }
        .item.voz-flash { animation: vozFlash 1.6s ease; }
        @keyframes vozFlash { 0%, 40% { box-shadow: inset 0 0 0 2px var(--accent); background: #dbeafe; } }
    </style>
</head>
<body>

<div class="top-wrapper">
    <header>
        <h1>Reposición <span>BLOQUE QUIRÚRGICO</span> CIMA</h1>
        <button class="header-info-btn" onclick="document.getElementById('info-modal').style.display='flex'" title="Información">ℹ</button>
    </header>
    <div class="tabs-container">
        <div class="tabs" id="tabs"></div>
    </div>
</div>

<main id="tab-contents"></main>

<button id="btnSubir" title="Subir al inicio">⬆</button>
<button id="btnGuardar" title="Guardar checklist">Guardar</button>
<button id="btnVoz" title="Modo voz: dicta lo que falta">🎤</button>
<div id="vozBar">
    <div class="vz-row"><span class="vz-ctx" id="vozCtx"></span><span class="vz-btns"><button id="vozUndo">↶ Deshacer</button><button id="vozLogBtn" title="Copiar registro de frases">📋</button><button id="vozHelp">?</button></span></div>
    <div class="vz-heard" id="vozHeard"></div>
    <div class="vz-last" id="vozLast"></div>
</div>

<script>

// STORAGE KEYS
// ─────────────────────────────────────────────
const CHECKLIST_KEY      = 'hospitalInventoryState_v12';
const SUMMARY_TICKS_KEY  = 'summaryTicks_v1';
const AREA_TICKS_KEY     = 'summaryAreaTicks_v1';
const INVENTORY_EDIT_KEY = 'inventoryEdits_v1'; // guarda overrides de nombre y stock

// ─────────────────────────────────────────────
// ESTADO GLOBAL
// ─────────────────────────────────────────────
const ID_SEP = '||';
const tabOrder = [
    "Reanimación","UCSI","Quirófano 1","Quirófano 2","Quirófano 3",
    "Quirófano 4","Quirófano 5","Quirófano 6","Hemodinamia",
    "Quirófano 8","Quirófano 7","RESUMEN","✏️ Editor"
];

let checklistState   = {};
let summaryTicks     = {};
let summaryAreaTicks = {};
// inventoryEdits: { "area||location||originalName": { name, stock } }
let inventoryEdits   = {};
// inventoryData: copia viva de DEFAULT_INVENTORY con quirófanos expandidos y edits aplicados
let inventoryData    = {};

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    loadAll();
    buildInventory();
    renderTabs();
    renderAllTabContents();
    switchTab(tabOrder[0]);
    bindFloatingBtns();
    initVoz();
    bindChecklistChanges();
});

function loadAll() {
    const loadJSON = (key, def) => { try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; } };
    checklistState   = loadJSON(CHECKLIST_KEY, {});
    summaryTicks     = loadJSON(SUMMARY_TICKS_KEY, {});
    summaryAreaTicks = loadJSON(AREA_TICKS_KEY, {});
    inventoryEdits   = loadJSON(INVENTORY_EDIT_KEY, {});
    // limpieza preventiva RESUMEN
    for (const k of Object.keys(checklistState)) {
        if (k.startsWith('RESUMEN') || k.startsWith('Area')) delete checklistState[k];
    }
}

// Construye inventoryData = DEFAULT + quirófanos + edits aplicados
function buildInventory() {
    // deep clone default
    inventoryData = JSON.parse(JSON.stringify(DEFAULT_INVENTORY));
    // expandir quirófanos
    ["1","2","3","4","5","6","7","8","Hemodinamia"].forEach(n => {
        const key = n === "Hemodinamia" ? "Hemodinamia" : `Quirófano ${n}`;
        if (!inventoryData[key]) inventoryData[key] = JSON.parse(JSON.stringify(inventoryData.template_quirofano));
    });
    delete inventoryData.template_quirofano;
    // aplicar edits guardados
    for (const editKey in inventoryEdits) {
        const [area, location, origName] = editKey.split(ID_SEP);
        if (!inventoryData[area]?.[location]) continue;
        const item = inventoryData[area][location].find(i => i.name === origName);
        if (!item) continue;
        const edit = inventoryEdits[editKey];
        if (edit.name !== undefined) item.name = edit.name;
        if (edit.stock !== undefined && item.type === 'number') item.stock = edit.stock;
    }
}

// ─────────────────────────────────────────────
// TABS
// ─────────────────────────────────────────────
function renderTabs() {
    const container = document.getElementById('tabs');
    container.innerHTML = tabOrder.map(t => {
        const isEditor = t === '✏️ Editor';
        return `<button class="tab${isEditor ? ' tab-editor' : ''}" data-tab="${t}">${t}</button>`;
    }).join('');
    container.addEventListener('click', e => {
        if (e.target.classList.contains('tab')) switchTab(e.target.dataset.tab);
    });
}

function switchTab(tabName) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    const btn = document.querySelector(`.tab[data-tab="${tabName}"]`);
    const content = document.getElementById(`content-${tabName.replace(/[\s✏️]+/g, '-')}`);
    if (btn) { btn.classList.add('active'); btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); }
    if (content) content.classList.add('active');
    if (tabName === 'RESUMEN') renderSummary();
}

// ─────────────────────────────────────────────
// RENDER ALL CONTENTS
// ─────────────────────────────────────────────
function renderAllTabContents() {
    const main = document.getElementById('tab-contents');
    main.innerHTML = tabOrder.map(tabName => {
        const id = `content-${tabName.replace(/[\s✏️]+/g, '-')}`;
        if (tabName === 'RESUMEN') return `<div class="tab-content" id="${id}"></div>`;
        if (tabName === '✏️ Editor') return `<div class="tab-content" id="${id}">${renderEditorHTML()}</div>`;
        const areaData = inventoryData[tabName];
        return `<div class="tab-content" id="${id}">${
            areaData
                ? Object.entries(areaData).map(([loc, items], idx) => renderLocationGroup(tabName, loc, items, idx)).join('')
                : '<p class="empty-state">Sin datos.</p>'
        }</div>`;
    }).join('');
    // bind editor after inject
    bindEditor();
}

// ─────────────────────────────────────────────
// CHECKLIST RENDER
// ─────────────────────────────────────────────
function getLocationClass(s) {
    const l = s.toLowerCase();
    if (l.includes('farmacia')) return 'farmacia';
    if (l.includes('izquierdo')) return 'almacen-izq';
    if (l.includes('derecho')) return 'almacen-der';
    return 'desconocido';
}

function renderLocationGroup(tabName, locationName, items, locIdx = 0) {
    return `<div class="location-group loc-${locIdx}">
        <div class="sub-header">${locationName}</div>
        <div class="item-list">${items.map(item => renderItem(tabName, locationName, item)).join('')}</div>
    </div>`;
}

function renderItem(tabName, locationName, item) {
    const baseId = [tabName, locationName, item.name].join(ID_SEP);
    let html = '';
    if (item.type === 'checkbox') {
        const opts = item.options?.length ? item.options : [''];
        html = opts.map(opt => {
            const oid = opt ? [baseId, opt].join(ID_SEP) : baseId;
            return `<div class="checkbox-group"><label for="${oid}"><input type="checkbox" id="${oid}" ${checklistState[oid] ? 'checked' : ''}>${opt || 'Falta'}</label></div>`;
        }).join('');
    } else {
        const val = checklistState[baseId] || '0';
        let opts = `<option value="0">Stock OK (${item.stock})</option>`;
        for (let i = 1; i <= item.stock; i++) opts += `<option value="${i}" ${val == i ? 'selected' : ''}>Faltan ${i}</option>`;
        html = `<div class="number-group"><select id="${baseId}">${opts}</select></div>`;
    }
    const gClass = item.g ? `g-${item.g}` : '';
    return `<div class="item ${gClass}"><span class="item-name">${item.name}</span><div class="item-controls">${html}</div></div>`;
}

// ─────────────────────────────────────────────
// CHECKLIST LOGIC
// ─────────────────────────────────────────────
function bindChecklistChanges() {
    document.getElementById('tab-contents').addEventListener('change', e => {
        if (!e.target.matches('input[type="checkbox"], select')) return;
        if (e.target.closest('#content--️-Editor')) return; // ignorar editor
        saveChecklistState();
        if (document.querySelector('.tab.active')?.dataset.tab === 'RESUMEN') renderSummary();
    });
}

function saveChecklistState() {
    const state = {};
    document.querySelectorAll('#tab-contents input[type="checkbox"], #tab-contents select').forEach(input => {
        if (input.closest('#content--️-Editor')) return;
        if (input.type === 'checkbox' && input.checked) {
            if (['sum-check','sum-area-check'].some(c => input.classList.contains(c))) return;
            if (input.id.startsWith('RESUMEN') || input.id.startsWith('Area')) return;
            state[input.id] = true;
        } else if (input.tagName === 'SELECT' && input.value && parseInt(input.value) > 0) {
            state[input.id] = input.value;
        }
    });
    localStorage.setItem(CHECKLIST_KEY, JSON.stringify(state));
    checklistState = state;
}

// ─────────────────────────────────────────────
// SUMMARY
// ─────────────────────────────────────────────
function renderSummary() {
    const el = document.getElementById('content-RESUMEN');
    if (!el) return;

    // build location map
    const locMap = {};
    for (const area in inventoryData) {
        for (const location in inventoryData[area]) {
            for (const item of inventoryData[area][location]) {
                const base = [area, location, item.name].join(ID_SEP);
                if (item.options?.length) item.options.forEach(o => { locMap[[base, o].join(ID_SEP)] = item.storage; });
                else locMap[base] = item.storage;
            }
        }
    }

    let byArea = {}, byStorage = {};
    for (const inputId in checklistState) {
        if (inputId.startsWith('RESUMEN') || inputId.startsWith('Area')) continue;
        const value = checklistState[inputId];
        const [area, , itemName, option] = inputId.split(ID_SEP);
        if (!byArea[area]) byArea[area] = [];
        let display = itemName + (option ? ` (${option})` : '');
        const isNum = !isNaN(parseInt(value));
        if (isNum) display += ` - Faltan: ${value}`;
        byArea[area].push(display);
        const store = locMap[inputId] || 'Desconocido';
        const fullName = option ? `${itemName} (${option})` : itemName;
        if (!byStorage[store]) byStorage[store] = {};
        if (isNum) { byStorage[store][itemName] = (byStorage[store][itemName] || 0) + parseInt(value); }
        else       { byStorage[store][fullName] = (byStorage[store][fullName] || 0) + 1; }
    }

    const hasItems = Object.keys(checklistState).length > 0;

    el.innerHTML = `
        <div class="summary-actions">
            <button id="clear-all-data">Limpiar Todo el Checklist</button>
            <button id="btn-pdf" style="background:#0ea5e9">🖨️ Exportar PDF</button>
            <button id="btn-hoja" style="background:#475569" title="Hoja en blanco para rellenar a mano">📋 Hoja manual PDF</button>
        </div>
        <div class="summary-section">
            <div class="sub-header desconocido">RESUMEN por Área</div>
            ${!hasItems ? '<p class="empty-state">No hay nada que reponer.</p>' : ''}
            ${Object.entries(byArea).map(([area, items]) => !items.length ? '' : `
                <div class="location-group" style="margin:.45rem;border-radius:8px">
                    <h3 class="sub-header desconocido">${area}</h3>
                    <ul>${items.sort().map(item => {
                        const aid = ['Area', area, item].join(ID_SEP);
                        const chk = !!summaryAreaTicks[aid];
                        return `<li class="area-item ${chk?'done':''}"><label for="${aid}"><input type="checkbox" class="sum-area-check" id="${aid}" ${chk?'checked':''}><span>${item}</span></label></li>`;
                    }).join('')}</ul>
                </div>`).join('')}
        </div>
        <div class="summary-section">
            <div class="sub-header desconocido">Lista de Reposición Total</div>
            ${!hasItems ? '<p class="empty-state">No hay nada que reponer.</p>' : ''}
            ${Object.keys(byStorage).sort().map(loc => `
                <div class="location-group" style="margin:.45rem;border-radius:8px">
                    <h3 class="sub-header ${getLocationClass(loc)}">${loc}</h3>
                    <ul>${Object.entries(byStorage[loc]).sort((a,b)=>a[0].localeCompare(b[0])).map(([name, qty]) => {
                        const sid = ['RESUMEN', loc, name].join(ID_SEP);
                        const chk = !!summaryTicks[sid];
                        return `<li class="total-item ${chk?'done':''}"><label for="${sid}"><input type="checkbox" class="sum-check" id="${sid}" ${chk?'checked':''}><span>${name}</span></label><span class="quantity">×${qty}</span></li>`;
                    }).join('')}</ul>
                </div>`).join('')}
        </div>`;

    const clearBtn = document.getElementById('clear-all-data');
    clearBtn.addEventListener('click', () => {
        if (clearBtn.dataset.confirm === '1') {
            [CHECKLIST_KEY, SUMMARY_TICKS_KEY, AREA_TICKS_KEY].forEach(k => localStorage.removeItem(k));
            checklistState = {}; summaryTicks = {}; summaryAreaTicks = {};
            document.querySelectorAll('#tab-contents input[type="checkbox"]').forEach(cb => cb.checked = false);
            document.querySelectorAll('#tab-contents select').forEach(s => s.value = '0');
            renderSummary();
        } else {
            clearBtn.dataset.confirm = '1';
            clearBtn.textContent = '⚠️ Pulsa de nuevo para confirmar';
            clearBtn.style.background = '#b91c1c';
            setTimeout(() => {
                if (clearBtn && clearBtn.isConnected) {
                    clearBtn.dataset.confirm = '0';
                    clearBtn.textContent = 'Limpiar Todo el Checklist';
                    clearBtn.style.background = '';
                }
            }, 3000);
        }
    });
    document.getElementById('btn-pdf').addEventListener('click', () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        let y = 15;

        doc.setFontSize(14);
        doc.setFont('helvetica', 'bold');
        doc.text('LISTA DE REPOSICION - BLOQUE QUIRURGICO CIMA', 14, y);
        y += 8;
        doc.setFontSize(9);
        doc.setFont('helvetica', 'normal');
        doc.text(new Date().toLocaleDateString('es-ES'), 14, y);
        y += 10;

        Object.entries(byArea).forEach(([area, items]) => {
            if (!items.length) return;
            if (y > 270) { doc.addPage(); y = 15; }

            doc.setFontSize(11);
            doc.setFont('helvetica', 'bold');
            doc.setFillColor(220, 230, 255);
            doc.rect(14, y - 5, 182, 8, 'F');
            doc.text(area.toUpperCase(), 16, y);
            y += 8;

            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            items.sort().forEach(name => {
                if (y > 275) { doc.addPage(); y = 15; }
                doc.text(`- ${name.toUpperCase()}`, 18, y);
                y += 7;
            });
            y += 4;
        });

        doc.save('reposicion-cima.pdf');
    });
    document.getElementById('btn-hoja').addEventListener('click', () => {
        buildManualSheetPDF().save('hoja-revision-quirofanos.pdf');
    });
    el.addEventListener('change', e => {
        const cb = e.target.closest('.sum-check');
        if (cb) {
            cb.checked ? summaryTicks[cb.id] = true : delete summaryTicks[cb.id];
            localStorage.setItem(SUMMARY_TICKS_KEY, JSON.stringify(summaryTicks));
            cb.closest('.total-item')?.classList.toggle('done', cb.checked);
        }
        const acb = e.target.closest('.sum-area-check');
        if (acb) {
            acb.checked ? summaryAreaTicks[acb.id] = true : delete summaryAreaTicks[acb.id];
            localStorage.setItem(AREA_TICKS_KEY, JSON.stringify(summaryAreaTicks));
            acb.closest('.area-item')?.classList.toggle('done', acb.checked);
        }
    });
}

// ─────────────────────────────────────────────
// HOJA MANUAL (PDF en blanco para rellenar a mano)
// Filas = material de quirófano en el orden de la app; columnas = quirófanos (orden de pestañas)
// ─────────────────────────────────────────────
const STORAGE_ABBR = {
    'FARMACIA':                  ['F',   [220, 38, 38]],
    'ALMACÉN PASILLO DERECHO':   ['AD',  [37, 99, 235]],
    'ALMACÉN PASILLO IZQUIERDO': ['AI',  [5, 150, 105]],
    'ALMACÉN LIMPIEZA':          ['LIM', [71, 85, 105]],
    'BLOQUE QUIRÚRGICO':         ['BQ',  [71, 85, 105]],
    'ARMARIO LENCERIA':          ['LEN', [71, 85, 105]]
};
// mismos tonos que las filas impares de cada carro en la app
const SECTION_TINT = [
    { band: [167, 243, 208], row: [236, 253, 245] }, // Carro Enfermeria
    { band: [253, 230, 138], row: [254, 249, 195] }, // Carro Anestesia
    { band: [221, 214, 254], row: [237, 233, 254] }, // Otros
    { band: [254, 202, 202], row: [254, 242, 242] }, // REA/UCSI · Farmacia
    { band: [191, 219, 254], row: [239, 246, 255] }  // REA/UCSI · Almacén
];

// Prueba alturas de fila de mayor a menor y se queda con la más grande que cabe en 2 páginas
function buildManualSheetPDF() {
    let doc;
    for (let rh = 4.2; rh >= 3.3; rh = +(rh - 0.05).toFixed(2)) {
        doc = renderManualSheet(rh);
        if (doc.getNumberOfPages() <= 2) return doc;
    }
    return doc;
}

function renderManualSheet(RH) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const PW = 297, PH = 210, M = 7, GAP = 4;
    const UB_W = 5, STK_W = 5, TOT_W = 7, LIST_MIN = 46;
    const SH = 4.2, HEAD_H = 5, TOP = M + 12, BOTTOM = PH - M - 2;
    const NAME_PT = 6.4, OPT_PT = 5.8;
    const title = 'HOJA DE REVISIÓN · QUIRÓFANOS · REA · UCSI';

    // quirófanos = áreas con la plantilla de quirófano, en el orden de las pestañas
    const quis = tabOrder.filter(t => inventoryData[t]?.['Carro Enfermeria']);
    const qLabel = t => t.startsWith('Quirófano') ? 'Q' + t.split(' ')[1] : t === 'Hemodinamia' ? 'HEM' : t.slice(0, 4).toUpperCase();
    const lists = ['Reanimación', 'UCSI'].filter(a => inventoryData[a]);

    // filas de quirófano: una por artículo, o una por opción (Bisturi → nº10, nº11…)
    const rows = [];
    Object.keys(inventoryData[quis[0]]).forEach((loc, si) => {
        rows.push({ kind: 'sec', label: loc, si });
        inventoryData[quis[0]][loc].forEach((item, ii) => {
            const stocks = quis.map(q => inventoryData[q][loc]?.[ii]?.stock);
            const base = {
                kind: 'item', si, label: loc, g: item.g || 0, name: item.name, storage: item.storage,
                isNum: item.type === 'number', stocks, uniform: stocks.every(s => s === stocks[0])
            };
            const opts = item.options?.length ? item.options : [null];
            opts.forEach((opt, oi) => rows.push({ ...base, opt, first: oi === 0, last: oi === opts.length - 1, n: opts.length }));
        });
    });

    const textW = (t, pt, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(pt); return doc.getTextWidth(t); };
    const fit = (txt, maxW, size, min = 4.5) => {
        let s = size;
        doc.setFontSize(s);
        while (doc.getTextWidth(txt) > maxW && s > min) { s -= 0.25; doc.setFontSize(s); }
        while (doc.getTextWidth(txt) > maxW && txt.length > 3) txt = txt.slice(0, -2) + '…';
        return txt;
    };

    // ── anchos: MATERIAL justo para el nombre más largo; lo que sobra, a la lista REA/UCSI de la derecha ──
    const optsW = {};
    rows.forEach(r => { if (r.kind === 'item' && r.opt) optsW[r.name] = Math.max(optsW[r.name] || 0, textW(r.opt, OPT_PT, true)); });
    const NAME_W = Math.min(56, Math.max(30, 2.6 + Math.max(...rows.filter(r => r.kind === 'item' && r.first)
        .map(r => textW(r.name, NAME_PT) + (optsW[r.name] ? optsW[r.name] + 1.5 : 0)))));
    const FIXED_W = NAME_W + UB_W + STK_W + TOT_W;
    const Q_W = Math.max(5.8, Math.min(8, (PW - 2 * M - 2 * GAP - (lists.length ? LIST_MIN : 0) - 2 * FIXED_W) / (2 * quis.length)));
    const COL_W = FIXED_W + quis.length * Q_W;
    const LIST_X = M + 2 * (COL_W + GAP), LIST_W = PW - M - LIST_X;
    const qx = (x0, i) => x0 + NAME_W + UB_W + STK_W + i * Q_W;
    const shadeQ = i => i % 2 === 1;

    function drawPageHeader() {
        doc.setTextColor(45, 49, 66);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
        doc.text(title, M, M + 4);
        const tw = doc.getTextWidth(title);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(107, 120, 153);
        doc.text('Reposición Bloque Quirúrgico CIMA · versión manual', M + tw + 3, M + 4);
        doc.setFontSize(8); doc.setTextColor(45, 49, 66);
        doc.text('Fecha: ____________    Turno: ________    Revisa: ______________________', PW - M, M + 4, { align: 'right' });
        // leyenda
        doc.setFontSize(6.3); doc.setTextColor(71, 85, 105);
        let lx = M; const ly = M + 9;
        const put = (t, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.text(t, lx, ly); lx += doc.getTextWidth(t); };
        put('Casilla vacía: ', true); put('anotar cuántas FALTAN  ·  ');
        doc.setDrawColor(100, 116, 139); doc.setLineWidth(0.2); doc.rect(lx, ly - 1.9, 1.9, 1.9); lx += 2.6;
        put(' marcar si falta  ·  '); put('Opciones REA/UCSI: ', true); put('rodear la que falta  ·  ');
        put('STK', true); put(' stock máx.  ·  '); put('TOTAL', true); put(' suma a reponer  ·  '); put('UB: ', true);
        const UB_TXT = { F: 'farmacia', AD: 'pasillo dcho', AI: 'pasillo izq', LIM: 'limpieza', BQ: 'bloque', LEN: 'lencería' };
        Object.values(STORAGE_ABBR).forEach(([ab, c], i, arr) => {
            doc.setTextColor(...c); put(ab, true); doc.setTextColor(71, 85, 105);
            put(' ' + (UB_TXT[ab] || '') + (i < arr.length - 1 ? ' · ' : ''));
        });
    }

    function drawColHeader(x0, y0) {
        doc.setFillColor(226, 232, 240); doc.rect(x0, y0, COL_W, HEAD_H, 'F');
        quis.forEach((q, i) => { if (shadeQ(i)) { doc.setFillColor(203, 213, 225); doc.rect(qx(x0, i), y0, Q_W, HEAD_H, 'F'); } });
        doc.setFillColor(254, 215, 170); doc.rect(x0 + COL_W - TOT_W, y0, TOT_W, HEAD_H, 'F');
        doc.setFont('helvetica', 'bold'); doc.setTextColor(45, 49, 66); doc.setFontSize(6.5);
        const ty = y0 + 3.4;
        doc.text('MATERIAL', x0 + 1.2, ty);
        doc.setFontSize(5.3);
        doc.text('UB', x0 + NAME_W + UB_W / 2, ty, { align: 'center' });
        doc.text('STK', x0 + NAME_W + UB_W + STK_W / 2, ty, { align: 'center' });
        quis.forEach((q, i) => doc.text(fit(qLabel(q), Q_W - 0.5, 6.3), qx(x0, i) + Q_W / 2, ty, { align: 'center' }));
        doc.text(fit('TOTAL', TOT_W - 0.4, 5.3), x0 + COL_W - TOT_W / 2, ty, { align: 'center' });
    }

    function drawSection(x0, y0, w, label, si, cont) {
        doc.setFillColor(...SECTION_TINT[si % SECTION_TINT.length].band); doc.rect(x0, y0, w, SH, 'F');
        doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.setTextColor(45, 49, 66);
        doc.text(fit(label.toUpperCase() + (cont ? '  (cont.)' : ''), w - 2, 7), x0 + 1.2, y0 + 3.05);
    }

    // línea superior de una fila (se pinta tras los fondos para que no la tapen)
    function topLine(x0, y0, w, prev, g, fromX) {
        if (prev?.kind === 'item') {
            if (prev.g !== g) { doc.setDrawColor(51, 65, 85); doc.setLineWidth(0.5); }
            else              { doc.setDrawColor(120, 132, 152); doc.setLineWidth(0.25); }
            doc.line(fromX, y0, x0 + w, y0);
        } else { // justo bajo una banda de sección
            doc.setDrawColor(100, 116, 139); doc.setLineWidth(0.3); doc.line(x0, y0, x0 + w, y0);
        }
    }

    function drawUB(storage, cx, ty) {
        const [ab, c] = STORAGE_ABBR[storage] || [String(storage || '?').slice(0, 3), [71, 85, 105]];
        doc.setFont('helvetica', 'bold'); doc.setTextColor(...c);
        doc.text(fit(ab, UB_W - 0.5, 5.2), cx, ty, { align: 'center' });
        doc.setTextColor(45, 49, 66);
    }
    const box = (cx, y0) => { doc.setDrawColor(148, 163, 184); doc.setLineWidth(0.2); doc.rect(cx - 0.95, y0 + RH / 2 - 0.95, 1.9, 1.9); };

    function drawItem(x0, y0, r, prev) {
        const t = SECTION_TINT[r.si % SECTION_TINT.length];
        if (r.g % 2 === 1) { doc.setFillColor(...t.row); doc.rect(x0, y0, NAME_W + UB_W + STK_W, RH, 'F'); }
        quis.forEach((q, i) => { if (shadeQ(i)) { doc.setFillColor(238, 242, 247); doc.rect(qx(x0, i), y0, Q_W, RH, 'F'); } });
        doc.setFillColor(255, 247, 237); doc.rect(x0 + COL_W - TOT_W, y0, TOT_W, RH, 'F');
        const ty = y0 + RH - 1.05;
        doc.setTextColor(45, 49, 66);
        let optW = 0;
        if (r.opt) {
            doc.setFont('helvetica', 'bold');
            const o = fit(r.opt, 22, OPT_PT);
            optW = doc.getTextWidth(o) + 1.5;
            doc.text(o, x0 + NAME_W - 1, ty, { align: 'right' });
        }
        doc.setFont('helvetica', 'normal');
        if (r.first) {
            doc.text(fit(r.name, NAME_W - 2 - optW, NAME_PT), x0 + 1.2, ty);
            drawUB(r.storage, x0 + NAME_W + UB_W / 2, ty);
            if (r.isNum) { doc.setFontSize(5.8); doc.text(r.uniform ? String(r.stocks[0]) : 'var', x0 + NAME_W + UB_W + STK_W / 2, ty, { align: 'center' }); }
        }
        quis.forEach((q, i) => {
            const cx = qx(x0, i);
            if (!r.isNum) box(cx + Q_W / 2, y0);
            else if (!r.uniform && r.stocks[i] != null) {
                doc.setFont('helvetica', 'normal'); doc.setFontSize(3.8); doc.setTextColor(148, 163, 184);
                doc.text(String(r.stocks[i]), cx + Q_W - 0.4, y0 + 1.5, { align: 'right' });
            }
        });
        doc.setDrawColor(203, 213, 225); doc.setLineWidth(0.1);
        [NAME_W, NAME_W + UB_W, NAME_W + UB_W + STK_W].forEach(d => doc.line(x0 + d, y0, x0 + d, y0 + RH));
        quis.forEach((q, i) => doc.line(qx(x0, i) + Q_W, y0, qx(x0, i) + Q_W, y0 + RH));
        // sin cortar el nombre dentro de un artículo con opciones
        topLine(x0, y0, COL_W, prev, r.g, prev?.last ? x0 : x0 + NAME_W);
    }

    const ensurePage = p => { while (doc.getNumberOfPages() < p) { doc.addPage(); drawPageHeader(); } doc.setPage(p); };
    const frame = (x0, top, w, bottom) => { if (bottom > top) { doc.setDrawColor(71, 85, 105); doc.setLineWidth(0.4); doc.rect(x0, top, w, bottom - top); } };

    // ── tablas de quirófano: 2 columnas por página ──
    drawPageHeader();
    let colIdx = -1, x = 0, y = 0, colTop = 0;
    const startCol = () => {
        if (colIdx >= 0) frame(x, colTop, COL_W, y);
        colIdx++;
        ensurePage(Math.floor(colIdx / 2) + 1);
        x = M + (colIdx % 2) * (COL_W + GAP); y = TOP; colTop = y;
        drawColHeader(x, y); y += HEAD_H;
    };
    startCol();
    rows.forEach((r, i) => {
        if (r.kind === 'sec') {
            if (y + SH + RH * 3 > BOTTOM) startCol();
            drawSection(x, y, COL_W, r.label, r.si, false); y += SH;
            return;
        }
        // un artículo con opciones no se parte entre columnas
        let prev = rows[i - 1];
        if (y + (r.first ? RH * r.n : RH) > BOTTOM) { startCol(); drawSection(x, y, COL_W, r.label, r.si, true); y += SH; prev = null; }
        drawItem(x, y, r, prev); y += RH;
    });
    frame(x, colTop, COL_W, y);

    // ── lista REA / UCSI a la derecha (una por página): un material por fila;
    //    casilla = marcar/anotar, opciones en línea = rodear la que falta ──
    const MARK_W = 7.5, LNAME_W = LIST_W - UB_W - MARK_W;
    const cleanName = n => n.replace(/\s*\((R|U|REA|UCSI)\)\s*/gi, ' ').trim();
    let page = 0, ly = 0, lTop = 0;
    const startList = (area, cont) => {
        if (page) frame(LIST_X, lTop, LIST_W, ly);
        page++;
        ensurePage(page);
        ly = TOP; lTop = ly;
        doc.setFillColor(226, 232, 240); doc.rect(LIST_X, ly, LIST_W, HEAD_H, 'F');
        doc.setFont('helvetica', 'bold'); doc.setTextColor(45, 49, 66);
        doc.text(fit(area.toUpperCase() + (cont ? ' (cont.)' : ''), LNAME_W - 2, 6.5), LIST_X + 1.2, ly + 3.4);
        doc.setFontSize(5.3);
        doc.text('UB', LIST_X + LNAME_W + UB_W / 2, ly + 3.4, { align: 'center' });
        doc.text(fit('FALTA', MARK_W - 0.4, 5.3), LIST_X + LNAME_W + UB_W + MARK_W / 2, ly + 3.4, { align: 'center' });
        ly += HEAD_H;
    };
    lists.forEach(area => {
        startList(area, false);
        Object.entries(inventoryData[area]).forEach(([loc, items]) => {
            const si = loc === 'FARMACIA' ? 3 : 4;
            if (ly + SH + RH * 2 > BOTTOM) startList(area, true);
            drawSection(LIST_X, ly, LIST_W, loc, si, false); ly += SH;
            let prev = null;
            items.forEach(item => {
                if (ly + RH > BOTTOM) { startList(area, true); drawSection(LIST_X, ly, LIST_W, loc, si, true); ly += SH; prev = null; }
                const ty = ly + RH - 1.05;
                doc.setFillColor(238, 242, 247); doc.rect(LIST_X + LNAME_W + UB_W, ly, MARK_W, RH, 'F');
                // opciones a la derecha del nombre, para rodear
                let optsW = 0;
                if (item.options?.length) {
                    const o = item.options.join('  ');
                    const ow = Math.min(textW(o, OPT_PT, true), LNAME_W * 0.6);
                    doc.setTextColor(45, 49, 66);
                    doc.text(fit(o, ow, OPT_PT), LIST_X + LNAME_W - 1, ty, { align: 'right' });
                    optsW = ow + 1.5;
                }
                doc.setFont('helvetica', 'normal'); doc.setTextColor(45, 49, 66);
                doc.text(fit(cleanName(item.name), LNAME_W - 2 - optsW, NAME_PT), LIST_X + 1.2, ty);
                drawUB(item.storage, LIST_X + LNAME_W + UB_W / 2, ty);
                const mx = LIST_X + LNAME_W + UB_W;
                if (item.options?.length) { /* se rodea la opción */ }
                else if (item.type === 'number') {
                    doc.setFont('helvetica', 'normal'); doc.setFontSize(4.6); doc.setTextColor(120, 132, 152);
                    doc.text('/' + item.stock, mx + MARK_W - 0.4, ly + 1.8, { align: 'right' });
                } else box(mx + MARK_W / 2, ly);
                doc.setDrawColor(203, 213, 225); doc.setLineWidth(0.1);
                [LNAME_W, LNAME_W + UB_W].forEach(d => doc.line(LIST_X + d, ly, LIST_X + d, ly + RH));
                topLine(LIST_X, ly, LIST_W, prev, 0, LIST_X);
                prev = { kind: 'item', g: 0 };
                ly += RH;
            });
        });
    });
    if (page) frame(LIST_X, lTop, LIST_W, ly);

    const pages = doc.getNumberOfPages();
    for (let p = 1; p <= pages; p++) {
        doc.setPage(p);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(6); doc.setTextColor(148, 163, 184);
        doc.text(`${p}/${pages}`, PW - M, PH - 3, { align: 'right' });
        doc.text('Reposición BQ · CIMA', M, PH - 3);
    }
    return doc;
}

function bindEditor() {
    const input = document.getElementById('editorSearch');
    if (!input) return;
    input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        const resultsEl = document.getElementById('editor-results');
        if (q.length < 2) {
            resultsEl.innerHTML = '<p class="editor-hint">Escribe al menos 2 caracteres para buscar.</p>';
            return;
        }
        // Collect matches: iterate inventoryData but match against original names too
        const matches = [];
        for (const area in inventoryData) {
            for (const location in inventoryData[area]) {
                for (const item of inventoryData[area][location]) {
                    if (item.name.toLowerCase().includes(q)) {
                        // find original name from DEFAULT (antes de edits)
                        const editKey = findEditKey(area, location, item.name);
                        matches.push({ area, location, item, editKey });
                    }
                }
            }
        }
        if (!matches.length) {
            resultsEl.innerHTML = '<p class="editor-no-results">No se encontraron productos con ese nombre.</p>';
            return;
        }
        resultsEl.innerHTML = matches.slice(0, 20).map(({ area, location, item, editKey }, idx) => {
            const isNum = item.type === 'number';
            const badge = isNum
                ? `<span class="editor-type-badge badge-number">stock</span>`
                : `<span class="editor-type-badge badge-check">check</span>`;
            return `
            <div class="editor-result-item" data-idx="${idx}" data-edit-key="${editKey}" data-original-name="${item.name}" data-type="${item.type}">
                <div class="editor-result-meta">
                    <span>${area}</span><span>${location}</span>${badge}
                </div>
                <div class="editor-fields">
                    <div class="editor-field">
                        <label>Nombre del producto</label>
                        <input type="text" class="ef-name" value="${item.name}" placeholder="Nombre">
                    </div>
                    ${isNum ? `<div class="editor-field">
                        <label>Stock máximo</label>
                        <input type="number" class="ef-stock" value="${item.stock}" min="1" max="999" placeholder="Stock">
                    </div>` : ''}
                    <button class="editor-save-btn">Guardar</button>
                </div>
            </div>`;
        }).join('');

        // bind save buttons
        resultsEl.querySelectorAll('.editor-save-btn').forEach(btn => {
            btn.addEventListener('click', () => handleEditorSave(btn));
        });
    });
}

// Encuentra el editKey correcto buscando en DEFAULT_INVENTORY el item con nombre actual
function findEditKey(area, location, currentName) {
    // primero busca en edits guardados si ya está mapeado
    for (const k in inventoryEdits) {
        const [a, l] = k.split(ID_SEP);
        if (a === area && l === location && inventoryEdits[k].name === currentName) return k;
    }
    // si no, busca en DEFAULT por nombre original
    const defArea = area === 'Hemodinamia' ? 'template_quirofano'
        : area.startsWith('Quirófano') ? 'template_quirofano'
        : area;
    const defItems = DEFAULT_INVENTORY[defArea]?.[location] || DEFAULT_INVENTORY[area]?.[location];
    if (defItems) {
        const found = defItems.find(i => i.name === currentName);
        if (found) return [area, location, found.name].join(ID_SEP);
    }
    return [area, location, currentName].join(ID_SEP);
}

function handleEditorSave(btn) {
    const card = btn.closest('.editor-result-item');
    const editKey  = card.dataset.editKey;
    const origName = card.dataset.originalName;
    const type     = card.dataset.type;

    const newName  = card.querySelector('.ef-name')?.value.trim().toUpperCase();
    const newStock = card.querySelector('.ef-stock') ? parseInt(card.querySelector('.ef-stock').value) : null;

    if (!newName) return;

    // Actualiza edits en memoria
    if (!inventoryEdits[editKey]) inventoryEdits[editKey] = {};
    inventoryEdits[editKey].name = newName;
    if (type === 'number' && newStock > 0) {
        inventoryEdits[editKey].stock = newStock;

        // Resetear a 0 el estado del checklist para este item en TODOS los quirófanos
        // El editKey es area||location||origName → necesitamos limpiar checklistState
        const [area, location] = editKey.split(ID_SEP);
        const keysToDelete = Object.keys(checklistState).filter(k => {
            const parts = k.split(ID_SEP);
            // el nombre puede haber cambiado, buscar por area y location
            return parts[0] === area && parts[1] === location && parts[2] === origName;
        });
        keysToDelete.forEach(k => delete checklistState[k]);
        localStorage.setItem(CHECKLIST_KEY, JSON.stringify(checklistState));
    }

    // Guardar edits
    localStorage.setItem(INVENTORY_EDIT_KEY, JSON.stringify(inventoryEdits));

    // Reconstruir inventario y rerenderizar pestañas de checklist
    buildInventory();
    reRenderChecklistTabs();

    // feedback visual
    btn.textContent = '✔ Guardado';
    btn.classList.add('saved');
    // actualiza el campo origName del card para futuras ediciones en la misma sesión
    card.dataset.originalName = newName;
    card.dataset.editKey = [editKey.split(ID_SEP)[0], editKey.split(ID_SEP)[1], newName].join(ID_SEP);
    setTimeout(() => { btn.textContent = 'Guardar'; btn.classList.remove('saved'); }, 1500);
}

// Rerenderiza solo las pestañas del checklist (no Editor ni RESUMEN)
function reRenderChecklistTabs() {
    const main = document.getElementById('tab-contents');
    tabOrder.forEach(tabName => {
        if (tabName === 'RESUMEN' || tabName === '✏️ Editor') return;
        const id = `content-${tabName.replace(/[\s✏️]+/g, '-')}`;
        const el = document.getElementById(id);
        if (!el) return;
        const wasActive = el.classList.contains('active');

            ? Object.entries(areaData).map(([loc, items], idx) => renderLocationGroup(tabName, loc, items, idx)).join('')
            : '<p class="empty-state">Sin datos.</p>';
    });
}

// palabras de carro/zona que se pueden decir dentro de la frase: «empapadores enfermería»
const VOZ_CARRO = { enfermeria: 'Carro Enfermeria', anestesia: 'Carro Anestesia', otros: 'Otros', farmacia: 'FARMACIA', almacen: 'ALMACÉN' };

const vozNorm = t => String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/(\d),(\d)/g, '$1.$2').replace(/nº|#/g, ' ')
    .replace(/(\d)([a-z])/g, '$1 $2').replace(/([a-z])(\d)/g, '$1 $2')
    .replace(/[^a-z0-9.\s]/g, ' ').replace(/\.(?!\d)|(^|[^\d])\./g, '$1 ').replace(/\s+/g, ' ').trim();
const vozStem = w => w.length > 4 ? w.replace(/(es|s)$/, '') : w;
function vozLev(a, b) {
    if (Math.abs(a.length - b.length) > 2) return 9;
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
}
const vozWordEq = (u, n) => {
    if (u === n) return true;
    const a = vozStem(u), b = vozStem(n);
    if (a === b) return true;
    if (b.length >= 4 && a.length >= 4 && (a.startsWith(b) || b.startsWith(a))) return true;
    if (b.length === 3 && a.length > 3 && a.startsWith(b)) return true;
    return b.length >= 5 && vozLev(a, b) <= (b.length >= 8 ? 2 : 1);
};
// separa palabras y números (convierte números dichos en palabras)
function vozTokens(t) {
    let n = vozNorm(t);
    VOZ_SYN.forEach(([re, rep]) => { n = n.replace(re, rep); });
    const words = [], nums = [];
    n.split(' ').forEach(w => {
        if (!w) return;
        if (/^0\d+$/.test(w)) nums.push(parseFloat('0.' + w.slice(1)));
        else if (/^\d+(\.\d+)?$/.test(w)) nums.push(parseFloat(w));
        else if (/^\.5$/.test(w) && nums.length) nums[nums.length - 1] += 0.5;
        else if (VOZ_NUM[w] !== undefined) nums.push(VOZ_NUM[w]);
        else if (!VOZ_STOP.has(w)) words.push(w);
    });
    return { words, nums };
}

    document.getElementById('vozHelp').addEventListener('click', () => vozSay(
        'Di el material como está escrito y la cantidad. Por ejemplo: paracetamol 3, o jeringas 10 y 5. ' +
        'Puedes añadir el carro en la frase, por ejemplo: empapadores enfermería. ' +
        'Di anestesia o enfermería para elegir carro, quirófano 3 para cambiar, quita y el material para desmarcar, deshacer, o para.'));
}

function vozStart(SR) {
    const rec = new SR();
    rec.lang = 'es-ES'; rec.continuous = true; rec.interimResults = false; rec.maxAlternatives = 3;
    voz = { on: true, rec, carro: null, undo: [], pending: null, speaking: false };
    rec.onresult = e => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
            if (!e.results[i].isFinal) continue;
            const alts = Array.from(e.results[i]).map(a => a.transcript);
            vozHandle(alts);
        }
    };
    rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { vozShow('', 'Sin permiso para el micrófono', true); vozStop(); } };
    // el reconocimiento se corta tras silencios: se reengancha solo mientras el modo esté activo
    rec.onend = () => { if (voz?.on && !voz.speaking) try { rec.start(); } catch {} };
    try { rec.start(); } catch {}
    document.getElementById('btnVoz').classList.add('on');
    document.getElementById('vozBar').classList.add('on');
    vozShow('', 'Escuchando…');
    vozSay('Escuchando ' + vozTabName());
}

function vozStop() {
    if (!voz) return;
    voz.on = false;
    try { voz.rec.abort(); } catch {}
    window.speechSynthesis?.cancel();
    saveChecklistState();
    document.getElementById('btnVoz').classList.remove('on');
    document.getElementById('vozBar').classList.remove('on');
}

// habla y deja de escuchar mientras tanto (para no oírse a sí mismo)
function vozSay(txt) {
    if (!window.speechSynthesis || !voz?.on) return;
    voz.speaking = true;
    try { voz.rec.abort(); } catch {}
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'es-ES'; u.rate = 1.1;
    const back = () => { if (!voz?.on) return; voz.speaking = false; try { voz.rec.start(); } catch {} };
    u.onend = back; u.onerror = back;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
}

const vozTab = () => document.querySelector('.tab.active')?.dataset.tab;
const vozTabName = () => { const t = vozTab(); return !t || t === 'RESUMEN' || t.includes('Editor') ? '' : t; };

function vozShow(heard, msg, err) {
    if (heard) try {
        const log = JSON.parse(localStorage.getItem(VOZ_LOG_KEY) || '[]');
        log.push(`${new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })} [${vozTabName()}] «${voz?.lastAlts || heard}» → ${msg || ''}`);
        localStorage.setItem(VOZ_LOG_KEY, JSON.stringify(log.slice(-60)));
    } catch {}
    const locs = inventoryData[vozTab()] ? Object.keys(inventoryData[vozTab()]) : [];
    document.getElementById('vozCtx').textContent = '🎤 ' + (vozTabName() || 'abre un quirófano') + (voz?.carro && locs.includes(voz.carro) ? ' · ' + voz.carro : '');
    if (heard !== null) document.getElementById('vozHeard').textContent = heard ? '«' + heard + '»' : '';
    const last = document.getElementById('vozLast');
    last.textContent = msg || ''; last.classList.toggle('err', !!err);
}

function vozHandle(alts) {
    const heard = alts[0].trim();
    voz.lastAlts = alts.map(a => a.trim()).join(' | ');
    const n = vozNorm(heard);
    // ── órdenes ──
    if (/^(para|parar|stop|fin|terminar|apagar)$/.test(n)) { vozSay('Apagado'); setTimeout(vozStop, 900); return vozShow(heard, 'Apagado'); }
    if (/^(deshacer|deshaz|atras|borra eso|anula)$/.test(n)) return vozUndo(heard);
    const tabHit = vozTabCommand(n);
    if (tabHit) {
        switchTab(tabHit); voz.carro = null; voz.pending = null;
        vozShow(heard, 'Pestaña ' + tabHit); return vozSay(vozSpeak(tabHit));
    }
    const area = vozTab();
    const locs = inventoryData[area] ? Object.keys(inventoryData[area]) : [];
    if (!locs.length) { vozShow(heard, 'Abre primero un quirófano, REA o UCSI', true); return vozSay('Abre primero un quirófano'); }
    const carroAns = vozCarroOf(n, locs);
    const remove = /^(quita|quitar|borra|borrar|desmarca|desmarcar|no)\b/.test(n);
    const strip = a => remove ? vozNorm(a).replace(/^(quita|quitar|borra|borrar|desmarca|desmarcar|no)\s*/, '') : a;

    // ── respuesta a la pregunta anterior: se junta con lo dicho antes («gasas grandes» + «con contraste») ──
    if (voz.pending) {
        const p = voz.pending; voz.pending = null;
        if (carroAns) voz.carro = carroAns;
        const r = vozMatch(area, p.text + ' ' + heard).filter(c => p.keys.has(c.loc + ID_SEP + c.item.name));
        let pool = r.length ? r.filter(c => c.score === r[0].score) : [];
        if (carroAns) pool = pool.filter(c => c.loc === carroAns);
        if (p.needOpt) pool = pool.filter(c => c.opts.length);
        if (pool.length && pool.length < p.n) return vozResolve(pool, heard, p.text + ' ' + heard, p.remove);
        // no aclara nada → se trata como frase nueva
    }
    if (carroAns) {
        // cambio de carro preferente: «anestesia», «de enfermería», «carro otros»
        voz.carro = carroAns;
        vozShow(heard, '→ ' + carroAns); return vozSay(vozSpeak(carroAns));
    }
    // prueba las alternativas que da el reconocedor y se queda con la que mejor encaja
    let best = null, bestTxt = heard;
    alts.forEach((a, ai) => {
        const r = vozMatch(area, strip(a));
        if (r.length && (!best || r[0].score - ai * 2 > best[0].score)) { best = r; bestTxt = strip(a); }
    });
    if (!best) { vozShow(heard, 'No lo encuentro en ' + area, true); return vozSay('No lo encuentro'); }
    vozResolve(best, heard, bestTxt, remove);
}

// frase que es SOLO un carro/zona (admite «de», «el», «la», «carro»)
function vozCarroOf(n, locs) {
    const w = n.split(' ').filter(x => x && !['carro', 'de', 'del', 'el', 'la', 'en', 'para', 'es'].includes(x));
    if (w.length !== 1) return null;
    return locs.find(l => vozTokens(l).words.filter(x => x !== 'carro').some(x => vozWordEq(w[0], x))) || null;
}

// aplica si está claro; si no, pregunta (materiales distintos o mismo material en dos carros)
function vozResolve(best, heard, text, remove) {
    let top = best.filter(c => c.score === best[0].score);
    const inCarro = top.filter(c => c.loc === voz.carro);
    if (inCarro.length) top = inCarro;
    const names = [...new Map(top.map(c => [vozKey(c.item.name), c.item.name])).values()];
    const locsT = [...new Set(top.map(c => c.loc))];
    if (names.length > 1 || locsT.length > 1) {
        voz.pending = { text, remove, keys: new Set(top.map(c => c.loc + ID_SEP + c.item.name)), n: top.length };
        if (names.length > 1) {
            const list = names.slice(0, 4);
            vozShow(heard, '¿Cuál? ' + list.map(vozLabel).join(' · '), true);
            return vozSay('¿Cuál? ' + list.map(vozSpeak).join(', '));
        }
        const q = locsT.map(l => l.replace('Carro ', '')).join(' o ');
        vozShow(heard, '¿' + q + '?', true);
        return vozSay(vozSpeak(q) + '?');
    }
    vozApply({ ...top[0], remove }, heard, text);
}

function vozTabCommand(n) {
    const w = n.split(' ');
    if (w.length > 3) return null;
    if (/^(quirofano|quirofanos|qx|q)\b/.test(n)) {
        const num = vozTokens(n).nums[0];
        const t = `Quirófano ${num}`;
        return tabOrder.includes(t) ? t : null;
    }
    if (/^hemo/.test(n)) return 'Hemodinamia';
    if (/^(rea|reanimacion|reanima)/.test(n)) return 'Reanimación';
    if (/^(ucsi|u c s i|uxi|ucs)$/.test(n)) return 'UCSI';
    if (/^resumen$/.test(n)) return 'RESUMEN';
    return null;
}

// candidatos de la pestaña, ordenados por puntuación.
// Cada material se prueba con su nombre y con sus alias de voz; se queda la mejor forma.
function vozMatch(area, text) {
    const U = vozTokens(text);
    // carro dicho dentro de la frase («guantes anestesia pequeño») → preferencia, no cuenta como palabra
    const carroWords = U.words.filter(w => VOZ_CARRO[w]);
    U.words = U.words.filter(w => !VOZ_CARRO[w]);
    if (!U.words.length) return [];
    // también parejas juntas: «steri strip» ≈ SteryStrip
    const UW = [...U.words, ...U.words.slice(1).map((w, i) => U.words[i] + w)];
    const wordsOf = t => vozTokens(t).words.filter(w => w.length > 1 && !['r', 'u', 'rea', 'ucsi'].includes(w) && !VOZ_CARRO[w]);
    const out = [];
    for (const loc in inventoryData[area]) {
        inventoryData[area][loc].forEach(item => {
            const key = vozKey(item.name);
            const N = vozTokens(item.name);
            const variants = [wordsOf(item.name), ...(VOZ_ALIAS_N[key] || []).map(wordsOf)];
            // opciones con sus alias
            const optVars = (item.options || []).map(o => {
                const base = vozTokens(o.replace(/\(.*?\)/g, ''));
                if (base.nums.length) base.words = base.words.filter(w => !['g', 'mg', 'cc', 'ml', 'gr'].includes(w)); // unidades: 1g, 20cc
                const al = (VOZ_OPT_ALIAS_N[key + ID_SEP + vozKey(o)] || []).map(t => ({ words: vozTokens(t).words, nums: [] }));
                return { o, forms: [base, ...al] };
            });
            let bestC = null;
            variants.forEach(nameWords => {
                let matched = 0;
                nameWords.forEach(nw => { if (UW.some(uw => vozWordEq(uw, nw))) matched++; });
                let nums = U.nums.slice();
                const optHits = [];
                optVars.forEach(({ o, forms }) => {
                    let hit = null;
                    forms.forEach(O => {
                        const letter = O.words.length === 1 && !O.nums.length && VOZ_LETTER[O.words[0]];
                        const used = letter ? U.words.filter(uw => letter.includes(uw))
                            : O.words.length ? UW.filter(uw => O.words.some(ow => vozWordEq(uw, ow))) : [];
                        const wordHit = letter ? used.length > 0 : O.words.length > 0 && O.words.every(ow => UW.some(uw => vozWordEq(uw, ow)));
                        const numHit = O.nums.length > 0 && O.nums.every(on => nums.includes(on));
                        if ((O.nums.length ? numHit : wordHit) && (!hit || used.length > hit.used.length))
                            hit = { o, used, byWords: wordHit && !letter, nums: O.nums };
                    });
                    if (hit) optHits.push(hit);
                });
                // si dos opciones encajan con las mismas palabras, gana la más completa (Clorh. Alc. > Alcohol)
                const opts = optHits.filter(h => !optHits.some(k => k !== h && k.used.length > h.used.length && h.used.every(w => k.used.includes(w))));
                opts.forEach(h => h.nums.forEach(on => { const i = nums.indexOf(on); if (i >= 0) nums.splice(i, 1); }));
                const optWords = Math.max(0, ...opts.filter(h => h.byWords).map(h => h.used.length));
                if (!matched && !optWords) return;
                // las palabras de la opción no penalizan al nombre (Guantes sondaje = opción de Kit sondaje)
                let score = matched ? matched * 10 - (nameWords.length - matched) * 3 : 4 + optWords * 5;
                // números del nombre (TET 7,5 · Abocath 18G · Guedel #3 90mm) no son cantidad; el primero dicho identifica
                const hitNums = N.nums.filter(nn => nums.includes(nn));
                hitNums.forEach(nn => { score += 6 + (U.nums[0] === nn ? 2 : 0); nums.splice(nums.indexOf(nn), 1); });
                if (N.nums.length && !hitNums.length) score -= 4;
                if (opts.length && matched) score += 3 + optWords * 2;
                if (carroWords.some(w => VOZ_CARRO[w] === loc)) score += 5;
                const c = { area, loc, item, opts: opts.map(h => h.o), qty: nums.length ? Math.round(nums[0]) : null, score };
                if (!bestC || c.score > bestC.score) bestC = c;
            });
            if (bestC) out.push(bestC);
        });
    }
    return out.sort((a, b) => b.score - a.score);
}

function vozApply(c, heard, text = heard) {
    const { area, loc, item, opts, qty, remove } = c;
    const base = [area, loc, item.name].join(ID_SEP);
    const changes = [];
    let said;
    if (item.type === 'number') {
        const sel = document.getElementById(base);
        if (!sel) return;
        const v = remove ? 0 : Math.min(qty ?? 1, item.stock);
        changes.push({ el: sel, prev: sel.value });
        sel.value = String(v);
        said = remove ? `${item.name}, stock completo` : `${item.name}, faltan ${v}` + (qty > item.stock ? `, máximo ${item.stock}` : '');
    } else if (item.options?.length) {
        if (!opts.length) {
            voz.pending = { text, remove, keys: new Set([loc + ID_SEP + item.name]), n: 2, needOpt: true };
            vozShow(heard, `${vozLabel(item.name)}: ¿cuál? ${item.options.join(', ')}`, true);
            return vozSay(`${vozSpeak(item.name)}, ¿cuál?`);
        }
        opts.forEach(o => { const cb = document.getElementById([base, o].join(ID_SEP)); if (cb) { changes.push({ el: cb, prev: cb.checked }); cb.checked = !remove; } });
        said = `${item.name} ${opts.join(' y ')}` + (remove ? ', quitado' : '');
    } else {
        const cb = document.getElementById(base);
        if (!cb) return;
        changes.push({ el: cb, prev: cb.checked });
        cb.checked = !remove;
        said = item.name + (remove ? ', quitado' : '');
    }
    voz.undo.push(changes);
    voz.carro = loc;
    saveChecklistState();
    const row = changes[0]?.el.closest('.item');
    if (row) { row.scrollIntoView({ behavior: 'smooth', block: 'start' }); row.classList.remove('voz-flash'); void row.offsetWidth; row.classList.add('voz-flash'); }
    vozShow(heard, '✔ ' + vozLabel(said));
    vozSay(vozSpeak(said));
}

function vozUndo(heard) {
    const last = voz?.undo.pop();
    if (!last) { vozShow(typeof heard === 'string' ? heard : null, 'Nada que deshacer', true); return vozSay('Nada que deshacer'); }
    last.forEach(({ el, prev }) => { if (el.type === 'checkbox') el.checked = prev; else el.value = prev; });
    saveChecklistState();
    vozShow(typeof heard === 'string' ? heard : null, '↶ Deshecho');
    vozSay('Deshecho');
}

function openRef(key) {
    const d = REF_DATA[key]; if (!d) return;
    document.getElementById('ref-panel-title').textContent = d.title;
    document.getElementById('ref-panel-body').innerHTML = d.content;
    document.getElementById('ref-modal').classList.add('on');
}
function closeRef() {
    document.getElementById('ref-modal').classList.remove('on');
}
</script>
