<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba voz</title>
<style>
body{font:17px -apple-system,system-ui,sans-serif;margin:16px;background:#fff;color:#111;text-align:center}
h1{font-size:20px;margin:6px 0 12px}
#paso{font-size:24px;font-weight:700;min-height:64px;margin:14px 0;color:#0b57d0}
button{font-size:19px;padding:14px 22px;margin:6px;border-radius:12px;border:1.5px solid #0b57d0;background:#eaf1fd;color:#0b57d0;font-weight:600}
#l{white-space:pre-wrap;font:13px ui-monospace,Menlo,monospace;text-align:left;margin-top:14px;background:#f5f5f5;padding:10px;border-radius:8px}
</style></head><body>
<h1>Prueba de voz · Reposición</h1>
<button id="go">▶ Empezar prueba</button>
<div id="paso">Pulsa empezar y haz lo que ponga aquí</div>
<button id="cp" style="display:none">📋 Copiar resultado</button>
<div id="l"></div>
<script>
const t0=performance.now();
const L=t=>{document.getElementById('l').textContent+=((performance.now()-t0)/1000).toFixed(1)+'s '+t+'\n'};
const P=t=>{document.getElementById('paso').textContent=t; L('— '+t)};
const esp=ms=>new Promise(r=>setTimeout(r,ms));
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
L(navigator.userAgent); L('reconocimiento: '+(SR?'sí':'NO')+' · voz: '+(window.speechSynthesis?'sí':'NO'));
function habla(txt,maxMs){return new Promise(res=>{
  const u=new SpeechSynthesisUtterance(txt);u.lang='es-ES';let empezo=false,fin=false;
  u.onstart=()=>{empezo=true;L('voz EMPIEZA «'+txt+'»')};
  u.onend=()=>{fin=true;L('voz TERMINA');res('ok')};
  u.onerror=e=>{L('voz ERROR '+e.error);res('error')};
  speechSynthesis.speak(u);L('speak(«'+txt+'») llamado');
  setTimeout(()=>{if(!fin){L(empezo?'voz empezó pero NO avisó del final':'voz NUNCA empezó');res(empezo?'sinfin':'nada')}},maxMs||4000);});}
let rec,oido=[];
function nuevo(cont){const r=new SR();r.lang='es-ES';r.continuous=cont!==false;r.interimResults=true;L('micro nuevo · continuo='+r.continuous);
  ['start','audiostart','speechstart','end'].forEach(ev=>r.addEventListener(ev,()=>L('micro '+ev)));
  r.onerror=e=>L('micro ERROR '+e.error);
  r.onresult=e=>{const R=e.results[e.results.length-1],x=R[0].transcript;if(R.isFinal){oido.push(x);L('micro FRASE CERRADA «'+x+'»')}else L('micro oye a medias «'+x+'»')};return r;}
function arranca(){try{rec.start();L('start() sin fallo')}catch(e){L('start() FALLA '+e.name)}}
function finMicro(ms){return new Promise(res=>{let h=false;const f=()=>{if(!h){h=true;res()}};rec.addEventListener('end',f,{once:true});setTimeout(()=>{if(!h)L('micro no avisó de end');f()},ms)})}
document.getElementById('go').onclick=async()=>{
  document.getElementById('go').disabled=true;
  P('1/4 · Escucha: el móvil dice «uno»');
  await habla('uno');                       // dentro del toque
  await esp(500);
  P('2/4 · Di «PARACETAMOL» ahora');
  rec=nuevo();arranca();
  await esp(5000);
  L('oído hasta aquí: '+oido.length);
  P('3/4 · Con el micro abierto, el móvil intenta decir «dos». Luego di «EMPAPADORES»');
  await habla('dos');
  await esp(5000);
  L('oído hasta aquí: '+oido.length);
  P('4/4 · Apago micro, dice «tres» y lo vuelvo a encender. Luego di «JERINGAS»');
  try{rec.abort()}catch(e){}
  await finMicro(1500);
  await habla('tres');
  rec=nuevo(false);arranca();               // sin toque, modo frase a frase
  await esp(6000);
  L('oído total: '+oido.length+' → '+oido.join(' | '));
  try{rec.abort()}catch(e){}
  P('Hecho. Pulsa copiar y pégalo en el chat');
  document.getElementById('cp').style.display='inline-block';
};
document.getElementById('cp').onclick=async()=>{const t=document.getElementById('l').textContent;
  try{await navigator.clipboard.writeText(t);alert('Copiado')}catch(e){prompt('Copia:',t)}};
</script></body></html>
